name: Preproduction backup checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'src/index.js'
      - 'tests/backup-preprod-config.test.mjs'
      - 'docs/SAUVEGARDE-RESTAURATION-R2-PREPROD.md'
      - '.github/workflows/preprod-backup-checks.yml'
  push:
    branches: [staging-prochelia-v14]
    paths:
      - 'wrangler.jsonc'
      - 'src/index.js'
      - 'tests/backup-preprod-config.test.mjs'
      - 'docs/SAUVEGARDE-RESTAURATION-R2-PREPROD.md'
      - '.github/workflows/preprod-backup-checks.yml'

jobs:
  backup-config-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker JavaScript syntax
        run: node --check src/index.js
      - name: Run backup configuration regression tests
        run: node --test tests/backup-preprod-config.test.mjs
