name: Nexus Compliance Source Register
on:
  pull_request:
    paths:
      - 'docs/compliance/official-source-register-*.json'
      - 'src/nexus-compliance-source-register.js'
      - 'tests/nexus-compliance-source-register.test.mjs'
      - '.github/workflows/nexus-compliance-source-register.yml'
  push:
    branches: [main]
    paths:
      - 'docs/compliance/official-source-register-*.json'
      - 'src/nexus-compliance-source-register.js'
      - 'tests/nexus-compliance-source-register.test.mjs'
jobs:
  metadata-only-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/nexus-compliance-source-register.test.mjs tests/nexus-compliance-territory-matrix.test.mjs
