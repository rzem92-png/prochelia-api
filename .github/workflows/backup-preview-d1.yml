name: PROCHÉLIA — sauvegarde D1 préproduction chiffrée

on:
  workflow_dispatch:
  schedule:
    # UTC; décalé après l'heure pleine pour réduire les retards de planification.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: prochelia-preview-d1-backup
  cancel-in-progress: false

jobs:
  backup-preview:
    name: Exporter et chiffrer la D1 de préproduction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_NAME: prochelia-preview-db
      DB_ID: 6adb95e5-e542-4bec-9008-fbea01042305
      # Identifiant de compte confirmé depuis le tableau de bord Cloudflare fourni.
      CLOUDFLARE_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
    steps:
      - name: Vérifier les secrets requis et la cible Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN BACKUP_ENCRYPTION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret requis manquant : $name"
              exit 1
            fi
          done
          if [[ "$DB_NAME" != "prochelia-preview-db" || "$DB_ID" != "6adb95e5-e542-4bec-9008-fbea01042305" ]]; then
            echo "::error::Garde-fou : la cible n'est pas la D1 de préproduction attendue."
            exit 1
          fi
          api_token="$CLOUDFLARE_API_TOKEN"
          api_token="${api_token#Bearer }"
          api_token="${api_token#bearer }"
          api_token="$(printf "%s" "$api_token" | tr -d "\r\n")"
          if [[ -z "$api_token" ]]; then echo "::error::Le secret CLOUDFLARE_API_TOKEN est vide après normalisation."; exit 1; fi
          printf "CLOUDFLARE_API_TOKEN=%s\n" "$api_token" >> "$GITHUB_ENV"

          verify_file="$RUNNER_TEMP/cloudflare-token-verify.json"
          verify_status="$(curl --silent --show-error --output "$verify_file" --write-out '%{http_code}' -H "Authorization: Bearer $api_token" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          verify_response="$(cat "$verify_file")"
          verify_success="$(printf '%s' "$verify_response" | jq -r '.success // false')"
          verify_token_status="$(printf '%s' "$verify_response" | jq -r '.result.status // "inconnu"')"
          if [[ "$verify_status" != "200" || "$verify_success" != "true" || "$verify_token_status" != "active" ]]; then
            verify_codes="$(printf '%s' "$verify_response" | jq -r '[.errors[]?.code // empty] | join(",")')"
            verify_messages="$(printf '%s' "$verify_response" | jq -r '[.errors[]?.message // empty] | join(" | ")')"
            echo "::error::Jeton Cloudflare refusé par /user/tokens/verify (HTTP $verify_status, statut=$verify_token_status, codes=${verify_codes:-aucun}). ${verify_messages:-Vérifier le secret du jeton.}"
            exit 1
          fi
          echo "Jeton Cloudflare valide et actif ; secret masqué."
          response_file="$RUNNER_TEMP/cloudflare-d1-check.json"
          http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' -H "Authorization: Bearer $api_token" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$DB_NAME")"
          response="$(cat "$response_file")"
          if [[ "$http_status" != "200" ]]; then
            error_codes="$(printf '%s' "$response" | jq -r '[.errors[]?.code // empty] | join(",")')"
            error_messages="$(printf '%s' "$response" | jq -r '[.errors[]?.message // empty] | join(" | ")')"
            echo "::error::Échec de la liste D1 Cloudflare HTTP $http_status. Codes: ${error_codes:-non fournis}. Détails: ${error_messages:-aucun détail retourné}. Vérifier CLOUDFLARE_ACCOUNT_ID et les autorisations D1 Read du jeton."
            exit 1
          fi
          success="$(printf '%s' "$response" | jq -r '.success // false')"
          if [[ "$success" != "true" ]]; then
            echo "::error::Cloudflare n'a pas confirmé la liste des bases D1."
            exit 1
          fi
          match_count="$(printf '%s' "$response" | jq --arg name "$DB_NAME" --arg id "$DB_ID" '[.result[]? | select(.name == $name and .uuid == $id)] | length')"
          if [[ "$match_count" != "1" ]]; then
            actual_ids="$(printf '%s' "$response" | jq -r --arg name "$DB_NAME" '[.result[]? | select(.name == $name) | .uuid] | join(",")')"
            echo "::error::La liste D1 est accessible, mais la correspondance exacte nom/UUID est absente. Base attendue: $DB_NAME ; UUID configuré: $DB_ID ; UUID trouvé pour ce nom: ${actual_ids:-aucun}. Vérifier DB_ID avant de poursuivre."
            exit 1
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Exporter uniquement la D1 de préproduction
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/prochelia-backup"
          npx --yes wrangler@4 d1 export "$DB_NAME" --remote --skip-confirmation --output="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          test -s "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"

      - name: Chiffrer et vérifier l'export
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          plaintext="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          encrypted="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$encrypted" "$plaintext"
          test -s "$encrypted"
          expected="$(sha256sum "$plaintext" | cut -d ' ' -f 1)"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$encrypted" > "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          actual="$(sha256sum "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql" | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          rm -f "$plaintext" "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          printf 'database=%s\ncreated_utc=%s\nencrypted_file=prochelia-preview.sql.gpg\n' "$DB_NAME" "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/prochelia-backup/README.txt"

      - name: Publier uniquement l'archive chiffrée
        uses: actions/upload-artifact@v6
        with:
          name: prochelia-preview-d1-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prochelia-backup/prochelia-preview.sql.gpg
            ${{ runner.temp }}/prochelia-backup/README.txt
          if-no-files-found: error
          retention-days: 7
