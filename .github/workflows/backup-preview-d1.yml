name: PROCHÉLIA — sauvegarde D1 préproduction chiffrée

on:
  workflow_dispatch:
  schedule:
    # GitHub n'exécute les événements schedule que depuis la branche par défaut.
    # Tant que ce workflow reste sur la branche de préproduction, lancer via Actions > Run workflow.
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: prochelia-preview-d1-backup
  cancel-in-progress: false

jobs:
  backup-preview:
    name: Exporter et chiffrer la D1 de préproduction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      EXPECTED_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
      DB_NAME: prochelia-preview-db
      DB_ID: 6adb95e5-e542-4bec-9008-fbea01042305
    steps:
      - name: Récupérer la branche de préproduction
        uses: actions/checkout@v4
        with:
          ref: prelaunch/v14.5.7-consolidation-audit

      - name: Vérifier les secrets et verrouiller la cible D1
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BACKUP_ENCRYPTION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret requis manquant : $name"
              exit 1
            fi
          done
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID" || {
            echo "::error::Le compte Cloudflare ne correspond pas au compte de préproduction attendu."
            exit 1
          }
          test "$DB_NAME" = "prochelia-preview-db"
          test "$DB_ID" = "6adb95e5-e542-4bec-9008-fbea01042305"
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("wrangler.jsonc").read_text(encoding="utf-8"))
          assert config.get("name") == "prochelia-api-staging", "Worker inattendu"
          databases = config.get("d1_databases", [])
          assert len(databases) == 1, "Nombre de bases D1 inattendu"
          db = databases[0]
          assert db.get("binding") == "DB", "Binding D1 inattendu"
          assert db.get("database_name") == "prochelia-preview-db", "Nom D1 inattendu"
          assert db.get("database_id") == "6adb95e5-e542-4bec-9008-fbea01042305", "UUID D1 inattendu"
          print("PASS: Worker staging et UUID exact de la D1 préproduction vérifiés")
          PY

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier l'identité réelle du compte Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          identity="$(npx --yes wrangler@4 whoami 2>&1)"
          printf '%s\\n' "$identity"
          printf '%s' "$identity" | grep -Fq "$EXPECTED_ACCOUNT_ID" || {
            echo "::error::Le compte Cloudflare authentifié ne correspond pas à la cible attendue."
            exit 1
          }

      - name: Exporter uniquement la D1 de préproduction
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/prochelia-backup"
          npx --yes wrangler@4 d1 export "$DB_NAME" --remote --config wrangler.jsonc --skip-confirmation --output="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          test -s "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"

      - name: Chiffrer l'export avant toute conservation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plaintext="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          encrypted="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg"
          # La clé passe par l'environnement et stdin, pas comme argument de processus.
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$encrypted" "$plaintext"
          test -s "$encrypted"
          # Vérifier le déchiffrement et comparer les empreintes avant de supprimer les fichiers clairs.
          expected="$(sha256sum "$plaintext" | cut -d ' ' -f 1)"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$encrypted" > "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          actual="$(sha256sum "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql" | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          rm -f "$plaintext" "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          # Le manifeste de contrôle ne contient ni données ni secret.
          printf 'database=%s\\ncreated_utc=%s\\nencrypted_file=prochelia-preview.sql.gpg\\nsha256=%s\\n' "$DB_NAME" "$(date -u +%FT%TZ)" "$expected" > "$RUNNER_TEMP/prochelia-backup/README.txt"

      - name: Publier uniquement l'archive chiffrée
        uses: actions/upload-artifact@v4
        with:
          name: prochelia-preview-d1-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prochelia-backup/prochelia-preview.sql.gpg
            ${{ runner.temp }}/prochelia-backup/README.txt
          if-no-files-found: error
          retention-days: 7
