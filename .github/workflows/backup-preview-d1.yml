name: PROCHÉLIA — sauvegarde D1 préproduction chiffrée

on:
  workflow_dispatch:
  schedule:
    # UTC; décalé après l'heure pleine pour réduire les retards de planification.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: prochelia-preview-d1-backup
  cancel-in-progress: false

jobs:
  backup-preview:
    name: Exporter, chiffrer et vérifier la D1 de préproduction
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_NAME: prochelia-preview-eu-2026-11-17
      DB_ID: e3cf167c-37e1-4d72-9ac6-b3e27c14b97f
      CLOUDFLARE_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
      R2_BUCKET: prochelia-preview-backups-eu-locked
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout exact workflow commit for pinned Preview D1 config
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Vérifier les secrets requis et la cible Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_EU_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_EU_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN BACKUP_ENCRYPTION_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret requis manquant : $name"
              exit 1
            fi
          done
          if [[ "$DB_NAME" != "prochelia-preview-eu-2026-11-17" || "$DB_ID" != "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f" ]]; then
            echo "::error::Garde-fou : la cible n'est pas la D1 de préproduction attendue."
            exit 1
          fi
          api_token="$CLOUDFLARE_API_TOKEN"
          api_token="${api_token#Bearer }"
          api_token="${api_token#bearer }"
          api_token="$(printf "%s" "$api_token" | tr -d "\r\n")"
          if [[ -z "$api_token" ]]; then echo "::error::Le secret CLOUDFLARE_API_TOKEN est vide après normalisation."; exit 1; fi
          printf "CLOUDFLARE_API_TOKEN=%s\n" "$api_token" >> "$GITHUB_ENV"

          verify_file="$RUNNER_TEMP/cloudflare-token-verify.json"
          verify_status="$(curl --silent --show-error --output "$verify_file" --write-out '%{http_code}' -H "Authorization: Bearer $api_token" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          verify_response="$(cat "$verify_file")"
          verify_success="$(printf '%s' "$verify_response" | jq -r '.success // false')"
          verify_token_status="$(printf '%s' "$verify_response" | jq -r '.result.status // "inconnu"')"
          if [[ "$verify_status" != "200" || "$verify_success" != "true" || "$verify_token_status" != "active" ]]; then
            verify_codes="$(printf '%s' "$verify_response" | jq -r '[.errors[]?.code // empty] | join(",")')"
            verify_messages="$(printf '%s' "$verify_response" | jq -r '[.errors[]?.message // empty] | join(" | ")')"
            echo "::error::Jeton Cloudflare refusé par /user/tokens/verify (HTTP $verify_status, statut=$verify_token_status, codes=${verify_codes:-aucun}). ${verify_messages:-Vérifier le secret du jeton.}"
            exit 1
          fi
          echo "Jeton Cloudflare valide et actif ; secret masqué."
          response_file="$RUNNER_TEMP/cloudflare-d1-check.json"
          http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' -H "Authorization: Bearer $api_token" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$DB_NAME")"
          response="$(cat "$response_file")"
          if [[ "$http_status" != "200" ]]; then
            error_codes="$(printf '%s' "$response" | jq -r '[.errors[]?.code // empty] | join(",")')"
            error_messages="$(printf '%s' "$response" | jq -r '[.errors[]?.message // empty] | join(" | ")')"
            echo "::error::Échec de la liste D1 Cloudflare HTTP $http_status. Codes: ${error_codes:-non fournis}. Détails: ${error_messages:-aucun détail retourné}. Vérifier CLOUDFLARE_ACCOUNT_ID et les autorisations D1 Read du jeton."
            exit 1
          fi
          success="$(printf '%s' "$response" | jq -r '.success // false')"
          if [[ "$success" != "true" ]]; then
            echo "::error::Cloudflare n'a pas confirmé la liste des bases D1."
            exit 1
          fi
          match_count="$(printf '%s' "$response" | jq --arg name "$DB_NAME" --arg id "$DB_ID" '[.result[]? | select(.name == $name and .uuid == $id)] | length')"
          eu_jurisdiction="$(printf '%s' "$response" | jq -r --arg name "$DB_NAME" --arg id "$DB_ID" '.result[]? | select(.name == $name and .uuid == $id) | .jurisdiction // ""')"
          if [[ "$eu_jurisdiction" != "eu" ]]; then
            echo "::error::La juridiction EU de la D1 de préproduction n'est pas confirmée."
            exit 1
          fi
          if [[ "$match_count" != "1" ]]; then
            actual_ids="$(printf '%s' "$response" | jq -r --arg name "$DB_NAME" '[.result[]? | select(.name == $name) | .uuid] | join(",")')"
            echo "::error::La correspondance exacte nom/UUID D1 est absente. UUID trouvé : ${actual_ids:-aucun}."
            exit 1
          fi

          r2_status="$(curl --silent --show-error --output "$RUNNER_TEMP/r2-bucket-check.json" --write-out '%{http_code}' -H "Authorization: Bearer $api_token" -H 'cf-r2-jurisdiction: eu' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET")"
          if [[ "$r2_status" != "200" ]]; then
            echo "::error::Le bucket R2 EU attendu n'est pas accessible (HTTP $r2_status). Aucun export D1 ne sera lancé."
            exit 1
          fi
          jq -e --arg bucket "$R2_BUCKET" '.success == true and .result.name == $bucket and .result.jurisdiction == "eu"' "$RUNNER_TEMP/r2-bucket-check.json" >/dev/null || {
            echo "::error::Le bucket R2 ne correspond pas exactement au bucket Preview en juridiction EU."
            exit 1
          }
          echo "Bucket R2 dédié confirmé en juridiction EU."

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Exporter uniquement la D1 de préproduction
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/prochelia-backup"
          npx --yes wrangler@4 d1 export "$DB_NAME" --remote --config wrangler.preview-migrations.jsonc --skip-confirmation --output="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          test -s "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"

      - name: Chiffrer et vérifier l'export
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          plaintext="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          encrypted="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$encrypted" "$plaintext"
          test -s "$encrypted"
          expected="$(sha256sum "$plaintext" | cut -d ' ' -f 1)"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$encrypted" > "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          actual="$(sha256sum "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql" | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          printf '%s\n' "$expected" > "$RUNNER_TEMP/prochelia-backup/manifest.sha256"
          rm -f "$plaintext" "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          printf 'database=%s\ncreated_utc=%s\nencrypted_file=prochelia-preview.sql.gpg\n' "$DB_NAME" "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/prochelia-backup/README.txt"

      - name: Installer AWS CLI et SQLite pour le contrôle de restauration
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sqlite3
          python3 -m pip install --user --break-system-packages awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Déposer l'archive chiffrée dans le bucket R2 EU dédié
        id: upload
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_EU_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_EU_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          key="preview-d1/${DB_NAME}/$(date -u +%Y/%m/%d)/${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}.sql.gpg"
          echo "R2_OBJECT_KEY=$key" >> "$GITHUB_ENV"
          aws s3 cp "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg" "s3://$R2_BUCKET/$key" --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.eu.r2.cloudflarestorage.com" --region auto --only-show-errors
          aws s3 cp "$RUNNER_TEMP/prochelia-backup/manifest.sha256" "s3://$R2_BUCKET/$key.sha256" --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.eu.r2.cloudflarestorage.com" --region auto --only-show-errors

      - name: Télécharger, vérifier et restaurer localement la copie R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_EU_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_EU_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.eu.r2.cloudflarestorage.com"
          key="$R2_OBJECT_KEY"
          aws s3 cp "s3://$R2_BUCKET/$key" "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sql.gpg" --endpoint-url "$endpoint" --region auto --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$key.sha256" "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sha256" --endpoint-url "$endpoint" --region auto --only-show-errors
          cmp "$RUNNER_TEMP/prochelia-backup/manifest.sha256" "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sha256"
          cmp "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg" "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sql.gpg"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sql.gpg" > "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sql"
          actual="$(sha256sum "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sql" | cut -d ' ' -f 1)"
          expected="$(tr -d '[:space:]' < "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sha256")"
          test "$actual" = "$expected"
          sqlite3 "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sqlite" < "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sql"
          integrity="$(sqlite3 "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sqlite" 'PRAGMA integrity_check;')"
          test "$integrity" = "ok"
          foreign_keys="$(sqlite3 "$RUNNER_TEMP/prochelia-backup/r2-roundtrip.sqlite" 'PRAGMA foreign_key_check;')"
          test -z "$foreign_keys"
          echo "PASS: R2 EU upload/download, GPG decryption, SHA-256, SQLite integrity_check and foreign_key_check verified."

      - name: Publier une copie chiffrée de diagnostic à rétention courte
        uses: actions/upload-artifact@v6
        with:
          name: prochelia-preview-d1-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prochelia-backup/prochelia-preview.sql.gpg
            ${{ runner.temp }}/prochelia-backup/README.txt
          if-no-files-found: error
          retention-days: 7
