name: Public market registry API tests

on:
  pull_request:
    paths:
      - 'src/v7-routes.js'
      - 'src/market-localization.js'
      - 'tests/market-registry-api.test.mjs'
      - '.github/workflows/market-registry-api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/v7-routes.js'
      - 'src/market-localization.js'
      - 'tests/market-registry-api.test.mjs'
      - '.github/workflows/market-registry-api-tests.yml'

permissions:
  contents: read

jobs:
  market-api-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-default-type=module --test tests/market-registry-api.test.mjs
