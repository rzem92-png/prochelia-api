name: Isolated hardening CI
on:
  push:
    branches:
      - hardening/preview-release-gates-v1
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: hardening-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Verify isolated Worker configuration only
        run: npm run check:worker:preview
