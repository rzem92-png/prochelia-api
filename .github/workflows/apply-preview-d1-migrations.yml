name: PROCHÉLIA — appliquer migrations D1 préproduction

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: "Saisir exactement APPLY_PREVIEW_ONLY pour autoriser la migration de préproduction"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prochelia-preview-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-preview:
    if: ${{ github.event.inputs.confirm_preview == 'APPLY_PREVIEW_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      EXPECTED_DB_NAME: prochelia-preview-db
      EXPECTED_DB_ID: 6adb95e5-e542-4bec-9008-fbea01042305
      EXPECTED_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
    steps:
      - name: Checkout preproduction branch
        uses: actions/checkout@v4
        with:
          ref: 7e71cd09531d50f9a76567e39e8feea95787e388

      - name: Verify credentials, exact target and migration files
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BACKUP_ENCRYPTION_KEY; do
            test -n "${!name:-}" || { echo "::error::Required secret missing: $name"; exit 1; }
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("wrangler.jsonc").read_text())
          assert config["name"] == "prochelia-api", "Unexpected PROCHÉLIA Worker name"
          preview = config.get("previews", {}).get("d1_databases", [])
          db = next((x for x in preview if x.get("binding") == "DB"), None)
          assert db is not None, "Preview D1 binding DB is missing"
          assert db.get("database_name") == "prochelia-preview-db", "Unexpected Preview D1 name"
          assert db.get("database_id") == "6adb95e5-e542-4bec-9008-fbea01042305", "Unexpected Preview D1 UUID"
          assert len(preview) == 1, "Unexpected additional Preview D1 binding"
          # Build a dedicated Wrangler config so every D1 command resolves only to Preview,
          # never to the production database declared in the main wrangler.jsonc.
          migration_config = {
            "name": "prochelia-api-preview-migrations",
            "compatibility_date": config["compatibility_date"],
            "d1_databases": [{
              "binding": "DB",
              "database_name": db["database_name"],
              "database_id": db["database_id"],
              "migrations_dir": "migrations"
            }]
          }
          Path(__import__("os").environ["RUNNER_TEMP"], "wrangler.preview-migrations.json").write_text(
            json.dumps(migration_config, indent=2) + "\n"
          )
          for name in (
            "0001_core_business_schema.sql",
            "0002_server_pricing.sql",
            "0003_route_address_provenance.sql",
            "0004_atomic_wallet_ledger.sql",
            "0019_dsa_pending_appeal_unique_guard.sql",
          ):
            p = Path("migrations") / name
            assert p.is_file() and p.stat().st_size > 0, f"Missing migration: {name}"
          import hashlib
          repair = Path("migrations/0019_dsa_pending_appeal_unique_guard.sql").read_bytes()
          expected_sha256 = "b7016bcddee84c8487c7685cda438ae6ec1c3a1d1c7053b5e69bc2f084598fc0"
          assert hashlib.sha256(repair).hexdigest() == expected_sha256, "Migration 0019 checksum mismatch"
          print("PASS: PROCHÉLIA Worker, isolated Preview D1 config, migration 0019 and pinned checksum verified")
          PY
          test "$EXPECTED_DB_NAME" = "prochelia-preview-db"
          test "$EXPECTED_DB_ID" = "6adb95e5-e542-4bec-9008-fbea01042305"
          test "$EXPECTED_ACCOUNT_ID" = "f2a79e9fa41566a8ec80fb24c02c60eb"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare account identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret does not match the pinned expected account."
            exit 1
          fi

          set +e
          identity="$(npx --yes wrangler@4 whoami 2>&1)"
          status=$?
          set -e

          safe_identity="${identity//"$CLOUDFLARE_API_TOKEN"/[REDACTED]}"
          printf '%s\\n' "$safe_identity"

          if [ "$status" -ne 0 ]; then
            echo "::error::Wrangler authentication failed. Check token validity and Cloudflare permissions."
            exit 1
          fi

          if ! printf '%s' "$safe_identity" | grep -Fq "$EXPECTED_ACCOUNT_ID"; then
            echo "::error::Cloudflare account ID returned by Wrangler does not match the pinned expected account."
            exit 1
          fi

          echo "Cloudflare identity verified."

      - name: Export only Preview D1 before migration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/prochelia-backup"
          npx --yes wrangler@4 d1 export "$EXPECTED_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.preview-migrations.json" --skip-confirmation --output="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          test -s "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"

      - name: Encrypt and verify fresh backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plaintext="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          encrypted="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$encrypted" "$plaintext"
          test -s "$encrypted"
          expected="$(sha256sum "$plaintext" | cut -d ' ' -f 1)"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$encrypted" > "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          actual="$(sha256sum "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql" | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          rm -f "$plaintext" "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          printf 'database=%s\ncreated_utc=%s\nencrypted_file=prochelia-preview.sql.gpg\n' "$EXPECTED_DB_NAME" "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/prochelia-backup/README.txt"

      - name: Publish encrypted backup before any schema write
        uses: actions/upload-artifact@v4
        with:
          name: prochelia-preview-pre-migration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prochelia-backup/prochelia-preview.sql.gpg
            ${{ runner.temp }}/prochelia-backup/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Show pending migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list "$EXPECTED_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.preview-migrations.json"

      - name: Assert the only pending migration is the audited DSA repair
        shell: bash
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/prochelia-preview-migration-state.json"
          npx --yes wrangler@4 d1 execute "$EXPECTED_DB_NAME" --remote --json --config "$RUNNER_TEMP/wrangler.preview-migrations.json" --command "SELECT name FROM d1_migrations ORDER BY name;" > "$state_file"
          python3 - "$state_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          applied = set()

          def collect(value):
              if isinstance(value, dict):
                  name = value.get("name")
                  if isinstance(name, str) and name.endswith(".sql"):
                      applied.add(name)
                  for child in value.values():
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)

          collect(payload)
          migration_files = sorted(p.name for p in Path("migrations").glob("*.sql"))
          assert "0018_dsa_ai_act_transparency_redress.sql" in applied, (
              "DSA schema migration 0018 is not recorded; refusing to apply repair out of sequence"
          )
          pending = sorted(name for name in migration_files if name not in applied)
          expected = ["0019_dsa_pending_appeal_unique_guard.sql"]
          assert pending == expected, (
              f"Unexpected pending migration set: {pending!r}; expected exactly {expected!r}"
          )
          print("PASS: the sole pending migration is 0019_dsa_pending_appeal_unique_guard.sql")
          PY

          duplicates_file="$RUNNER_TEMP/prochelia-preview-pending-appeal-duplicates.json"
          npx --yes wrangler@4 d1 execute "$EXPECTED_DB_NAME" --remote --json --config "$RUNNER_TEMP/wrangler.preview-migrations.json" --command "SELECT decision_id, appellant_user_id, COUNT(*) AS pending_count FROM moderation_appeals WHERE status IN ('SUBMITTED','UNDER_REVIEW') GROUP BY decision_id, appellant_user_id HAVING COUNT(*) > 1;" > "$duplicates_file"
          python3 - "$duplicates_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          rows = []

          def collect(value):
              if isinstance(value, dict):
                  result = value.get("results")
                  if isinstance(result, list):
                      rows.extend(row for row in result if isinstance(row, dict) and "pending_count" in row)
                  for child in value.values():
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)

          collect(payload)
          assert not rows, f"Duplicate pending appeals would block the unique index: {rows!r}"
          print("PASS: no duplicate pending appeals; unique index can be applied safely")
          PY

      - name: Apply migrations to Preview D1 only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply "$EXPECTED_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.preview-migrations.json"

      - name: Verify migration status and DSA uniqueness guard
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list "$EXPECTED_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.preview-migrations.json"

          index_file="$RUNNER_TEMP/prochelia-preview-index.json"
          ledger_file="$RUNNER_TEMP/prochelia-preview-ledger.json"
          quick_file="$RUNNER_TEMP/prochelia-preview-quick-check.json"

          npx --yes wrangler@4 d1 execute "$EXPECTED_DB_NAME" --remote --json --config "$RUNNER_TEMP/wrangler.preview-migrations.json" --command "SELECT name FROM sqlite_master WHERE type='index' AND name='uq_moderation_appeals_pending';" > "$index_file"
          npx --yes wrangler@4 d1 execute "$EXPECTED_DB_NAME" --remote --json --config "$RUNNER_TEMP/wrangler.preview-migrations.json" --command "SELECT name FROM d1_migrations WHERE name='0019_dsa_pending_appeal_unique_guard.sql';" > "$ledger_file"
          npx --yes wrangler@4 d1 execute "$EXPECTED_DB_NAME" --remote --json --config "$RUNNER_TEMP/wrangler.preview-migrations.json" --command "PRAGMA quick_check;" > "$quick_file"

          python3 - "$index_file" "$ledger_file" "$quick_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          def values(payload, key):
              found = []
              def walk(value):
                  if isinstance(value, dict):
                      if key in value:
                          found.append(value[key])
                      for child in value.values():
                          walk(child)
                  elif isinstance(value, list):
                      for child in value:
                          walk(child)
              walk(payload)
              return found

          index_payload, ledger_payload, quick_payload = [
              json.loads(Path(name).read_text()) for name in sys.argv[1:]
          ]
          index_names = values(index_payload, "name")
          ledger_names = values(ledger_payload, "name")
          quick_checks = values(quick_payload, "quick_check")

          assert "uq_moderation_appeals_pending" in index_names, (
              f"Expected unique index not found in D1 response: {index_payload!r}"
          )
          assert "0019_dsa_pending_appeal_unique_guard.sql" in ledger_names, (
              f"Migration 0019 is missing from D1 migration ledger: {ledger_payload!r}"
          )
          assert quick_checks == ["ok"], (
              f"PRAGMA quick_check did not return exactly one OK result: {quick_payload!r}"
          )
          print("PASS: migration 0019 is recorded, its unique index exists, and D1 quick_check is OK.")
          PY
