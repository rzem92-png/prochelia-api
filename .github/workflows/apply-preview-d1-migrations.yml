          jq -n --arg sql "SELECT name FROM d1_migrations WHERE name IN ('0016_security_identity_schema.sql','0020_auth_login_rate_limits.sql','0021_supra_audit_events.sql','0022_supra_persisted_approvals.sql','0029_supra_append_only_audit_guards.sql','0030_supra_audit_tenant_scope.sql','0031_operational_marketplace_tenant_scope.sql','0032_privacy_safe_cross_tenant_mission_marketplace.sql','0033_intervenant_availability_overlap_guard.sql','0034_timezone_safe_availability_overlap.sql','0035_validate_availability_intervals.sql','0036_intervenant_availability_idempotency.sql','0037_support_cases_tenant_isolation.sql','0038_identity_verification_tenant_scope.sql','0039_cryptographic_device_enrollment.sql','0040_accounting_active_state_at_posting.sql','0041_tenant_invitation_onboarding.sql','0042_financial_tenant_scope.sql','0043_finance_workspace_tenant_scope.sql','0044_security_records_tenant_scope.sql','0045_master_complement_seed_data.sql') ORDER BY name" '{sql:$sql,params:[]}' > "$migrations_payload"
          jq -n '{sql:"SELECT type, name, sql FROM sqlite_master WHERE (type = '"'"'table'"'"' AND name IN ('"'"'identity_verifications'"'"','"'"'trusted_devices'"'"','"'"'mission_security'"'"','"'"'mission_security_attempts'"'"','"'"'security_audit'"'"','"'"'trusted_device_credentials'"'"','"'"'device_auth_challenges'"'"','"'"'auth_login_rate_limits'"'"','"'"'supra_audit_events'"'"','"'"'supra_approval_requests'"'"','"'"'supra_approval_votes'"'"','"'"'support_cases','supra_approval_events'"'"')) OR (type = '"'"'index'"'"' AND name IN ('"'"'idx_identity_verifications_user'"'"','"'"'idx_identity_verifications_tenant_user_status'"'"','"'"'idx_trusted_device_credentials_tenant_user_status'"'"','"'"'idx_device_auth_challenges_session_expiry'"'"','"'"'idx_device_auth_challenges_pending'"'"','"'"'idx_mission_security_intervenant'"'"','"'"'idx_security_attempts_security'"'"','"'"'idx_security_audit_mission'"'"','"'"'idx_auth_login_rate_limits_window'"'"','"'"'idx_supra_audit_events_created_at'"'"','"'"'idx_supra_audit_events_tenant_created_at'"'"','"'"'idx_supra_audit_events_actor'"'"','"'"'idx_supra_approval_requests_status_expiry'"'"','"'"'idx_supra_approval_requests_tenant_resource'"'"','"'"'idx_supra_approval_votes_request'"'"','"'"'idx_supra_approval_events_request','idx_support_cases_tenant_status_created','idx_support_cases_tenant_requester_created'"'"')) OR (type = '"'"'trigger'"'"' AND name IN ('"'"'trg_supra_audit_events_require_active_tenant'"'"','"'"'trg_supra_approval_requests_immutable'"'"','"'"'trg_supra_approval_votes_no_update'"'"','"'"'trg_supra_approval_votes_no_delete'"'"','"'"'trg_supra_approval_events_no_update'"'"','"'"'trg_supra_approval_events_no_delete'"'"','"'"'trg_supra_approval_status_transitions'"'"','"'"'trg_supra_approval_status_evidence'"'"')) ORDER BY type, name",params:[]}' > "$objects_payload"
