name: PROCHÉLIA — appliquer migrations D1 préproduction

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: "Saisir exactement APPLY_PREVIEW_ONLY pour autoriser la migration de préproduction"
        required: true
        type: string
      restore_test_db_name:
        description: "Nom de la D1 de restauration isolée EU (préfixe prochelia-restore-test- ou prochelia-r2-restore-validation-)"
        required: true
        type: string
      restore_test_db_id:
        description: "UUID exact de cette D1 isolée EU"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prochelia-preview-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-preview:
    if: ${{ false && github.ref == 'refs/heads/fix/pages-proxy-preview-cors-2026-11-23' && github.actor == 'rzem92-png' && inputs.confirm_preview == 'APPLY_PREVIEW_ONLY' }} # Fail closed: superseded 46-file chain conflicts with canonical 47-file PR #359.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_ATTESTATION_HMAC_KEY: ${{ secrets.BACKUP_ATTESTATION_HMAC_KEY }}
      R2_EXPECTED_RETENTION_SECONDS: ${{ vars.R2_EXPECTED_RETENTION_SECONDS }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_EU_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_EU_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: prochelia-preview-backups-eu-v2
      R2_ENDPOINT: https://f2a79e9fa41566a8ec80fb24c02c60eb.eu.r2.cloudflarestorage.com
      EXPECTED_DB_NAME: prochelia-preview-eu-2026-11-17
      EXPECTED_DB_ID: e3cf167c-37e1-4d72-9ac6-b3e27c14b97f
      EXPECTED_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
      FORBIDDEN_PRODUCTION_DB_ID: 04f52830-ef5a-4f17-a640-42bbc2381bba
      RESTORE_TEST_DB_NAME: ${{ inputs.restore_test_db_name }}
      RESTORE_TEST_DB_ID: ${{ inputs.restore_test_db_id }}
    steps:
      - name: Checkout exact reviewed migration source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Verify credentials, exact Preview target and complete migration chain
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BACKUP_ENCRYPTION_KEY BACKUP_ATTESTATION_HMAC_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!name:-}" || { echo "::error::Required secret missing: $name"; exit 1; }
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path("wrangler.preview-migrations.jsonc").read_text()
          clean = "\n".join(line for line in raw.splitlines() if not line.lstrip().startswith("//"))
          config = json.loads(clean)
          dbs = config["d1_databases"]
          assert len(dbs) == 1, "Unexpected additional D1 binding"
          db = dbs[0]
          assert db["binding"] == "PREVIEW_DB"
          assert db["database_name"] == "prochelia-preview-eu-2026-11-17"
          assert db["database_id"] == "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f"
          assert db["migrations_dir"] == "migrations-preview-canonical"

          expected = [
            "0000_auth_foundation.sql",
            "0001_core_business_schema.sql",
            "0002_server_pricing.sql",
            "0003_route_address_provenance.sql",
            "0004_atomic_wallet_ledger.sql",
            "0005_security_rate_limits.sql",
            "0006_copilot_schema.sql",
            "0007_trust_passport_schema.sql",
            "0008_commercial_recruitment_schema.sql",
            "0009_finance_workspace_schema.sql",
            "0010_strategic_schema.sql",
            "0011_final_hardening_schema.sql",
            "0012_national_continuity_schema.sql",
            "0013_master_complement_schema.sql",
            "0014_operational_schema.sql",
            "0015_production_security_events.sql",
            "0016_security_identity_schema.sql",
            "0017_document_security_scans.sql",
            "0018_consolidated_business_schema.sql",
            "0019_backup_verifications.sql",
            "0020_auth_login_rate_limits.sql",
            "0021_supra_audit_events.sql",
            "0022_supra_persisted_approvals.sql",
            "0023_tenant_double_entry_accounting.sql",
            "0024_tenant_membership_authority.sql",
            "0025_session_revocation.sql",
            "0026_accounting_currency_consistency.sql",
            "0027_tenant_membership_identity_immutable.sql",
            "0028_tenant_accounting_entity_delete_guard.sql",
            "0029_supra_append_only_audit_guards.sql",
            "0030_supra_audit_tenant_scope.sql",
            "0031_operational_marketplace_tenant_scope.sql",
            "0032_privacy_safe_cross_tenant_mission_marketplace.sql",
            "0033_intervenant_availability_overlap_guard.sql",
            "0034_timezone_safe_availability_overlap.sql",
            "0035_validate_availability_intervals.sql",
            "0036_intervenant_availability_idempotency.sql",
            "0037_support_cases_tenant_isolation.sql",
            "0038_identity_verification_tenant_scope.sql",
            "0039_cryptographic_device_enrollment.sql",
            "0040_accounting_active_state_at_posting.sql",
            "0041_tenant_invitation_onboarding.sql",
            "0042_financial_tenant_scope.sql",
            "0043_finance_workspace_tenant_scope.sql",
            "0044_security_records_tenant_scope.sql",
            "0045_master_complement_seed_data.sql"
          ]
          actual = sorted(p.name for p in Path("migrations-preview-canonical").glob("*.sql"))
          assert actual == sorted(expected), (
            f"Migration chain mismatch. Expected {len(expected)} canonical files, "
            f"found {len(actual)}. No migration will run."
          )
          canonical_dir = Path("migrations-preview-canonical")
          for name in expected:
            p = canonical_dir / name
            assert p.is_file() and p.stat().st_size > 0, f"Missing canonical migration: {name}"
          print(f"PASS: exact Preview D1 target and all {len(expected)} canonical migrations verified")
          PY
          test "$EXPECTED_DB_NAME" = "prochelia-preview-eu-2026-11-17"
          test "$EXPECTED_DB_ID" = "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f"
          test "$EXPECTED_DB_ID" != "$FORBIDDEN_PRODUCTION_DB_ID"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          test "${#AWS_ACCESS_KEY_ID}" -eq 32 || {
            echo "::error::R2_EU_ACCESS_KEY_ID must be a 32-character R2 S3 Access Key ID."
            exit 1
          }
          test "$R2_BUCKET" = "prochelia-preview-backups-eu-v2"
          test "${#BACKUP_ATTESTATION_HMAC_KEY}" -ge 32 || {
            echo "::error::BACKUP_ATTESTATION_HMAC_KEY must contain at least 32 UTF-8 bytes."
            exit 1
          }
          test "$BACKUP_ATTESTATION_HMAC_KEY" != "$BACKUP_ENCRYPTION_KEY" || {
            echo "::error::Backup HMAC and encryption keys must be distinct."
            exit 1
          }
          [[ "$R2_EXPECTED_RETENTION_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::R2_EXPECTED_RETENTION_SECONDS must be a positive integer approved by the data-retention owner."
            exit 1
          }

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Verify Cloudflare account identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//' | tr -d '\r\n')"
          test -n "$token"
          CLOUDFLARE_API_TOKEN="$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          identity="$(npx --yes wrangler@4 whoami 2>&1)" || {
            echo "::error::Wrangler authentication failed. Check token validity and permissions."
            exit 1
          }
          safe_identity="${identity//"$CLOUDFLARE_API_TOKEN"/[REDACTED]}"
          printf '%s\\n' "$safe_identity"
          printf '%s' "$safe_identity" | grep -Fq "$EXPECTED_ACCOUNT_ID" || {
            echo "::error::Cloudflare account ID mismatch."
            exit 1
          }

      - name: Verify R2 backup bucket EU jurisdiction before exporting sensitive D1 data
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//' | tr -d '\r\n')"
          test -n "$token"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/preview-r2-jurisdiction.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/r2/buckets/$R2_BUCKET" -H "Authorization: Bearer $token" -H 'cf-r2-jurisdiction: eu')"
          test "$status" = "200" || { echo "::error::R2 EU jurisdiction lookup failed (HTTP $status); refusing D1 export and migration."; exit 1; }
          jq -e --arg bucket "$R2_BUCKET" '.success == true and .result.name == $bucket and .result.jurisdiction == "eu"' "$RUNNER_TEMP/preview-r2-jurisdiction.json" >/dev/null || {
            echo "::error::The configured R2 bucket is not confirmed in EU jurisdiction; refusing D1 export and migration."
            exit 1
          }
          prefix="preview-d1/${EXPECTED_DB_NAME}/"
          lock_status="$(curl --silent --show-error --output "$RUNNER_TEMP/r2-lock-rules.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/r2/buckets/$R2_BUCKET/lock" -H "Authorization: Bearer $token" -H 'cf-r2-jurisdiction: eu')"
          test "$lock_status" = "200" || {
            echo "::error::R2 lock rules lookup failed (HTTP $lock_status); refusing backup upload and migration."
            exit 1
          }
          jq -e --arg prefix "$prefix" --argjson retention "$R2_EXPECTED_RETENTION_SECONDS" '
            .success == true and
            (.result.rules | type == "array") and
            any(.result.rules[]?;
              .enabled == true and
              .prefix == $prefix and
              .condition.type == "Age" and
              (.condition.maxAgeSeconds | type == "number") and
              (.condition.maxAgeSeconds >= $retention)
            )
          ' "$RUNNER_TEMP/r2-lock-rules.json" >/dev/null || {
            echo "::error::No enabled R2 lock rule for the exact Preview prefix meets the approved retention duration."
            exit 1
          }
          echo "PASS: exact R2 bucket is EU and its lock rule meets the approved Preview retention duration."
      - name: Verify Preview D1 identity and EU jurisdiction before export
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//' | tr -d '\r\n')"
          test -n "$token"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/preview-d1-jurisdiction.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/d1/database/$EXPECTED_DB_ID" -H "Authorization: Bearer $token")"
          test "$status" = "200" || { echo "::error::Preview D1 metadata lookup failed (HTTP $status); refusing export and migration."; exit 1; }
          jq -e --arg id "$EXPECTED_DB_ID" --arg name "$EXPECTED_DB_NAME" '.success == true and .result.uuid == $id and .result.name == $name and .result.jurisdiction == "eu"' "$RUNNER_TEMP/preview-d1-jurisdiction.json" >/dev/null || {
            echo "::error::Preview D1 identity or explicit EU jurisdiction verification failed; refusing export and migration."
            exit 1
          }
          echo "PASS: Preview D1 identity and EU jurisdiction confirmed before export."

      - name: Verify dedicated isolated restore D1 identity and EU jurisdiction
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RESTORE_TEST_DB_NAME" =~ ^prochelia-(r2-restore-validation-[0-9]{4}-[0-9]{2}-[0-9]{2}|restore-test-[a-z0-9-]{3,50})$ ]] || {
            echo "::error::Restore-test database name must use the dedicated restore-test prefix."
            exit 1
          }
          [[ "$RESTORE_TEST_DB_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Restore-test D1 UUID is invalid."; exit 1; }
          [[ "$RESTORE_TEST_DB_ID" != "$EXPECTED_DB_ID" && "$RESTORE_TEST_DB_ID" != "$FORBIDDEN_PRODUCTION_DB_ID" && "$RESTORE_TEST_DB_ID" != "6adb95e5-e542-4bec-9008-fbea01042305" && "$RESTORE_TEST_DB_ID" != "a3526c2a-39cb-49ab-97c4-979138145f33" ]] || {
            echo "::error::Restore-test D1 must be a distinct dedicated database; Preview and Production IDs are forbidden."
            exit 1
          }
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//' | tr -d '\r\n')"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/restore-test-d1.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/d1/database/$RESTORE_TEST_DB_ID" -H "Authorization: Bearer $token")"
          [[ "$status" == "200" ]] || { echo "::error::Restore-test D1 metadata lookup failed (HTTP $status)."; exit 1; }
          jq -e --arg id "$RESTORE_TEST_DB_ID" --arg name "$RESTORE_TEST_DB_NAME" '.success == true and .result.uuid == $id and .result.name == $name and .result.jurisdiction == "eu"' "$RUNNER_TEMP/restore-test-d1.json" >/dev/null || {
            echo "::error::Restore-test D1 identity or EU jurisdiction is not confirmed."
            exit 1
          }
          cat > "$RUNNER_TEMP/wrangler.restore-test.json" <<JSON
          {
            "name": "prochelia-restore-test",
            "compatibility_date": "2026-11-22",
            "d1_databases": [{
              "binding": "RESTORE_TEST_DB",
              "database_name": "$RESTORE_TEST_DB_NAME",
              "database_id": "$RESTORE_TEST_DB_ID"
            }]
          }
          JSON
          jq -e --arg name "$RESTORE_TEST_DB_NAME" --arg id "$RESTORE_TEST_DB_ID" '.name == "prochelia-restore-test" and (.d1_databases | length == 1) and .d1_databases[0].database_name == $name and .d1_databases[0].database_id == $id' "$RUNNER_TEMP/wrangler.restore-test.json" >/dev/null
          npx --yes wrangler@4 d1 execute "$RESTORE_TEST_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore-test.json" --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT GLOB '_cf_*' ORDER BY name;" --json > "$RUNNER_TEMP/restore-test-before-export.json"
          jq -e '[.. | objects | select(has("results")) | .results[]?] | length == 0' "$RUNNER_TEMP/restore-test-before-export.json" >/dev/null || {
            echo "::error::Restore-test D1 is not empty; refusing to export/upload a backup for a target that cannot be restored safely."
            exit 1
          }
          echo "PASS: exact isolated EU restore-test D1 confirmed, separately configured in Wrangler, and empty before export."

      - name: Export only Preview D1 before migration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/prochelia-backup"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sqlite3
          npx --yes wrangler@4 d1 export "$EXPECTED_DB_NAME" --remote --config wrangler.preview-migrations.jsonc --skip-confirmation --output="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          test -s "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          sha256sum "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql" | awk '{print $1}' > "$RUNNER_TEMP/prochelia-backup/manifest.sha256"
          sqlite3 "$RUNNER_TEMP/prochelia-backup/restore-validation.sqlite" < "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          integrity="$(sqlite3 "$RUNNER_TEMP/prochelia-backup/restore-validation.sqlite" 'PRAGMA integrity_check;')"
          test "$integrity" = "ok" || { echo "::error::Local SQLite restore integrity_check failed: $integrity"; exit 1; }
          foreign_keys="$(sqlite3 "$RUNNER_TEMP/prochelia-backup/restore-validation.sqlite" 'PRAGMA foreign_key_check;')"
          test -z "$foreign_keys" || { echo "::error::Local SQLite restore foreign_key_check found violations."; exit 1; }

      - name: Encrypt and verify fresh backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plaintext="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          encrypted="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$encrypted" "$plaintext"
          test -s "$encrypted"
          expected="$(cat "$RUNNER_TEMP/prochelia-backup/manifest.sha256")"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$encrypted" > "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          actual="$(sha256sum "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql" | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          rm -f "$plaintext" "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          printf 'database=%s\\ncreated_utc=%s\\nencrypted_file=prochelia-preview.sql.gpg\\nbucket=%s\\n' "$EXPECTED_DB_NAME" "$(date -u +%FT%TZ)" "$R2_BUCKET" > "$RUNNER_TEMP/prochelia-backup/README.txt"

      - name: Prepare canonical HMAC-signed backup attestation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="preview-d1/${EXPECTED_DB_NAME}/$(date -u +%Y/%m/%d)/${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}.sql.gpg"
          plain_sha="$(cat "$RUNNER_TEMP/prochelia-backup/manifest.sha256")"
          cipher_sha="$(sha256sum "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg" | awk '{print $1}')"
          printf 'R2_OBJECT_KEY=%s\\n' "$key" >> "$GITHUB_ENV"
          R2_OBJECT_KEY="$key" PLAIN_SHA256="$plain_sha" CIPHER_SHA256="$cipher_sha" node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = {
            schema_version: 1,
            attestation_type: "prochelia.preview-d1-backup",
            created_at: new Date().toISOString(),
            source: {
              account_id: process.env.EXPECTED_ACCOUNT_ID,
              database_id: process.env.EXPECTED_DB_ID,
              database_name: process.env.EXPECTED_DB_NAME,
              jurisdiction: "eu"
            },
            object: {
              bucket: process.env.R2_BUCKET,
              key: process.env.R2_OBJECT_KEY,
              sha256_manifest_key: process.env.R2_OBJECT_KEY + ".sha256",
              plaintext_sha256: process.env.PLAIN_SHA256,
              ciphertext_sha256: process.env.CIPHER_SHA256
            },
            provenance: {
              repository: process.env.GITHUB_REPOSITORY,
              workflow: process.env.GITHUB_WORKFLOW,
              run_id: process.env.GITHUB_RUN_ID,
              commit_sha: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF,
              migration_source_sha: process.env.GITHUB_SHA
            },
            validation: {
              encryption: "OpenPGP-AES256",
              sqlite_integrity_check: "ok",
              foreign_key_check: "empty"
            }
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + "/prochelia-backup/attestation.json", JSON.stringify(manifest, null, 2) + "\\n", { mode: 0o600 });
          NODE
          R2_OBJECT_KEY="$key" node scripts/r2-backup-attestation.mjs sign "$RUNNER_TEMP/prochelia-backup/attestation.json" "$RUNNER_TEMP/prochelia-backup/attestation.hmac"

      - name: Install AWS CLI for private R2 EU backup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload encrypted backup and HMAC attestation to private R2 EU bucket
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          key="$R2_OBJECT_KEY"
          test -n "$key"
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "$key" --max-keys 10 --endpoint-url "$R2_ENDPOINT" --region auto --output json > "$RUNNER_TEMP/prochelia-backup/existing-objects.json"
          jq -e --arg key "$key" '[.Contents[]?.Key | select(. == $key or . == ($key + ".sha256") or . == ($key + ".attestation.json") or . == ($key + ".attestation.hmac"))] | length == 0' "$RUNNER_TEMP/prochelia-backup/existing-objects.json" >/dev/null || {
            echo "::error::R2 backup object key already exists; refusing to overwrite an earlier backup."
            exit 1
          }
          aws s3 cp "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "$RUNNER_TEMP/prochelia-backup/manifest.sha256" "s3://$R2_BUCKET/$key.sha256" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "$RUNNER_TEMP/prochelia-backup/attestation.json" "s3://$R2_BUCKET/$key.attestation.json" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "$RUNNER_TEMP/prochelia-backup/attestation.hmac" "s3://$R2_BUCKET/$key.attestation.hmac" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors

      - name: Download R2 backup and verify HMAC, encryption and full round-trip
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          key="$R2_OBJECT_KEY"
          aws s3 cp "s3://$R2_BUCKET/$key" "$RUNNER_TEMP/prochelia-backup/roundtrip.sql.gpg" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$key.sha256" "$RUNNER_TEMP/prochelia-backup/roundtrip.manifest.sha256" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$key.attestation.json" "$RUNNER_TEMP/prochelia-backup/roundtrip.attestation.json" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$key.attestation.hmac" "$RUNNER_TEMP/prochelia-backup/roundtrip.attestation.hmac" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          cmp "$RUNNER_TEMP/prochelia-backup/manifest.sha256" "$RUNNER_TEMP/prochelia-backup/roundtrip.manifest.sha256"
          cmp "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg" "$RUNNER_TEMP/prochelia-backup/roundtrip.sql.gpg"
          cmp "$RUNNER_TEMP/prochelia-backup/attestation.json" "$RUNNER_TEMP/prochelia-backup/roundtrip.attestation.json"
          cmp "$RUNNER_TEMP/prochelia-backup/attestation.hmac" "$RUNNER_TEMP/prochelia-backup/roundtrip.attestation.hmac"
          node scripts/r2-backup-attestation.mjs verify "$RUNNER_TEMP/prochelia-backup/roundtrip.attestation.json" "$RUNNER_TEMP/prochelia-backup/roundtrip.attestation.hmac"
          jq -e --arg key "$key" --arg bucket "$R2_BUCKET" --arg db "$EXPECTED_DB_ID" --arg name "$EXPECTED_DB_NAME" --arg account "$EXPECTED_ACCOUNT_ID" '
            .schema_version == 1 and
            .attestation_type == "prochelia.preview-d1-backup" and
            .source.account_id == $account and
            .source.database_id == $db and
            .source.database_name == $name and
            .source.jurisdiction == "eu" and
            .object.bucket == $bucket and
            .object.key == $key and
            .object.sha256_manifest_key == ($key + ".sha256") and
            .provenance.repository == "rzem92-png/prochelia-api" and
            .provenance.ref == "refs/heads/fix/pages-proxy-preview-cors-2026-11-23" and
            .provenance.commit_sha == env.GITHUB_SHA and
            .provenance.run_id == env.GITHUB_RUN_ID and
            .provenance.migration_source_sha == env.GITHUB_SHA and
            .validation.sqlite_integrity_check == "ok" and
            .validation.foreign_key_check == "empty" and
            .validation.encryption == "OpenPGP-AES256"
          ' "$RUNNER_TEMP/prochelia-backup/roundtrip.attestation.json" >/dev/null || {
            echo "::error::HMAC manifest does not bind this exact EU Preview backup and workflow run."
            exit 1
          }
          cipher_actual="$(sha256sum "$RUNNER_TEMP/prochelia-backup/roundtrip.sql.gpg" | awk '{print $1}')"
          cipher_expected="$(jq -r '.object.ciphertext_sha256' "$RUNNER_TEMP/prochelia-backup/roundtrip.attestation.json")"
          test "$cipher_actual" = "$cipher_expected" || {
            echo "::error::Encrypted backup digest differs from HMAC attestation."
            exit 1
          }
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$RUNNER_TEMP/prochelia-backup/roundtrip.sql.gpg" > "$RUNNER_TEMP/prochelia-backup/roundtrip.sql"
          actual="$(sha256sum "$RUNNER_TEMP/prochelia-backup/roundtrip.sql" | awk '{print $1}')"
          expected="$(cat "$RUNNER_TEMP/prochelia-backup/manifest.sha256")"
          attested_plain="$(jq -r '.object.plaintext_sha256' "$RUNNER_TEMP/prochelia-backup/roundtrip.attestation.json")"
          test "$actual" = "$expected" && test "$actual" = "$attested_plain" || {
            echo "::error::Decrypted R2 backup checksum differs from the HMAC-attested manifest."
            exit 1
          }
          sqlite3 "$RUNNER_TEMP/prochelia-backup/restore-validation-r2.sqlite" < "$RUNNER_TEMP/prochelia-backup/roundtrip.sql"
          integrity="$(sqlite3 "$RUNNER_TEMP/prochelia-backup/restore-validation-r2.sqlite" 'PRAGMA integrity_check;')"
          test "$integrity" = "ok" || { echo "::error::R2-restored SQLite integrity_check failed: $integrity"; exit 1; }
          foreign_keys="$(sqlite3 "$RUNNER_TEMP/prochelia-backup/restore-validation-r2.sqlite" 'PRAGMA foreign_key_check;')"
          test -z "$foreign_keys" || { echo "::error::R2-restored SQLite foreign_key_check found violations."; exit 1; }
          echo "PASS: HMAC attestation, ciphertext/plaintext checksums, decryption, local restore, integrity_check and foreign_key_check verified."
      
      - name: Restore exact R2 backup into isolated D1 and verify integrity before Preview migration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RESTORE_TEST_DB_NAME" =~ ^prochelia-(r2-restore-validation-[0-9]{4}-[0-9]{2}-[0-9]{2}|restore-test-[a-z0-9-]{3,50})$ ]] || {
            echo "::error::Restore-test database name must use the dedicated restore-test prefix."
            exit 1
          }
          [[ "$RESTORE_TEST_DB_ID" != "$EXPECTED_DB_ID" && "$RESTORE_TEST_DB_ID" != "$FORBIDDEN_PRODUCTION_DB_ID" ]]
          npx --yes wrangler@4 d1 execute "$RESTORE_TEST_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore-test.json" --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT GLOB '_cf_*' ORDER BY name;" --json > "$RUNNER_TEMP/prochelia-backup/restore-target-before.json"
          jq -e . "$RUNNER_TEMP/prochelia-backup/restore-target-before.json" >/dev/null
          empty_count="$(jq -r '[.. | objects | select(has("results")) | .results[]? | .name? // empty] | map(select(type == "string")) | unique | length' "$RUNNER_TEMP/prochelia-backup/restore-target-before.json")"
          [[ "$empty_count" == "0" ]] || {
            echo "::error::Restore-test D1 is not empty; no existing test data will be overwritten."
            exit 1
          }
          npx --yes wrangler@4 d1 execute "$RESTORE_TEST_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore-test.json" --file="$RUNNER_TEMP/prochelia-backup/roundtrip.sql" --yes
          npx --yes wrangler@4 d1 execute "$RESTORE_TEST_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore-test.json" --command="PRAGMA quick_check;" --json > "$RUNNER_TEMP/prochelia-backup/restore-quick-check.json"
          jq -e '[.. | strings] | any(. == "ok")' "$RUNNER_TEMP/prochelia-backup/restore-quick-check.json" >/dev/null || {
            echo "::error::Cloudflare D1 restore quick_check failed."
            exit 1
          }
          npx --yes wrangler@4 d1 execute "$RESTORE_TEST_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore-test.json" --command="PRAGMA foreign_key_check;" --json > "$RUNNER_TEMP/prochelia-backup/restore-fk-check.json"
          jq -e '[.. | objects | select(has("results")) | .results[]?] | length == 0' "$RUNNER_TEMP/prochelia-backup/restore-fk-check.json" >/dev/null || {
            echo "::error::Cloudflare D1 restore contains foreign-key violations."
            exit 1
          }
          npx --yes wrangler@4 d1 execute "$RESTORE_TEST_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore-test.json" --command="SELECT COUNT(*) AS migration_count, MAX(name) AS latest FROM d1_migrations;" --json > "$RUNNER_TEMP/prochelia-backup/restore-migrations.json"
          jq -e '[.. | objects | select(has("results")) | .results[]? | select(.migration_count == 23 and .latest == "0022_supra_persisted_approvals.sql")] | length == 1' "$RUNNER_TEMP/prochelia-backup/restore-migrations.json" >/dev/null || {
            echo "::error::Restored D1 does not match the expected 23-migration Preview baseline."
            exit 1
          }
          npx --yes wrangler@4 d1 execute "$RESTORE_TEST_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore-test.json" --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','missions','intervenants','prestations','disponibilites','wallets','documents','accounting_ledger','d1_migrations') ORDER BY name;" --json > "$RUNNER_TEMP/prochelia-backup/restore-core-tables.json"
          jq -e '[.. | objects | select(has("results")) | .results[]? | .name] | unique | length == 9' "$RUNNER_TEMP/prochelia-backup/restore-core-tables.json" >/dev/null || {
            echo "::error::Restored D1 is missing one or more required core tables."
            exit 1
          }
          echo "PASS: exact R2 backup restored into the distinct EU D1 test database; SQLite integrity, foreign keys, 23-migration registry and nine core tables verified."

      - name: Publish encrypted backup before any schema write
        uses: actions/upload-artifact@v4
        with:
          name: prochelia-preview-pre-migration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prochelia-backup/prochelia-preview.sql.gpg
            ${{ runner.temp }}/prochelia-backup/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Refuse non-empty or divergent migration history before any schema write
        shell: bash
        run: |
          set -euo pipefail
          objects_request="$RUNNER_TEMP/preview-schema-inventory-request.json"
          objects_response="$RUNNER_TEMP/preview-schema-inventory-response.json"
          registry_request="$RUNNER_TEMP/preview-migration-inventory-request.json"
          registry_response="$RUNNER_TEMP/preview-migration-inventory-response.json"

          jq -n '{sql:"SELECT type, name FROM sqlite_master ORDER BY type, name",params:[]}' > "$objects_request"
          status="$(curl --silent --show-error --output "$objects_response" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$objects_request" \
            "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/d1/database/$EXPECTED_DB_ID/query")"
          test "$status" = "200" || { echo "::error::Unable to read isolated Preview schema inventory (HTTP $status)."; exit 1; }
          jq -e '.success == true' "$objects_response" >/dev/null

          if jq -e '.result[0].results[]? | select(.type == "table" and .name == "d1_migrations")' "$objects_response" >/dev/null; then
            jq -n '{sql:"SELECT name FROM d1_migrations ORDER BY name",params:[]}' > "$registry_request"
            status="$(curl --silent --show-error --output "$registry_response" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @"$registry_request" \
              "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/d1/database/$EXPECTED_DB_ID/query")"
            test "$status" = "200" || { echo "::error::Unable to read Preview migration registry (HTTP $status)."; exit 1; }
            jq -e '.success == true' "$registry_response" >/dev/null
          else
            printf '{"success":true,"result":[{"results":[]}]}' > "$registry_response"
          fi

          python3 - "$objects_response" "$registry_response" <<'PY'
          import json, pathlib, sys
          objects=json.loads(pathlib.Path(sys.argv[1]).read_text())["result"][0]["results"]
          registry=json.loads(pathlib.Path(sys.argv[2]).read_text())["result"][0]["results"]
          registry_present=any(row["type"]=="table" and row["name"]=="d1_migrations" for row in objects)
          remote=set(row["name"] for row in registry)
          local=set(p.name for p in pathlib.Path("migrations-preview-canonical").glob("*.sql"))
          base = {
              "0000_auth_foundation.sql",
              "0001_core_business_schema.sql",
              "0002_server_pricing.sql",
              "0003_route_address_provenance.sql",
              "0004_atomic_wallet_ledger.sql",
              "0005_security_rate_limits.sql",
              "0006_copilot_schema.sql",
              "0007_trust_passport_schema.sql",
              "0008_commercial_recruitment_schema.sql",
              "0009_finance_workspace_schema.sql",
              "0010_strategic_schema.sql",
              "0011_final_hardening_schema.sql",
              "0012_national_continuity_schema.sql",
              "0013_master_complement_schema.sql",
              "0014_operational_schema.sql",
              "0015_production_security_events.sql",
              "0016_security_identity_schema.sql",
              "0017_document_security_scans.sql",
              "0018_consolidated_business_schema.sql",
              "0019_backup_verifications.sql",
              "0020_auth_login_rate_limits.sql",
              "0021_supra_audit_events.sql",
              "0022_supra_persisted_approvals.sql",
          }
          if len(local) != 46:
              print(f"::error::Expected exactly 46 canonical migrations; found {len(local)}.")
              raise SystemExit(1)
          non_internal=[row for row in objects if row["name"] not in {"_cf_KV","d1_migrations"} and not row["name"].startswith("sqlite_")]
          import sqlite3
          def schema_for(names):
              db=sqlite3.connect(":memory:")
              db.execute("PRAGMA foreign_keys=ON")
              for name in sorted(names):
                  db.executescript((pathlib.Path("migrations-preview-canonical") / name).read_text())
              violations=db.execute("PRAGMA foreign_key_check").fetchall()
              if violations:
                  raise SystemExit(f"Canonical local schema has foreign-key violations: {violations[:10]}")
              result={(row[0],row[1]) for row in db.execute(
                  "SELECT type,name FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name"
              ) if row[1] not in {"d1_migrations","_cf_KV"}}
              db.close()
              return result
          remote_schema={(row["type"],row["name"]) for row in non_internal}
          base_schema=schema_for(base)
          target_schema=schema_for(local)
          if not remote and not non_internal:
              print("PASS: new EU Preview D1 is empty; all 46 canonical migrations are pending.")
          elif registry_present and remote == base and remote_schema == base_schema:
              print("PASS: exact 23-entry registry AND exact schema inventory match the reviewed Preview baseline; only migrations 0023-0045 are pending.")
          elif registry_present and remote == local and remote_schema == target_schema:
              print("PASS: exact 46-entry registry AND exact schema inventory match the canonical target; rerun is idempotent.")
          else:
              print("::error::Preview migration registry differs from the exact reviewed 23-entry baseline and 46-entry target; no migration will run.")
              print("Unexpected remote names:", ", ".join(sorted(remote-local)) or "(none)")
              print("Missing expected names:", ", ".join(sorted(local-remote)) or "(none)")
              raise SystemExit(1)
          PY

