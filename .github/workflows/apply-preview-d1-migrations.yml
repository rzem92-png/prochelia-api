name: PROCHÉLIA — appliquer migrations D1 préproduction

on:
  workflow_dispatch:
    inputs:
      confirm_preview:
        description: "Saisir exactement APPLY_PREVIEW_ONLY pour autoriser la migration de préproduction"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prochelia-preview-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-preview:
    if: ${{ github.event.inputs.confirm_preview == 'APPLY_PREVIEW_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      EXPECTED_DB_NAME: prochelia-preview-db
      EXPECTED_DB_ID: 6adb95e5-e542-4bec-9008-fbea01042305
      EXPECTED_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
    steps:
      - name: Checkout preproduction branch
        uses: actions/checkout@v4
        with:
          ref: fix/stripe-recipient-capabilities-2026-11-10

      - name: Verify credentials, exact target and migration files
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BACKUP_ENCRYPTION_KEY; do
            test -n "${!name:-}" || { echo "::error::Required secret missing: $name"; exit 1; }
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("wrangler.preview-migrations.jsonc").read_text()
          raw = "\n".join(line for line in raw.splitlines() if not line.lstrip().startswith("//"))
          config = json.loads(raw)
          assert len(config["d1_databases"]) == 1, "Unexpected additional D1 binding"
          db = config["d1_databases"][0]
          assert db["binding"] == "PREVIEW_DB", "Unexpected D1 binding"
          assert db["database_name"] == "prochelia-preview-db", "Unexpected D1 name"
          assert db["database_id"] == "6adb95e5-e542-4bec-9008-fbea01042305", "Unexpected D1 UUID"
          assert db["migrations_dir"] == "migrations", "Unexpected migrations directory"
          for name in (
            "0001_core_business_schema.sql",
            "0002_server_pricing.sql",
            "0003_route_address_provenance.sql",
            "0004_atomic_wallet_ledger.sql",
            "0005_payment_processor_schema.sql",
            "0005_payment_runtime_schema.sql",
            "0006_payment_state_ledger_enforcement.sql",
            "0007_login_attempts_security.sql",
            "0008_stripe_recipient_capabilities.sql",
            "0009_payment_dispute_guards.sql",
            "0010_stripe_account_link_uniqueness.sql",
            "0011_financial_provider_evidence_guards.sql",
            "0012_payment_insert_provider_evidence_guard.sql",
            "0013_immutable_provider_references.sql",
            "0014_restore_wallet_balance_guard.sql",
          ):
            p = Path("migrations") / name
            assert p.is_file() and p.stat().st_size > 0, f"Missing migration: {name}"
          print("PASS: exact preview D1 and four migration files verified")
          PY
          test "$EXPECTED_DB_NAME" = "prochelia-preview-db"
          test "$EXPECTED_DB_ID" = "6adb95e5-e542-4bec-9008-fbea01042305"
          test "$EXPECTED_ACCOUNT_ID" = "f2a79e9fa41566a8ec80fb24c02c60eb"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare account identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret does not match the pinned expected account."
            exit 1
          fi

          set +e
          identity="$(npx --yes wrangler@4 whoami 2>&1)"
          status=$?
          set -e

          safe_identity="${identity//"$CLOUDFLARE_API_TOKEN"/[REDACTED]}"
          printf '%s\\n' "$safe_identity"

          if [ "$status" -ne 0 ]; then
            echo "::error::Wrangler authentication failed. Check token validity and Cloudflare permissions."
            exit 1
          fi

          if ! printf '%s' "$safe_identity" | grep -Fq "$EXPECTED_ACCOUNT_ID"; then
            echo "::error::Cloudflare account ID returned by Wrangler does not match the pinned expected account."
            exit 1
          fi

          echo "Cloudflare identity verified."

      - name: Export only Preview D1 before migration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/prochelia-backup"
          npx --yes wrangler@4 d1 export "$EXPECTED_DB_NAME" --remote --config wrangler.preview-migrations.jsonc --skip-confirmation --output="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          test -s "$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"

      - name: Encrypt and verify fresh backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plaintext="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql"
          encrypted="$RUNNER_TEMP/prochelia-backup/prochelia-preview.sql.gpg"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$encrypted" "$plaintext"
          test -s "$encrypted"
          expected="$(sha256sum "$plaintext" | cut -d ' ' -f 1)"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$encrypted" > "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          actual="$(sha256sum "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql" | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          rm -f "$plaintext" "$RUNNER_TEMP/prochelia-backup/decrypted-check.sql"
          printf 'database=%s\ncreated_utc=%s\nencrypted_file=prochelia-preview.sql.gpg\n' "$EXPECTED_DB_NAME" "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/prochelia-backup/README.txt"

      - name: Publish encrypted backup before any schema write
        uses: actions/upload-artifact@v4
        with:
          name: prochelia-preview-pre-migration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prochelia-backup/prochelia-preview.sql.gpg
            ${{ runner.temp }}/prochelia-backup/README.txt
          if-no-files-found: error
          retention-days: 7

      - name: Show pending migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list "$EXPECTED_DB_NAME" --remote --config wrangler.preview-migrations.jsonc

      - name: Apply migrations to Preview D1 only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply "$EXPECTED_DB_NAME" --remote --config wrangler.preview-migrations.jsonc

      - name: Verify migration status after applying
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list "$EXPECTED_DB_NAME" --remote --config wrangler.preview-migrations.jsonc
          echo "Migration command completed for the hard-pinned Preview D1 target."

      - name: Verify Preview D1 financial invariants
        shell: bash
        env:
          VERIFY_ACCOUNT_ID: ${{ env.EXPECTED_ACCOUNT_ID }}
          VERIFY_DATABASE_ID: ${{ env.EXPECTED_DB_ID }}
          VERIFY_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.VERIFY_ACCOUNT_ID}/d1/database/${process.env.VERIFY_DATABASE_ID}/query`;
          async function query(sql) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.VERIFY_API_TOKEN}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ sql })
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              throw new Error("Cloudflare D1 verification query failed");
            }
            return payload.result?.[0]?.results ?? [];
          }
          const checks = await query(`
            SELECT 'payment_tables' AS kind, COUNT(*) AS total
              FROM sqlite_master WHERE type='table' AND name IN (
                'payment_accounts','wallets','payment_transactions','payout_requests',
                'payment_webhook_events','payment_disputes','payment_reconciliation',
                'payment_audit','payment_wallet_ledger'
              )
            UNION ALL
            SELECT 'expected_triggers', COUNT(*) FROM sqlite_master
             WHERE type='trigger' AND name IN (
              'trg_payment_wallet_ledger_require_wallet','trg_payment_wallet_ledger_guard_balances',
              'trg_payment_wallet_ledger_apply','trg_payment_wallet_ledger_no_update',
              'trg_payment_wallet_ledger_no_delete','trg_payment_dispute_hold_paid_tx',
              'trg_payment_tx_status_guard','trg_payment_tx_credit_ledger',
              'trg_payment_tx_credit_disputed_ledger','trg_payment_tx_hold_ledger',
              'trg_payment_tx_settle_held_ledger','trg_payment_dispute_single_open',
              'trg_payment_dispute_state_guard','trg_payout_request_guard',
              'trg_payout_request_reserve_ledger','trg_payout_status_guard',
              'trg_payout_settle_ledger','trg_payout_release_ledger',
              'trg_payment_tx_paid_insert_state_guard','trg_payment_tx_paid_reference_immutable',
              'trg_payout_provider_reference_immutable','trg_payment_tx_paid_requires_provider_reference',
              'trg_payout_status_requires_provider_reference','trg_payout_request_initial_state_guard'
             )
            UNION ALL
            SELECT 'transfers_enabled', COUNT(*) FROM pragma_table_info('payment_accounts')
             WHERE name='transfers_enabled'
            UNION ALL
            SELECT 'account_index', COUNT(*) FROM sqlite_master
             WHERE type='index' AND name='ux_payment_accounts_provider_account'
            UNION ALL
            SELECT 'login_attempts', COUNT(*) FROM sqlite_master
             WHERE type='table' AND name='login_attempts';
          `);
          const actual = Object.fromEntries(checks.map(row => [row.kind, Number(row.total)]));
          const expected = {
            payment_tables: 9,
            expected_triggers: 24,
            transfers_enabled: 1,
            account_index: 1,
            login_attempts: 1
          };
          for (const [key, value] of Object.entries(expected)) {
            if (actual[key] !== value) {
              throw new Error(`Preview D1 invariant ${key}: expected ${value}, got ${actual[key]}`);
            }
          }
          const migrations = await query(`
            SELECT name FROM d1_migrations WHERE name IN (
              '0005_payment_processor_schema.sql',
              '0006_payment_state_ledger_enforcement.sql',
              '0007_login_attempts_security.sql',
              '0008_stripe_recipient_capabilities.sql',
              '0009_payment_dispute_guards.sql',
              '0010_stripe_account_link_uniqueness.sql',
              '0011_financial_provider_evidence_guards.sql',
              '0012_payment_insert_provider_evidence_guard.sql',
              '0013_immutable_provider_references.sql',
              '0014_restore_wallet_balance_guard.sql'
            )
          `);
          if (migrations.length !== 10) {
            throw new Error(`Preview D1 migration ledger incomplete: ${migrations.length}/10`);
          }
          console.log("PASS: 9 payment tables, 24 financial triggers, capability column, unique account index, login throttling table and 10 pending migration records verified.");
          NODE
