name: PROCHÉLIA preproduction static validation

on:
  push:
    branches:
      - staging-prochelia-v14
  pull_request:
    branches:
      - staging-prochelia-v14
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prochelia-preprod-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-safety:
    name: Syntax and configuration guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JavaScript syntax
        run: |
          set -euo pipefail
          node --check index.js
          node --check src/index.js
          node --check v7.js
          node --check v7-routes.js
          node --check stripe-adapter.js
          # Validate the actual Wrangler entrypoint's local module graph as well.
          node --check src/stripe-adapter.js
          node --check src/v7.js
          node --check src/v7-routes.js

      - name: Verify actual Worker entrypoint and local imports
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const main = config.main;
          if (!main || !fs.existsSync(main)) throw new Error(`Wrangler main does not exist: ${main}`);
          const source = fs.readFileSync(main, 'utf8');
          const imports = [...source.matchAll(/from\s+["'](\.\/[^"']+)["']/g)].map(m => m[1]);
          for (const specifier of imports) {
            const resolved = path.resolve(path.dirname(main), specifier);
            if (!fs.existsSync(resolved)) throw new Error(`Missing Worker import: ${specifier} -> ${resolved}`);
          }
          if (!/V14\.5\.1-EXPERT-PREPRODUCTION/.test(source)) {
            throw new Error('Unexpected Worker source version; review before staging release');
          }
          console.log(`Worker entrypoint ${main} and ${imports.length} local imports verified`);
          NODE

      - name: Verify Wrangler config does not target production
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync('wrangler.jsonc', 'utf8');
          const config = JSON.parse(raw);
          const dbs = config.d1_databases ?? [];
          if (!dbs.length) throw new Error('No D1 binding configured');
          const prodId = '04f52830-ef5a-4f17-a640-42bbc2381bba';
          if (dbs.some(db => db.database_id === prodId)) {
            throw new Error('Production D1 UUID detected in staging Wrangler config');
          }
          if (!/staging|preview|preprod/i.test(config.name ?? '')) {
            throw new Error('Worker name does not clearly indicate staging/preview/preproduction');
          }
          console.log('Staging Wrangler config guard passed');
          NODE

      - name: Verify no accidental production deploy command in other workflows
        run: |
          set -euo pipefail
          files="$(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -v 'preprod-static-validation.yml' || true)"
          if [ -n "$files" ] && grep -nHE 'wrangler deploy|wrangler d1 migrations apply|wrangler d1 execute' $files; then
            echo "Potential deployment or D1 write command found in another workflow; review required."
            exit 1
          fi
          echo "Staging workflow guard passed"
