name: PROCHÉLIA Preview live HTTP smoke

on:
  push:
    branches:
      - test/preview-live-http-smoke-2026-11-24
  pull_request:
    paths:
      - ".github/workflows/preview-live-http-smoke.yml"

permissions:
  contents: read

concurrency:
  group: prochelia-preview-live-http-smoke
  cancel-in-progress: false

jobs:
  preview-live-http:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check the current Pages Preview document
        shell: bash
        run: |
          set -euo pipefail
          url="https://fix-frontend-finance-confirm.prochelia.pages.dev/"
          status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/pages.html" --write-out '%{http_code}' "$url")"
          test "$status" = "200" || { echo "::error::Pages Preview returned HTTP $status"; exit 1; }
          grep -Eiq '<!doctype html' "$RUNNER_TEMP/pages.html" || {
            echo "::error::Pages Preview did not return an HTML5 document."
            exit 1
          }
          echo "PASS: Pages Preview document returned HTTP 200."

      - name: Check read-only API health through both Preview Workers and Pages proxy
        shell: bash
        run: |
          set -euo pipefail
          check_health() {
            local label="$1" url="$2" output="$RUNNER_TEMP/health-$3.json" status
            status="$(curl --silent --show-error --max-time 20 --output "$output" --write-out '%{http_code}' "$url")"
            test "$status" = "200" || { echo "::error::$label returned HTTP $status"; exit 1; }
            jq -e '.ok == true and .database == true' "$output" >/dev/null || {
              echo "::error::$label did not confirm a successful read-only D1 health check."
              jq -c '{ok, database, service, version, error}' "$output" || true
              exit 1
            }
            echo "PASS: $label (HTTP 200, D1 SELECT 1)."
          }
          # Branch-scoped Cloudflare Preview alias follows the latest deployment for this PR branch.
          check_health "Current branch API Worker Preview" "https://test-preview-live-http-smoke-2026-11-24-prochelia-api.rzem92.workers.dev/api/health" "candidate-worker"
          check_health "Legacy API Preview Worker" "https://prochelia-api-preview.rzem92.workers.dev/api/health" "legacy-worker"
          check_health "Current Pages proxy Worker" "https://fix-pages-proxy-preview-cors-2026-11-23.rzem92.workers.dev/api/health" "proxy-worker"
          check_health "Pages same-origin API proxy" "https://fix-frontend-finance-confirm.prochelia.pages.dev/api/health" "pages-proxy"

      - name: Verify the public webhook receiver rejects an unauthenticated synthetic event before writes
        shell: bash
        run: |
          set -euo pipefail
          body='{"id":"evt_synthetic_http_smoke","type":"payment_succeeded","provider":"stripe"}'
          status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/webhook-rejected.json" --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://fix-frontend-finance-confirm.prochelia.pages.dev' \
            --header 'Content-Type: application/json' \
            --data "$body" \
            'https://fix-pages-proxy-preview-cors-2026-11-23.rzem92.workers.dev/api/payments/webhook')"
          test "$status" = "401" || {
            echo "::error::Unauthenticated synthetic webhook expected HTTP 401, received $status."
            jq -c '{ok,error,write_enabled}' "$RUNNER_TEMP/webhook-rejected.json" 2>/dev/null || true
            exit 1
          }
          jq -e '.error == "INVALID_WEBHOOK_SIGNATURE"' "$RUNNER_TEMP/webhook-rejected.json" >/dev/null
          echo "PASS: unauthenticated synthetic webhook rejected before event parsing or D1 writes."

      - name: Verify disabled-PSP candidate rejects before reading the webhook body
        shell: bash
        run: |
          set -euo pipefail
          body='{"id":"evt_synthetic_disabled_psp","type":"payment_succeeded","provider":"stripe"}'
          status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/disabled-psp-webhook.json" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$body" \
            'https://fix-fail-closed-payment-runtime-2026-11-24-prochelia-api.rzem92.workers.dev/api/payments/webhook')"
          test "$status" = "503" || {
            echo "::error::Disabled-PSP candidate expected HTTP 503 before body/D1 access, received $status."
            jq -c '{ok,error,write_enabled}' "$RUNNER_TEMP/disabled-psp-webhook.json" 2>/dev/null || true
            exit 1
          }
          jq -e '.error == "PAYMENT_PROVIDER_NOT_CONFIGURED" and .write_enabled == false' "$RUNNER_TEMP/disabled-psp-webhook.json" >/dev/null
          echo "PASS: disabled-PSP candidate rejects the synthetic event before reading its body or accessing D1."

      - name: Confirm unauthenticated tenant, Device Trust and accounting paths fail closed
        shell: bash
        run: |
          set -euo pipefail
          expect_denied() {
            local label="$1" url="$2" output="$RUNNER_TEMP/denied-$3.json" status
            status="$(curl --silent --show-error --max-time 20 --output "$output" --write-out '%{http_code}' "$url")"
            case "$status" in
              401|403) echo "PASS: $label denied unauthenticated access (HTTP $status)." ;;
              *) echo "::error::$label expected HTTP 401/403 without a session, received $status"; jq -c '{ok,error,write_enabled}' "$output" 2>/dev/null || true; exit 1 ;;
            esac
          }
          base="https://fix-frontend-finance-confirm.prochelia.pages.dev"
          expect_denied "Tenant context" "$base/api/tenant/context" "tenant"
          expect_denied "Device Trust credential list" "$base/api/security/device/list" "device"
          expect_denied "Accounting ledger health" "https://fix-pages-proxy-preview-cors-2026-11-23.rzem92.workers.dev/api/accounting/health" "accounting"
          echo "No cookies, credentials, synthetic rows, or mutating requests were sent."
