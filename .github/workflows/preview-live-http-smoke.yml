name: PROCHÉLIA Preview live HTTP smoke

on:
  push:
    branches:
      - test/preview-live-http-smoke-2026-11-24
  pull_request:
    paths:
      - ".github/workflows/preview-live-http-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prochelia-preview-live-http-smoke
  cancel-in-progress: false

jobs:
  preview-live-http:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check the current Pages Preview document
        shell: bash
        run: |
          set -euo pipefail
          url="https://fix-frontend-accounting-read.prochelia.pages.dev/"
          status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/pages.html" --write-out '%{http_code}' "$url")"
          test "$status" = "200" || { echo "::error::Pages Preview returned HTTP $status"; exit 1; }
          grep -Eiq '<!doctype html' "$RUNNER_TEMP/pages.html" || {
            echo "::error::Pages Preview did not return an HTML5 document."
            exit 1
          }
          echo "PASS: Pages Preview document returned HTTP 200."

      - name: Check read-only API health through deployed Preview Workers and Pages proxy
        shell: bash
        run: |
          set -euo pipefail
          check_health() {
            local label="$1" url="$2" output="$RUNNER_TEMP/health-$3.json" status
            status="$(curl --silent --show-error --max-time 20 --output "$output" --write-out '%{http_code}' "$url")"
            test "$status" = "200" || { echo "::error::$label returned HTTP $status"; exit 1; }
            jq -e '.ok == true and .database == true' "$output" >/dev/null || {
              echo "::error::$label did not confirm a successful read-only D1 health check."
              jq -c '{ok, database, service, version, error}' "$output" || true
              exit 1
            }
            echo "PASS: $label (HTTP 200, D1 SELECT 1)."
          }
          # Only deployed Preview scripts are tested. No branch-specific Worker alias is assumed.
          check_health "Legacy API Preview Worker" "https://prochelia-api-preview.rzem92.workers.dev/api/health" "legacy-worker"
          check_health "Current Pages proxy Worker" "https://fix-pages-proxy-preview-cors-2026-11-23.rzem92.workers.dev/api/health" "proxy-worker"
          check_health "Pages same-origin API proxy" "https://fix-frontend-accounting-read.prochelia.pages.dev/api/health" "pages-proxy"

      - name: Verify the disabled-PSP proxy rejects before reading the synthetic webhook body
        shell: bash
        run: |
          set -euo pipefail
          body='{"id":"evt_synthetic_http_smoke","type":"payment_succeeded","provider":"stripe"}'
          status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/webhook-rejected.json" --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://fix-frontend-accounting-read.prochelia.pages.dev' \
            --header 'Content-Type: application/json' \
            --data "$body" \
            'https://fix-pages-proxy-preview-cors-2026-11-23.rzem92.workers.dev/api/payments/webhook')"
          test "$status" = "503" || {
            echo "::error::Disabled-PSP proxy expected HTTP 503 with no financial write; the outer rate limiter may record one bounded counter. Received $status."
            jq -c '{ok,error,write_enabled}' "$RUNNER_TEMP/webhook-rejected.json" 2>/dev/null || true
            exit 1
          }
          jq -e '.error == "PAYMENT_PROVIDER_NOT_CONFIGURED" and .write_enabled == false' "$RUNNER_TEMP/webhook-rejected.json" >/dev/null
          echo "PASS: deployed disabled-PSP proxy rejected the synthetic event before body consumption or financial writes; the outer rate limiter may record one bounded counter."

      - name: Record the live HMAC acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Live HMAC acceptance is not claimed: the active PSP-disabled Preview Worker returns 503 before signature verification; the legacy Worker returned HTTP 500 PRODUCTION_SAFETY_ERROR on the unsigned probe because its deployed revision lacks sha256Hex. HMAC verification remains covered by isolated unit/security tests; do not route traffic to the legacy Worker."
          echo "PASS: no live HMAC or financial write was attempted while the PSP adapter remains disabled."

      - name: Confirm unauthenticated tenant and Device Trust paths fail closed
        shell: bash
        run: |
          set -euo pipefail
          expect_denied() {
            local label="$1" url="$2" output="$RUNNER_TEMP/denied-$3.json" status
            status="$(curl --silent --show-error --max-time 20 --output "$output" --write-out '%{http_code}' "$url")"
            case "$status" in
              401|403) echo "PASS: $label denied unauthenticated access (HTTP $status)." ;;
              *) echo "::error::$label expected HTTP 401/403 without a session, received $status"; jq -c '{ok,error,write_enabled}' "$output" 2>/dev/null || true; exit 1 ;;
            esac
          }
          base="https://fix-frontend-accounting-read.prochelia.pages.dev"
          expect_denied "Tenant context" "$base/api/tenant/context" "tenant"
          expect_denied "Device Trust credential list" "$base/api/security/device/list" "device"

      - name: Report accounting backend readiness without masking a missing route
        shell: bash
        run: |
          set -euo pipefail
          url="https://fix-frontend-accounting-read.prochelia.pages.dev/api/accounting/health"
          status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/accounting-health.json" --write-out '%{http_code}' "$url")"
          case "$status" in
            401|403)
              echo "PASS: accounting route is implemented and denies unauthenticated access (HTTP $status)."
              ;;
            404)
              echo "::warning::Accounting backend route is not deployed. Pages proxy allowlisting alone is not implementation; keep frontend PR #51 blocked until backend PR #336 and tenant migrations are integrated and tested."
              ;;
            *)
              echo "::error::Accounting readiness returned unexpected HTTP $status."
              jq -c '{ok,error,write_enabled}' "$RUNNER_TEMP/accounting-health.json" 2>/dev/null || true
              exit 1
              ;;
          esac
          echo "No cookies or credentials were sent. Only synthetic unauthenticated POST probes were used; the security rate limiter may record hashed counters. No webhook event or financial transaction is created."
