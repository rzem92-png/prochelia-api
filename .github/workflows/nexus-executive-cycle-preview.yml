name: Nexus Executive Cycle Preview Tests

on:
  pull_request:
    paths:
      - "src/nexus-executive-cycle.js"
      - "tests/nexus-executive-cycle.test.mjs"
      - ".github/workflows/nexus-executive-cycle-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executive-cycle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check executive and dependency evaluators
        run: |
          node --experimental-default-type=module --check src/nexus-module-health.js
          node --experimental-default-type=module --check src/nexus-executive-priority.js
          node --experimental-default-type=module --check src/nexus-budget-guard.js
          node --experimental-default-type=module --check src/nexus-service-sla-monitor.js
          node --experimental-default-type=module --check src/nexus-quality-signals.js
          node --experimental-default-type=module --check src/nexus-executive-cycle.js
      - name: Run cross-domain executive cycle regressions
        run: node --experimental-default-type=module --test tests/nexus-executive-cycle.test.mjs
