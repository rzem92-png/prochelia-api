name: PROCHÉLIA D1 core migration tests

on:
  push:
    branches:
      - fix/v14.5.6-security-stripe-hardening
    paths:
      - "migrations/**"
      - ".github/workflows/d1-core-migration-tests.yml"
  pull_request:
    paths:
      - "migrations/**"
      - ".github/workflows/d1-core-migration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test migration against exported staging baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          migration = Path("migrations/0001_core_business_schema.sql").read_text(encoding="utf-8")
          pricing_migration = Path("migrations/0002_server_pricing.sql").read_text(encoding="utf-8")
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")

          # Baseline transcribed from the Cloudflare D1 PRAGMA table_info exports.
          # Preserve the three existing tables; this migration must only add business tables.
          db.executescript("""
            CREATE TABLE users (
              id TEXT PRIMARY KEY,
              role TEXT NOT NULL,
              email TEXT,
              first_name TEXT,
              last_name TEXT,
              phone TEXT NOT NULL,
              password_hash TEXT,
              status TEXT DEFAULT 'active',
              created_at TEXT DEFAULT CURRENT_TIMESTAMP,
              updated_at TEXT DEFAULT CURRENT_TIMESTAMP
            );
            CREATE TABLE sessions (
              id TEXT PRIMARY KEY,
              user_id TEXT,
              token_hash TEXT,
              expires_at TEXT,
              created_at TEXT DEFAULT CURRENT_TIMESTAMP
            );
            CREATE TABLE notifications (
              id TEXT PRIMARY KEY,
              user_id TEXT NOT NULL,
              type TEXT NOT NULL,
              title TEXT NOT NULL,
              message TEXT NOT NULL,
              entity_type TEXT,
              entity_id TEXT,
              read_at TEXT,
              created_at TEXT DEFAULT CURRENT_TIMESTAMP
            );
            INSERT INTO users(id, role, phone) VALUES('u-existing', 'client', '+33000000000');
            INSERT INTO sessions(id, user_id, token_hash, expires_at)
              VALUES('s-existing', 'u-existing', 'hash-existing', '2099-01-01T00:00:00');
            INSERT INTO notifications(id, user_id, type, title, message, entity_type, entity_id)
              VALUES('n-existing', 'u-existing', 'system', 'Baseline', 'Must survive', 'system', 'baseline');
          """)

          baseline_tables = {"users", "sessions", "notifications"}
          baseline_columns = {
            table: [row[1] for row in db.execute(f"PRAGMA table_info({table})")]
            for table in baseline_tables
          }

          # Idempotence: applying twice must not duplicate or damage the baseline.
          db.executescript(migration)
          db.executescript(migration)
          db.executescript(pricing_migration)
          db.executescript(pricing_migration)

          expected = {
            "clients", "intervenants", "prestations", "missions", "tarifs",
            "paiements", "disponibilites", "evaluations", "documents",
            "conflits", "journal", "pricing_policies", "pricing_travel_policies",
            "pricing_route_estimates", "pricing_holidays", "pricing_quotes"
          }
          actual = {
            row[0] for row in db.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
            )
          }
          missing = expected - actual
          assert not missing, f"Missing business tables: {sorted(missing)}"

          for table, columns in baseline_columns.items():
            current = [row[1] for row in db.execute(f"PRAGMA table_info({table})")]
            assert current == columns, f"Existing {table} schema changed: {current}"
          assert db.execute("SELECT COUNT(*) FROM users WHERE id='u-existing'").fetchone()[0] == 1
          assert db.execute("SELECT COUNT(*) FROM sessions WHERE id='s-existing'").fetchone()[0] == 1
          assert db.execute("SELECT COUNT(*) FROM notifications WHERE id='n-existing'").fetchone()[0] == 1

          # Runtime authentication compatibility against the exact exported core schema.
          users_info = {row[1]: row for row in db.execute("PRAGMA table_info(users)")}
          assert users_info["phone"][3] == 1, "users.phone must remain NOT NULL"
          session_columns = {row[1] for row in db.execute("PRAGMA table_info(sessions)")}
          assert {"id", "user_id", "token_hash", "expires_at", "created_at"} <= session_columns
          notification_columns = {row[1] for row in db.execute("PRAGMA table_info(notifications)")}
          assert {"id", "user_id", "type", "title", "message", "entity_type", "entity_id", "read_at", "created_at"} <= notification_columns
          auth_user = db.execute("""
            SELECT u.id, u.role, u.email, u.first_name, u.last_name, u.phone,
                   u.status, u.created_at, u.updated_at, s.id AS session_id
              FROM sessions s JOIN users u ON u.id = s.user_id
             WHERE s.token_hash = ? AND s.expires_at > CURRENT_TIMESTAMP LIMIT 1
          """, ("hash-existing",)).fetchone()
          assert auth_user is not None and auth_user[0] == "u-existing"
          print("PASS: users.phone NOT NULL and session authentication JOIN compatible")
          print("PASS: existing notifications table columns preserved")

          # Validate valid FK path and reject invalid mission references.
          db.execute(
            "INSERT INTO users(id, role, phone) VALUES(?,?,?)",
            ("u1", "client", "+33111111111")
          )
          db.execute("INSERT INTO clients(id, user_id) VALUES(?,?)", ("c1", "u1"))
          db.execute(
            "INSERT INTO prestations(id, name, active) VALUES(?,?,1)",
            ("p1", "Accompagnement")
          )
          db.execute(
            "INSERT INTO missions(id, client_id, prestation_id, start_at) VALUES(?,?,?,?)",
            ("m1", "c1", "p1", "2026-11-01T10:00:00")
          )
          try:
            db.execute(
              "INSERT INTO missions(id, client_id, prestation_id, start_at) VALUES(?,?,?,?)",
              ("m-invalid", "missing-client", "p1", "2026-11-01T10:00:00")
            )
            raise AssertionError("Foreign key accepted an unknown client")
          except sqlite3.IntegrityError:
            pass

          try:
            db.execute(
              "INSERT INTO evaluations(id, mission_id, author_user_id, target_user_id, rating) VALUES(?,?,?,?,?)",
              ("e-invalid", "m1", "u1", "u1", 6)
            )
            raise AssertionError("Rating CHECK accepted a value above 5")
          except sqlite3.IntegrityError:
            pass

          fk_errors = list(db.execute("PRAGMA foreign_key_check"))
          assert not fk_errors, f"Foreign key violations: {fk_errors}"
          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          assert integrity == "ok", f"SQLite integrity_check: {integrity}"

          print("PASS: exported users/sessions/notifications baseline accepted")
          print("PASS: all 3 existing tables and seed rows preserved")
          print("PASS: 11 business tables created")
          print("PASS: server pricing reference tables created and migration 0002 is idempotent")
          print("PASS: migration is idempotent")
          print("PASS: valid client/prestation/mission inserts")
          print("PASS: invalid foreign key rejected")
          print("PASS: rating CHECK constraint enforced")
          print("PASS: foreign_key_check clean")
          print("PASS: integrity_check =", integrity)
          PY
