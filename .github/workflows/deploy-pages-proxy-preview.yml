name: Deploy isolated Pages-proxy Worker Preview

on:
  push:
    branches:
      - fix/pages-proxy-preview-cors-2026-11-23
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "tests/preview-cors-origin-config.test.mjs"
      - "tests/production-safety-rate-limit.test.mjs"
      - ".github/workflows/deploy-pages-proxy-preview.yml"

permissions:
  contents: read

concurrency:
  group: prochelia-pages-proxy-worker-preview
  cancel-in-progress: false

jobs:
  deploy-isolated-preview:
    if: github.ref == 'refs/heads/fix/pages-proxy-preview-cors-2026-11-23'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate Preview-only resource contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const productionDb = config.d1_databases?.find(x => x.binding === 'DB');
          const previewDb = config.previews?.d1_databases?.find(x => x.binding === 'DB');
          const origins = String(config.previews?.vars?.CORS_ORIGIN || '').split(',').map(x => x.trim());
          if (config.name !== 'prochelia-api') throw new Error('Unexpected Worker name');
          if (config.previews?.vars?.APP_ENV !== 'preview') throw new Error('APP_ENV must be preview');
          if (productionDb?.database_id !== '04f52830-ef5a-4f17-a640-42bbc2381bba') throw new Error('Production D1 reference changed unexpectedly');
          if (previewDb?.database_id !== 'e3cf167c-37e1-4d72-9ac6-b3e27c14b97f') throw new Error('Preview D1 binding is not the dedicated Preview database');
          if (previewDb.database_id === productionDb.database_id) throw new Error('Preview and Production D1 must be different');
          if (!origins.includes('https://pages-proxy-2026-11-23.prochelia.pages.dev')) throw new Error('Exact Pages Preview origin missing');
          if (origins.includes('*')) throw new Error('Wildcard CORS is forbidden');
          if (config.previews?.r2_buckets?.length) throw new Error('No R2 binding until the EU bucket is independently verified');
          if (config.previews?.triggers) throw new Error('Cron triggers are not allowed in this branch Preview');
          console.log('Preview D1, APP_ENV and exact CORS origin verified; no R2 or Cron binding.');
          const previewVars = {
            APP_ENV: 'preview',
            CORS_ORIGIN: config.previews.vars.CORS_ORIGIN
          };
          const previewD1 = {
            binding: 'DB',
            database_name: previewDb.database_name,
            database_id: previewDb.database_id
          };
          const previewConfig = {
            name: 'fix-pages-proxy-preview-cors-2026-11-23',
            main: config.main,
            compatibility_date: config.compatibility_date,
            compatibility_flags: config.compatibility_flags || [],
            observability: config.observability,
            vars: previewVars,
            d1_databases: [previewD1],
            previews: {
              vars: previewVars,
              d1_databases: [previewD1]
            }
          };
          if (JSON.stringify(previewConfig).includes(productionDb.database_id)) {
            throw new Error('Generated Preview config contains the Production D1 identifier');
          }
          const previewConfigPath = `${process.env.GITHUB_WORKSPACE}/wrangler.preview.generated.json`;
          fs.writeFileSync(previewConfigPath, JSON.stringify(previewConfig, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, `PREVIEW_WRANGLER_CONFIG=${previewConfigPath}\n`);
          console.log('Preview-only Wrangler config generated with the isolated EU D1 binding.');
          NODE
          node --experimental-default-type=module --test tests/preview-cors-origin-config.test.mjs tests/production-safety-rate-limit.test.mjs

      - name: Validate Worker bundle without deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --config "$PREVIEW_WRANGLER_CONFIG" --outdir "$RUNNER_TEMP/prochelia-pages-proxy-worker-dry-run" 2>&1 | tee "$RUNNER_TEMP/preview-worker-dry-run.log"
          grep -F "env.DB (prochelia-preview-eu-2026-11-17)" "$RUNNER_TEMP/preview-worker-dry-run.log" >/dev/null
          if grep -F "04f52830-ef5a-4f17-a640-42bbc2381bba" "$RUNNER_TEMP/preview-worker-dry-run.log" >/dev/null; then
            echo "::error::Production D1 identifier appeared in the Preview Worker dry-run."
            exit 1
          fi

      - name: Verify Cloudflare credentials and deploy this branch Preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "f2a79e9fa41566a8ec80fb24c02c60eb" || {
            echo "::error::Cloudflare account mismatch"; exit 1;
          }
          npx --yes wrangler@4 preview --config "$PREVIEW_WRANGLER_CONFIG" --message "Preview-only Pages proxy CORS validation"

      - name: Record Preview-only deployment guardrails
        run: |
          {
            echo 'Worker Preview only: fix-pages-proxy-preview-cors-2026-11-23.'
            echo 'D1 binding is pinned to Preview database e3cf167c-37e1-4d72-9ac6-b3e27c14b97f.'
            echo 'No D1 migrations, no R2 writes, no Cron, no production Worker deployment, and no payment operations.'
          } >> "$GITHUB_STEP_SUMMARY"
