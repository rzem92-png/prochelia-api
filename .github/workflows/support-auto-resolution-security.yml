name: PROCHÉLIA support auto-resolution security regression

on:
  push:
    branches:
      - fix/support-auto-resolution-server-proof-2026-11-11
    paths:
      - "src/index.js"
      - "tests/support-auto-resolution-security.test.mjs"
      - "tests/profile-directory-isolation.test.mjs"
      - "tests/quality-ownership-security.test.mjs tests/promotion-listing-privacy.test.mjs"
      - "tests/promotion-listing-privacy.test.mjs"
      - ".github/workflows/support-auto-resolution-security.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/index.js"
      - "tests/support-auto-resolution-security.test.mjs"
      - ".github/workflows/support-auto-resolution-security.yml"

permissions:
  contents: read

jobs:
  support-auto-resolution-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --experimental-default-type=module --check src/index.js
      - name: Run support resolution security regressions
        run: node --experimental-default-type=module --test tests/support-auto-resolution-security.test.mjs tests/profile-directory-isolation.test.mjs tests/quality-ownership-security.test.mjs
