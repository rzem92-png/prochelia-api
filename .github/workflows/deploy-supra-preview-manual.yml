name: Deploy isolated SUPRA API preview (manual only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PREVIEW_ONLY to allow isolated preview deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supra-api-preview-deploy
  cancel-in-progress: false

jobs:
  isolated-preview:
    if: github.ref == 'refs/heads/feat/supra-governance-on-d1-hardening-2026-11-15' && inputs.confirmation == 'DEPLOY_PREVIEW_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supra-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify Preview-only resources and source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const preview = JSON.parse(fs.readFileSync('wrangler.preview.jsonc', 'utf8'));
          const production = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const previewId = '6adb95e5-e542-4bec-9008-fbea01042305';
          const productionId = '04f52830-ef5a-4f17-a640-42bbc2381bba';
          if (preview.name !== 'prochelia-api-preview' || preview.vars?.APP_ENV !== 'preview') throw Error('Unexpected Preview Worker identity/environment');
          if (preview.workers_dev !== true || preview.keep_vars !== true) throw Error('Preview workers_dev/keep_vars guard missing');
          if (preview.d1_databases?.length !== 1 || preview.d1_databases[0].binding !== 'DB' || preview.d1_databases[0].database_name !== 'prochelia-preview-db' || preview.d1_databases[0].database_id !== previewId) throw Error('Unexpected Preview D1 binding');
          if (preview.r2_buckets?.length !== 1 || preview.r2_buckets[0].binding !== 'BACKUP_BUCKET' || preview.r2_buckets[0].bucket_name !== 'prochelia-preview-backups-eu') throw Error('Preview R2 binding missing');
          if (production.name !== 'prochelia-api' || !production.d1_databases?.some(db => db.database_id === productionId)) throw Error('Production identity check failed');
          if (production.name === preview.name || production.d1_databases.some(db => db.database_id === previewId)) throw Error('Production/Preview isolation violation');
          if (!preview.vars.CORS_ORIGIN.split(',').includes('https://security-frontend-profile-se.prochelia.pages.dev')) throw Error('SUPRA frontend Preview origin is not allowed');
          console.log('Preview Worker, D1, R2 and frontend origin verified; Production D1 excluded.');
          NODE
      - name: Syntax-check Worker ES modules
        run: |
          node --experimental-default-type=module --check src/index.js
          node --experimental-default-type=module --check src/v7.js
          node --experimental-default-type=module --check src/v7-routes.js
      - name: Run SUPRA governance and security regression tests
        run: |
          node --experimental-default-type=module --test \
            tests/supra-intelligence.test.mjs \
            tests/supra-orchestrator.test.mjs \
            tests/supra-production-gates.test.mjs \
            tests/supra-route-contract.test.mjs \
            tests/supra-security-regression.test.mjs \
            tests/supra-automatic-action-gates.test.js \
            tests/request-body.test.mjs \
            tests/v7-security.test.js
      - name: Validate backup restore preparation tests
        run: python3 -m unittest tests/test_prepare_d1_restore.py
      - name: Validate Preview bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.preview.jsonc --outdir "$RUNNER_TEMP/prochelia-supra-preview-dry-run"
      - name: Verify Cloudflare token and Preview Worker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "f2a79e9fa41566a8ec80fb24c02c60eb" || { echo "::error::CLOUDFLARE_ACCOUNT_ID mismatch"; exit 1; }
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//' | tr -d '\r\n')"
          test -n "$token"
          verify_http="$(curl --silent --show-error --output "$RUNNER_TEMP/token.json" --write-out '%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $token")"
          VERIFY_HTTP="$verify_http" VERIFY_FILE="$RUNNER_TEMP/token.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const http = Number(process.env.VERIFY_HTTP), body = JSON.parse(fs.readFileSync(process.env.VERIFY_FILE, 'utf8'));
          if (http !== 200 || !body.success || body.result?.status !== 'active') throw Error('Cloudflare token verification failed');
          NODE
          scripts_http="$(curl --silent --show-error --output "$RUNNER_TEMP/scripts.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -H "Authorization: Bearer $token")"
          SCRIPTS_HTTP="$scripts_http" SCRIPTS_FILE="$RUNNER_TEMP/scripts.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const http = Number(process.env.SCRIPTS_HTTP), body = JSON.parse(fs.readFileSync(process.env.SCRIPTS_FILE, 'utf8'));
          if (http !== 200 || !body.success || !(body.result || []).some(x => x.id === 'prochelia-api-preview')) throw Error('Preview Worker is not visible to this token/account');
          NODE
      - name: Deploy ONLY isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.preview.jsonc --keep-vars
      - name: Record deployment guardrails
        run: |
          {
            echo 'Preview Worker only: prochelia-api-preview.'
            echo 'D1 is pinned to Preview DB 6adb95e5-e542-4bec-9008-fbea01042305.'
            echo 'R2 binding is the EU Preview backup bucket.'
            echo 'No D1 migrations, Production Worker deployment, or Production D1 writes are performed.'
          } >> "$GITHUB_STEP_SUMMARY"
