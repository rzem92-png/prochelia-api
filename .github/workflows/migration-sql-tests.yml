name: PROCHÉLIA migration SQL tests

on:
  pull_request:
    paths:
      - "src/**"
      - "wrangler*.jsonc"
      - "migrations/**"
      - "migrations-preview-canonical/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/*d1*.yml"
      - ".github/workflows/*migration*.yml"
      - ".github/workflows/*restore*.yml"
      - ".github/workflows/preview-directory-e2e-acceptance.yml"
      - ".github/workflows/migration-sql-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler*.jsonc"
      - "migrations/**"
      - "migrations-preview-canonical/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/*d1*.yml"
      - ".github/workflows/*migration*.yml"
      - ".github/workflows/*restore*.yml"
      - ".github/workflows/migration-sql-tests.yml"

permissions:
  contents: read

jobs:
  migration-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint D1 migration and restore workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          for workflow in .github/workflows/*d1*.yml .github/workflows/*migration*.yml .github/workflows/*restore*.yml .github/workflows/preview-directory-e2e-acceptance.yml; do
            if [ -f "$workflow" ]; then
              "$HOME/go/bin/actionlint" "$workflow"
            fi
          done
      - name: Validate migration SQL and payment ledger invariants in isolated SQLite
        run: |
          python3 tests/test_migrations_sqlite.py
          python3 tests/test_preview_canonical_migrations.py
          python3 tests/test_prepare_d1_restore.py
