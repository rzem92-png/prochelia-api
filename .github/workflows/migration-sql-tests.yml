name: PROCHÉLIA migration SQL tests

on:
  pull_request:
    paths:
      - "migrations/**"
      - "tests/test_migrations_sqlite.py"
      - "scripts/prepare-d1-restore.py"
      - "tests/test_prepare_d1_restore.py"
      - ".github/workflows/preview-directory-e2e-acceptance.yml"
      - ".github/workflows/restore-production-backup-isolated-test.yml"
      - ".github/workflows/migration-sql-tests.yml"
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "tests/test_migrations_sqlite.py"
      - ".github/workflows/migration-sql-tests.yml"

permissions:
  contents: read

jobs:
  migration-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint isolated production restore workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint" .github/workflows/restore-production-backup-isolated-test.yml
          "$HOME/go/bin/actionlint" .github/workflows/preview-directory-e2e-acceptance.yml
          "$HOME/go/bin/actionlint" .github/workflows/restore-production-backup-isolated-test.yml
      - name: Validate migration SQL and payment ledger invariants in isolated SQLite
        run: |
          python3 tests/test_migrations_sqlite.py
          python3 tests/test_prepare_d1_restore.py
