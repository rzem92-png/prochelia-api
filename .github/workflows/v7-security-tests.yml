name: V7 authority-route security tests

on:
  pull_request:
    paths:
      - "src/index.js"
      - "src/v7-routes.js"
      - "src/v7.js"
      - "tests/v7-routes-security.test.js"
      - ".github/workflows/v7-security-tests.yml"
  push:
    branches:
      - "preprod/**"
    paths:
      - "src/v7-routes.js"
      - "src/v7.js"
      - "tests/v7-routes-security.test.js"
      - ".github/workflows/v7-security-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check Worker and V7 module
        run: |
          node --check src/index.js
          node --check src/v7-routes.js
      - name: Run V7 security tests
        run: node --test tests/v7-routes-security.test.js
