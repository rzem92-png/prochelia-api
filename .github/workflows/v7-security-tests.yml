name: V7 security regression tests

on:
  pull_request:
    paths:
      - "src/v7.js"
      - "src/v7-routes.js"
      - "src/index.js"
      - "tests/**"
      - ".github/workflows/v7-security-tests.yml"
      - ".github/workflows/deploy-preview-worker-manual.yml"
      - ".github/workflows/preview-directory-e2e-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "src/v7.js"
      - "src/v7-routes.js"
      - "src/index.js"
      - "tests/**"
      - ".github/workflows/v7-security-tests.yml"
      - ".github/workflows/deploy-preview-worker-manual.yml"
      - ".github/workflows/preview-directory-e2e-acceptance.yml"

permissions:
  contents: read

jobs:
  v7-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Lint guarded Preview deployment workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint" .github/workflows/deploy-preview-worker-manual.yml .github/workflows/preview-directory-e2e-acceptance.yml
      - name: Run V7 authorization regression tests
        run: node --experimental-default-type=module --test tests/v7-security.test.js tests/deploy-preview-workflow.test.mjs tests/preview-e2e-workflow.test.mjs tests/payment-webhook-security.test.js tests/mission-security-atomic.test.js tests/payout-atomicity.test.js tests/payment-settlement-guard.test.js tests/payment-webhook-settlement-gate.test.js tests/bootstrap-atomic.test.js tests/pricing-server-authority.test.js tests/rate-limit-client-ip.test.js tests/identity-security-schema-contract.test.js tests/payment-schema-contract.test.js tests/strategic-schema-contract.test.js tests/consolidated-schema-contract.test.js tests/finance-workspace-schema-contract.test.js tests/operational-schema-contract.test.js tests/commercial-recruitment-schema-contract.test.js tests/national-continuity-schema-contract.test.js tests/brand-support-copilot-schema-contract.test.js
      - name: Set up Python for full regression suite
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete Node regression suite
        run: node --experimental-default-type=module --test tests/*.test.js tests/*.test.mjs
      - name: Run complete Python regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
