name: V7 security regression tests

on:
  pull_request:
    paths:
      - "src/v7.js"
      - "src/v7-routes.js"
      - "src/index.js"
      - "src/nexus-d1-task-audit-store.js"
      - "src/nexus-d1-task-audit-reader.js"
      - "src/nexus-d1-task-audit-scan.js"
      - "src/nexus-d1-task-audit-alerts.js"
      - "src/nexus-alert-cooldown.js"
      - "src/nexus-incident-lifecycle.js"
      - "tests/nexus-incident-lifecycle.test.mjs"
      - "src/nexus-incident-correlation.js"
      - "tests/nexus-incident-correlation.test.mjs"
      - "src/nexus-root-cause.js"
      - "tests/nexus-root-cause.test.mjs"
      - "src/nexus-improvement-triage.js"
      - "tests/nexus-improvement-triage.test.mjs"
      - "src/nexus-cross-functional-impact.js"
      - "tests/nexus-cross-functional-impact.test.mjs"
      - "src/nexus-incident-case-linkage.js"
      - "tests/nexus-incident-case-linkage.test.mjs"
      - "tests/nexus-alert-cooldown.test.mjs"
      - "migrations-preview-canonical/**"
      - "tests/**"
      - ".github/workflows/v7-security-tests.yml"
      - ".github/workflows/apply-preview-d1-migrations.yml"
      - ".github/workflows/deploy-preview-worker-manual.yml"
      - ".github/workflows/preview-directory-e2e-acceptance.yml"
      - ".github/workflows/provision-preview-r2-eu.yml"
      - ".github/workflows/backup-preview-d1-to-r2-eu.yml"
      - ".github/workflows/restore-preview-r2-backup-isolated-test.yml"
  push:
    branches: [main]
    paths:
      - "src/v7.js"
      - "src/v7-routes.js"
      - "src/index.js"
      - "src/nexus-d1-task-audit-scan.js"
      - "src/nexus-d1-task-audit-alerts.js"
      - "tests/**"
      - ".github/workflows/v7-security-tests.yml"
      - ".github/workflows/deploy-preview-worker-manual.yml"
      - ".github/workflows/preview-directory-e2e-acceptance.yml"
      - ".github/workflows/provision-preview-r2-eu.yml"
      - ".github/workflows/backup-preview-d1-to-r2-eu.yml"
      - ".github/workflows/restore-preview-r2-backup-isolated-test.yml"

permissions:
  contents: read

jobs:
  v7-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Lint guarded Preview deployment workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint" .github/workflows/deploy-preview-worker-manual.yml .github/workflows/apply-preview-d1-migrations.yml .github/workflows/preview-directory-e2e-acceptance.yml .github/workflows/provision-preview-r2-eu.yml .github/workflows/backup-preview-d1-to-r2-eu.yml .github/workflows/restore-preview-r2-backup-isolated-test.yml
      - name: Run V7 authorization regression tests
        run: node --experimental-default-type=module --test tests/v7-security.test.js tests/deploy-preview-workflow.test.mjs tests/preview-e2e-workflow.test.mjs tests/payment-webhook-security.test.js tests/mission-security-atomic.test.js tests/payout-atomicity.test.js tests/payment-settlement-guard.test.js tests/payment-webhook-settlement-gate.test.js tests/payments-configured-guard.test.js tests/bootstrap-atomic.test.js tests/preview-migration-workflow.test.mjs tests/provision-preview-r2-eu-workflow.test.mjs tests/backup-preview-r2-eu-workflow.test.mjs tests/restore-preview-r2-backup-workflow.test.mjs tests/nexus-governance.test.mjs tests/nexus-task-lifecycle.test.mjs tests/nexus-audit-ledger.test.mjs tests/nexus-task-audit-bridge.test.mjs tests/nexus-task-audit-commit.test.mjs tests/nexus-d1-task-audit-store.test.mjs tests/nexus-d1-task-audit-reader.test.mjs tests/nexus-d1-task-audit-scan.test.mjs tests/nexus-d1-task-audit-alerts.test.mjs tests/nexus-alert-cooldown.test.mjs tests/nexus-incident-lifecycle.test.mjs tests/nexus-incident-correlation.test.mjs tests/nexus-root-cause.test.mjs tests/nexus-improvement-triage.test.mjs tests/nexus-cross-functional-impact.test.mjs tests/nexus-incident-case-linkage.test.mjs tests/worker-build-preview-only.test.mjs
