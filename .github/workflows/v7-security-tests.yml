name: V7 security regression tests

on:
  pull_request:
    paths:
      - "src/v7.js"
      - "src/v7-routes.js"
      - "src/index.js"
      - "tests/**"
      - ".github/workflows/v7-security-tests.yml"
      - ".github/workflows/supra-core-validation.yml"
      - ".github/workflows/apply-preview-d1-migrations.yml"
      - ".github/workflows/deploy-preview-worker-manual.yml"
      - ".github/workflows/supra-core-validation.yml"
      - ".github/workflows/preview-directory-e2e-acceptance.yml"
      - ".github/workflows/provision-preview-r2-eu.yml"
      - ".github/workflows/backup-preview-d1-to-r2-eu.yml"
      - ".github/workflows/restore-preview-r2-backup-isolated-test.yml"
  push:
    branches: [main]
    paths:
      - "src/v7.js"
      - "src/v7-routes.js"
      - "src/index.js"
      - "tests/**"
      - ".github/workflows/v7-security-tests.yml"
      - ".github/workflows/deploy-preview-worker-manual.yml"
      - ".github/workflows/preview-directory-e2e-acceptance.yml"
      - ".github/workflows/provision-preview-r2-eu.yml"
      - ".github/workflows/backup-preview-d1-to-r2-eu.yml"
      - ".github/workflows/restore-preview-r2-backup-isolated-test.yml"

permissions:
  contents: read

jobs:
  v7-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Lint guarded Preview deployment workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint" .github/workflows/deploy-preview-worker-manual.yml .github/workflows/apply-preview-d1-migrations.yml .github/workflows/preview-directory-e2e-acceptance.yml .github/workflows/provision-preview-r2-eu.yml .github/workflows/backup-preview-d1-to-r2-eu.yml .github/workflows/restore-preview-r2-backup-isolated-test.yml .github/workflows/supra-core-validation.yml
      - name: Run V7 authorization regression tests
        run: node --experimental-default-type=module --test tests/v7-security.test.js tests/operational-case-ownership.test.js tests/finance-summary-fail-closed.test.js tests/complaint-fail-closed.test.js tests/pricing-fail-closed.test.js tests/operational-execution-fail-closed.test.js tests/accounting-outbox-fail-closed.test.mjs tests/security-device-attestation-fail-closed.test.mjs tests/finance-workspace-fail-closed.test.mjs tests/deploy-preview-workflow.test.mjs tests/preview-e2e-workflow.test.mjs tests/payment-webhook-security.test.js tests/mission-security-atomic.test.js tests/payout-atomicity.test.js tests/payment-settlement-guard.test.js tests/payment-webhook-settlement-gate.test.js tests/payments-configured-guard.test.js tests/payment-webhook-provider-gate.test.mjs tests/payment-status-read-only.test.mjs tests/payments-routes-fail-closed.test.mjs tests/bootstrap-atomic.test.js tests/preview-migration-workflow.test.mjs tests/provision-preview-r2-eu-workflow.test.mjs tests/backup-preview-r2-eu-workflow.test.mjs tests/restore-preview-r2-backup-workflow.test.mjs
