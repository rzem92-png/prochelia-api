name: Validate PROCHÉLIA IA SUPRA-INTELLIGENTE

on:
  push:
    branches: [feat/supra-intelligence-governance-v1]
  pull_request:
    branches: [main]
    paths:
      - "src/index.js"
      - "src/v7.js"
      - "src/supra-intelligence.js"
      - "src/supra-orchestrator.js"
      - "tests/supra-*.test.mjs"
      - "package.json"
      - "wrangler.jsonc"
      - "wrangler.preview.jsonc"
      - ".github/workflows/validate-supra-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supra-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned project dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run build
      - name: Bundle production configuration without deploying
        run: npm run check:worker
      - name: Bundle isolated preview configuration without deploying
        run: npm run check:worker:preview
      - name: Run the complete API regression suite, including SUPRA
        run: npm test
      - name: Confirm no deployment or D1 migration
        run: echo "Validation only — Wrangler dry-runs, no Cloudflare deployment and no D1 migration."
