name: Nexus Supra autonomous action safety tests
on:
  pull_request:
    paths:
      - "src/index.js"
      - "tests/nexus-autonomous-action-safety.test.mjs"
      - ".github/workflows/nexus-autonomous-action-safety.yml"
  push:
    branches: [main]
    paths:
      - "src/index.js"
      - "tests/nexus-autonomous-action-safety.test.mjs"
      - ".github/workflows/nexus-autonomous-action-safety.yml"
permissions:
  contents: read
jobs:
  autonomy-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Source syntax
        run: node --check src/index.js
      - name: Regression safety tests
        run: node --test tests/nexus-autonomous-action-safety.test.mjs
