name: PROCHÉLIA backup and restore guardrails

on:
  push:
    branches:
      - preprod/backup-integrity-restore-gates
  pull_request:
    branches:
      - preprod/expert-df7373c-finance-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prochelia-backup-restore-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker syntax
        run: |
          set -euo pipefail
          node --check src/index.js
      - name: Enforce non-destructive backup and restore gates
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('src/index.js', 'utf8');
          const gates = fs.readFileSync('docs/operations/BACKUP_RESTORE_RELEASE_GATES.md', 'utf8');

          function section(start, end) {
            const a = source.indexOf(start);
            if (a < 0) throw new Error('Missing expected source marker: ' + start);
            const b = end ? source.indexOf(end, a) : source.length;
            if (end && b < 0) throw new Error('Missing expected end marker: ' + end);
            return source.slice(a, b < 0 ? source.length : b);
          }

          const backup = section('async function runNationalBackup', 'async function nationalScaleStatus');
          const status = section('async function backupStatus', 'const __procheliaNationalHandle');
          if (!/retentionEnforced:false/.test(status)) {
            throw new Error('Retention must remain explicitly unenforced until restore evidence exists');
          }
          if (!/retentionStatus:'POLICY_ONLY_NOT_ENFORCED'/.test(status)) {
            throw new Error('Retention status must remain truthful');
          }
          if (/\b(?:delete|purge)\s*\(/i.test(backup) || /\bDELETE\s+FROM\b/i.test(backup)) {
            throw new Error('Destructive deletion detected in backup execution path');
          }
          if (!/BACKUP_OBJECT_READ_AFTER_WRITE_FAILED/.test(backup) ||
              !/BACKUP_OBJECT_CHECKSUM_MISMATCH/.test(backup)) {
            throw new Error('Backup object read-after-write integrity checks missing');
          }
          if (!/transactionally consistent database snapshot/i.test(gates) ||
              !/restore implementation/i.test(gates) ||
              !/Retention deletion stays disabled/i.test(gates)) {
            throw new Error('Operational release gate documentation is incomplete');
          }
          console.log('Backup/restore non-destructive guardrails passed');
          NODE
