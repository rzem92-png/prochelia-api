name: Nexus Supra live moderation policy tests

on:
  pull_request:
    paths:
      - "src/live-moderation-policy.js"
      - "src/v7-routes.js"
      - "tests/live-moderation-policy.test.mjs"
      - "tests/live-moderation-routes.test.mjs"
      - ".github/workflows/live-moderation-policy-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/live-moderation-policy.js"
      - "src/v7-routes.js"
      - "tests/live-moderation-policy.test.mjs"
      - "tests/live-moderation-routes.test.mjs"
      - ".github/workflows/live-moderation-policy-tests.yml"

permissions:
  contents: read

jobs:
  live-moderation-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run live moderation policy and route tests
        run: node --experimental-default-type=module --test tests/live-moderation-policy.test.mjs tests/live-moderation-routes.test.mjs
