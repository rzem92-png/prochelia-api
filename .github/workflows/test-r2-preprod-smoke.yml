name: Preproduction regression tests

on:
  push:
    branches:
      - preprod/r2-eu-binding-isolated-2026-11-07
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/test-r2-preprod-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run complete Node regression suite (no Cloudflare credentials)
        run: node --test tests/*.test.mjs
