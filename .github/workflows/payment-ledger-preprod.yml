name: PROCHÉLIA payment ledger safety tests

on:
  push:
    branches:
      - preprod/expert-df7373c-finance-hardening
  pull_request:
    branches:
      - staging-prochelia-v14
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-ledger-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ledger SQL safety tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Validate Worker JavaScript syntax
        run: node --check src/index.js
