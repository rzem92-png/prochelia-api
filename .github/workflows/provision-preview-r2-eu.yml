name: Provision PROCHÉLIA isolated Preview R2 EU bucket

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CREATE_PREVIEW_R2_EU_ONLY to create the isolated Preview bucket"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prochelia-preview-r2-eu-provision
  cancel-in-progress: false

jobs:
  provision-preview-r2-eu:
    if: ${{ github.ref == 'refs/heads/fix/provision-r2-preview-eu-2026-11-17' && inputs.confirmation == 'CREATE_PREVIEW_R2_EU_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
      BUCKET: prochelia-preview-backups-eu-v2
    steps:
      - name: Verify Cloudflare token and account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          token="${CLOUDFLARE_API_TOKEN#Bearer }"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/token.json" --write-out '%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $token")"
          test "$status" = "200"
          jq -e '.success == true and .result.status == "active"' "$RUNNER_TEMP/token.json" >/dev/null

      - name: Create bucket only if absent in the EU jurisdiction
        shell: bash
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN#Bearer }"
          api="https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/r2/buckets/$BUCKET"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/r2-existing.json" --write-out '%{http_code}' "$api" -H "Authorization: Bearer $token" -H 'cf-r2-jurisdiction: eu')"
          if [ "$status" = "200" ]; then
            jq -e --arg bucket "$BUCKET" '.success == true and .result.name == $bucket and .result.jurisdiction == "eu"' "$RUNNER_TEMP/r2-existing.json" >/dev/null || {
              echo "::error::Existing bucket metadata is not explicitly EU. Refusing to reuse or modify it."
              exit 1
            }
            echo "PASS: the dedicated bucket already exists in EU jurisdiction."
          elif [ "$status" = "404" ]; then
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/r2-create.json" --write-out '%{http_code}' -X POST "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/r2/buckets" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -H 'cf-r2-jurisdiction: eu' --data '{"name":"prochelia-preview-backups-eu-v2","locationHint":"eeur","storageClass":"Standard"}')"
            test "$status" = "200" || { echo "::error::R2 EU bucket creation failed (HTTP $status)."; jq -c '.errors // []' "$RUNNER_TEMP/r2-create.json"; exit 1; }
            jq -e --arg bucket "$BUCKET" '.success == true and .result.name == $bucket' "$RUNNER_TEMP/r2-create.json" >/dev/null
            echo "PASS: Cloudflare accepted creation in EU jurisdiction."
          else
            echo "::error::EU bucket lookup failed (HTTP $status); no create attempted."
            exit 1
          fi

      - name: Independently verify EU jurisdiction (location hint is best-effort)
        shell: bash
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN#Bearer }"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/r2-final.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/r2/buckets/$BUCKET" -H "Authorization: Bearer $token" -H 'cf-r2-jurisdiction: eu')"
          test "$status" = "200"
          jq -e --arg bucket "$BUCKET" '.success == true and .result.name == $bucket and .result.jurisdiction == "eu" and (.result.location | type == "string" and length > 0)' "$RUNNER_TEMP/r2-final.json" >/dev/null || {
            echo "::error::Final bucket verification did not confirm the exact bucket and EU jurisdiction."
            exit 1
          }
          {
            echo "Verified Preview-only R2 bucket: $BUCKET."
            jq -r '"Cloudflare metadata confirms jurisdiction=eu; actual location=" + .result.location + "."' "$RUNNER_TEMP/r2-final.json"
            echo "No existing bucket was renamed, deleted, rebound, or copied."
            echo "No Worker deployment, D1 migration, Production change, or customer-data transfer occurred."
          } >> "$GITHUB_STEP_SUMMARY"
