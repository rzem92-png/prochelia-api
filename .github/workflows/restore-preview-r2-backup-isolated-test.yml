name: PROCHÉLIA — restaurer une sauvegarde R2 Preview dans D1 isolée

on:
  workflow_dispatch:
    inputs:
      backup_object_key:
        description: "Clé exacte de l'objet .sql.gpg dans le bucket Preview EU v2"
        required: true
        type: string
      confirm_restore:
        description: "Saisir exactement RESTORE_PREVIEW_R2_TO_ISOLATED_TEST_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prochelia-preview-r2-restore-isolated
  cancel-in-progress: false

jobs:
  restore-isolated:
    if: >-
      (
        github.ref == 'refs/heads/main'
      ) &&
      inputs.confirm_restore == 'RESTORE_PREVIEW_R2_TO_ISOLATED_TEST_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_ATTESTATION_HMAC_KEY: ${{ secrets.BACKUP_ATTESTATION_HMAC_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_EU_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_EU_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      EXPECTED_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
      SOURCE_DB_NAME: prochelia-preview-eu-2026-11-17
      RESTORE_DB_NAME: prochelia-r2-restore-validation-2026-11-18
      RESTORE_DB_ID: 6b9a2659-53b7-499a-a53c-eeae64166508
      PREVIEW_DB_ID: e3cf167c-37e1-4d72-9ac6-b3e27c14b97f
      PRODUCTION_DB_ID: 04f52830-ef5a-4f17-a640-42bbc2381bba
      R2_BUCKET: prochelia-preview-backups-eu-v2
      R2_ENDPOINT: https://f2a79e9fa41566a8ec80fb24c02c60eb.eu.r2.cloudflarestorage.com
      BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
    steps:
      - name: Enforce exact branch, confirmation, object key and required secrets
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            *) echo "::error::Restore is restricted to main or the dedicated isolated-restore branch."; exit 1 ;;
          esac
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          for name in CLOUDFLARE_API_TOKEN BACKUP_ENCRYPTION_KEY BACKUP_ATTESTATION_HMAC_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!name:-}" || { echo "::error::Required secret missing: $name"; exit 1; }
          done
          test "${#AWS_ACCESS_KEY_ID}" -eq 32 || { echo "::error::R2 S3 Access Key ID must be 32 characters."; exit 1; }
          test "${#BACKUP_ATTESTATION_HMAC_KEY}" -ge 32 || { echo "::error::BACKUP_ATTESTATION_HMAC_KEY must contain at least 32 UTF-8 bytes."; exit 1; }
          test "$BACKUP_ATTESTATION_HMAC_KEY" != "$BACKUP_ENCRYPTION_KEY" || { echo "::error::Backup attestation and encryption keys must be distinct secrets."; exit 1; }
          if ! [[ "$BACKUP_OBJECT_KEY" =~ ^preview-d1/prochelia-preview-eu-2026-11-17/[0-9]{4}/[0-9]{2}/[0-9]{2}/[0-9]+-[0-9a-f]{12}\.sql\.gpg$ ]]; then
            echo "::error::Object key does not match the exact generated Preview backup key format."
            exit 1
          fi

      - name: Checkout pinned tooling context
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify Cloudflare token, account and dedicated EU R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN#Bearer }"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/token.json" --write-out '%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $token")"
          test "$status" = "200"
          jq -e '.success == true and .result.status == "active"' "$RUNNER_TEMP/token.json" >/dev/null
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/bucket.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/r2/buckets/$R2_BUCKET" -H "Authorization: Bearer $token" -H "cf-r2-jurisdiction: eu")"
          test "$status" = "200" || { echo "::error::R2 EU bucket not found; restore refused."; exit 1; }
          jq -e '.success == true and .result.name == "prochelia-preview-backups-eu-v2" and .result.jurisdiction == "eu"' "$RUNNER_TEMP/bucket.json" >/dev/null

          status="$(curl --silent --show-error --output "$RUNNER_TEMP/source-d1.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/d1/database/$PREVIEW_DB_ID" -H "Authorization: Bearer $token")"
          test "$status" = "200" || { echo "::error::Source Preview D1 metadata lookup failed; restore refused."; exit 1; }
          jq -e --arg id "$PREVIEW_DB_ID" --arg name "$SOURCE_DB_NAME" '.success == true and .result.uuid == $id and .result.name == $name and .result.jurisdiction == "eu"' "$RUNNER_TEMP/source-d1.json" >/dev/null || {
            echo "::error::Source backup database is not the exact EU Preview D1; restore refused."
            exit 1
          }

      - name: Verify exact isolated D1 restore target and generate Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          test "$RESTORE_DB_NAME" = "prochelia-r2-restore-validation-2026-11-18"
          test "$RESTORE_DB_ID" = "6b9a2659-53b7-499a-a53c-eeae64166508"
          test "$RESTORE_DB_ID" != "$PREVIEW_DB_ID"
          test "$RESTORE_DB_ID" != "$PRODUCTION_DB_ID"
          token="${CLOUDFLARE_API_TOKEN#Bearer }"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/d1-list.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/d1/database?name=$RESTORE_DB_NAME" -H "Authorization: Bearer $token")"
          test "$status" = "200"
          jq -e --arg n "$RESTORE_DB_NAME" --arg id "$RESTORE_DB_ID" '[.result[]? | select(.name == $n and .uuid == $id)] | length == 1' "$RUNNER_TEMP/d1-list.json" >/dev/null
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/restore-d1.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$EXPECTED_ACCOUNT_ID/d1/database/$RESTORE_DB_ID" -H "Authorization: Bearer $token")"
          test "$status" = "200" || { echo "::error::Isolated restore D1 metadata lookup failed; restore refused."; exit 1; }
          jq -e --arg id "$RESTORE_DB_ID" --arg name "$RESTORE_DB_NAME" '.success == true and .result.uuid == $id and .result.name == $name and .result.jurisdiction == "eu"' "$RUNNER_TEMP/restore-d1.json" >/dev/null || {
            echo "::error::Isolated restore D1 is not the exact EU target; restore refused."
            exit 1
          }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg = {
            name: "prochelia-restore-validator",
            compatibility_date: "2026-09-25",
            d1_databases: [{
              binding: "DB",
              database_name: "prochelia-r2-restore-validation-2026-11-18",
              database_id: "6b9a2659-53b7-499a-a53c-eeae64166508"
            }]
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + "/wrangler.restore.json", JSON.stringify(cfg));
          NODE

      - name: Download encrypted backup and checksum from R2 EU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnupg sqlite3
          python3 -m pip install --user --break-system-packages awscli
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/prochelia-restore"
          aws s3 cp "s3://$R2_BUCKET/$BACKUP_OBJECT_KEY" "$RUNNER_TEMP/prochelia-restore/backup.sql.gpg" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$BACKUP_OBJECT_KEY.sha256" "$RUNNER_TEMP/prochelia-restore/backup.sha256" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$BACKUP_OBJECT_KEY.attestation.json" "$RUNNER_TEMP/prochelia-restore/attestation.json" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$BACKUP_OBJECT_KEY.attestation.hmac" "$RUNNER_TEMP/prochelia-restore/attestation.hmac" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          test -s "$RUNNER_TEMP/prochelia-restore/backup.sql.gpg"
          test -s "$RUNNER_TEMP/prochelia-restore/backup.sha256"
          test -s "$RUNNER_TEMP/prochelia-restore/attestation.json"
          test -s "$RUNNER_TEMP/prochelia-restore/attestation.hmac"

      - name: Verify HMAC attestation and exact Preview source before decryption
        shell: bash
        run: |
          set -euo pipefail
          node scripts/r2-backup-attestation.mjs verify "$RUNNER_TEMP/prochelia-restore/attestation.json" "$RUNNER_TEMP/prochelia-restore/attestation.hmac"
          jq -e --arg key "$BACKUP_OBJECT_KEY" --arg bucket "$R2_BUCKET" --arg db "$PREVIEW_DB_ID" --arg name "$SOURCE_DB_NAME" --arg account "$EXPECTED_ACCOUNT_ID" '
            .schema_version == 1 and
            .attestation_type == "prochelia.preview-d1-backup" and
            .source.account_id == $account and
            .source.database_id == $db and
            .source.database_name == $name and
            .source.jurisdiction == "eu" and
            .object.bucket == $bucket and
            .object.key == $key and
            .object.sha256_manifest_key == ($key + ".sha256") and
            .provenance.repository == "rzem92-png/prochelia-api" and
            .provenance.ref == "refs/heads/main" and
            (.provenance.migration_source_sha | test("^[0-9a-f]{40}$")) and
            .validation.sqlite_integrity_check == "ok" and
            .validation.foreign_key_check == "empty" and
            .validation.encryption == "OpenPGP-AES256" and
            (.provenance.commit_sha | test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/prochelia-restore/attestation.json" >/dev/null || {
            echo "::error::HMAC attestation does not bind this exact EU Preview backup object; restore refused."
            exit 1
          }
          cipher_actual="$(sha256sum "$RUNNER_TEMP/prochelia-restore/backup.sql.gpg" | awk '{print $1}')"
          cipher_expected="$(jq -r '.object.ciphertext_sha256' "$RUNNER_TEMP/prochelia-restore/attestation.json")"
          test "$cipher_actual" = "$cipher_expected" || { echo "::error::Encrypted backup digest differs from signed attestation."; exit 1; }

      - name: Decrypt, verify checksum and test local SQLite restoration
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$RUNNER_TEMP/prochelia-restore/backup.sql.gpg" > "$RUNNER_TEMP/prochelia-restore/backup.sql"
          actual="$(sha256sum "$RUNNER_TEMP/prochelia-restore/backup.sql" | awk '{print $1}')"
          expected="$(tr -d '[:space:]' < "$RUNNER_TEMP/prochelia-restore/backup.sha256")"
          attested_plain="$(jq -r '.object.plaintext_sha256' "$RUNNER_TEMP/prochelia-restore/attestation.json")"
          test "$actual" = "$expected" && test "$actual" = "$attested_plain" || { echo "::error::Backup checksum differs from the HMAC-attested manifest."; exit 1; }
          grep -Eiq 'CREATE TABLE|INSERT INTO|CREATE INDEX|PRAGMA' "$RUNNER_TEMP/prochelia-restore/backup.sql" || { echo "::error::Decrypted file is not a valid SQL export."; exit 1; }
          sqlite3 "$RUNNER_TEMP/prochelia-restore/local-check.sqlite" < "$RUNNER_TEMP/prochelia-restore/backup.sql"
          integrity="$(sqlite3 "$RUNNER_TEMP/prochelia-restore/local-check.sqlite" 'PRAGMA integrity_check;')"
          test "$integrity" = "ok" || { echo "::error::Local restore integrity_check failed."; exit 1; }
          fk="$(sqlite3 "$RUNNER_TEMP/prochelia-restore/local-check.sqlite" 'PRAGMA foreign_key_check;')"
          test -z "$fk" || { echo "::error::Local restore foreign_key_check failed."; exit 1; }
          echo "PASS: decrypted backup checksum, local restore, SQLite integrity and foreign keys verified."

      - name: Confirm isolated restore database is empty before any remote write
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "$RESTORE_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore.json" --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT GLOB '_cf_*' ORDER BY name;" --json > "$RUNNER_TEMP/pre-restore.json"
          jq -e '[.. | objects | select(has("results")) | .results[]?] | length == 0' "$RUNNER_TEMP/pre-restore.json" >/dev/null || {
            echo "::error::Isolated restore database is not empty. No remote write performed."
            exit 1
          }

      - name: Restore only into the isolated D1 database
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$RESTORE_DB_ID" = "6b9a2659-53b7-499a-a53c-eeae64166508"
          test "$RESTORE_DB_ID" != "$PREVIEW_DB_ID"
          test "$RESTORE_DB_ID" != "$PRODUCTION_DB_ID"
          npx --yes wrangler@4 d1 execute "$RESTORE_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore.json" --file="$RUNNER_TEMP/prochelia-restore/backup.sql" --yes
          echo "SQL restored only to prochelia-r2-restore-validation-2026-11-18."

      - name: Verify restored D1 integrity, foreign keys, tables and migration inventory
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "$RESTORE_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore.json" --command="PRAGMA quick_check;" --json > "$RUNNER_TEMP/quick.json"
          jq -e '[.. | strings] | any(. == "ok")' "$RUNNER_TEMP/quick.json" >/dev/null || { echo "::error::Remote SQLite quick_check failed."; exit 1; }
          npx --yes wrangler@4 d1 execute "$RESTORE_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore.json" --command="PRAGMA foreign_key_check;" --json > "$RUNNER_TEMP/fk.json"
          jq -e '[.. | objects | select(has("results")) | .results[]?] | length == 0' "$RUNNER_TEMP/fk.json" >/dev/null || { echo "::error::Remote SQLite foreign_key_check failed."; exit 1; }
          npx --yes wrangler@4 d1 execute "$RESTORE_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.restore.json" --command="SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT GLOB '_cf_*') AS table_count, (SELECT COUNT(*) FROM d1_migrations) AS migration_count;" --json > "$RUNNER_TEMP/inventory.json"
          jq -e '[.. | objects | select(has("results")) | .results[]? | select(.table_count > 0 and .migration_count > 0)] | any' "$RUNNER_TEMP/inventory.json" >/dev/null || { echo "::error::Restored table or migration inventory is empty."; exit 1; }
          echo "SUCCESS: isolated D1 restore passed quick_check, foreign_key_check and non-empty schema/migration inventory."
          cat "$RUNNER_TEMP/inventory.json" >> "$GITHUB_STEP_SUMMARY"
