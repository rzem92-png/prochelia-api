name: PROCHÉLIA — sauvegarde D1 preview vers R2 EU (test manuel)

on:
  workflow_dispatch:
    inputs:
      confirm_preview_backup:
        description: "Saisir exactement BACKUP_PREVIEW_TO_R2_EU pour lancer une sauvegarde preview"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prochelia-preview-r2-eu-backup
  cancel-in-progress: false

jobs:
  backup-preview:
    if: ${{ github.event.inputs.confirm_preview_backup == 'BACKUP_PREVIEW_TO_R2_EU' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_EU_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_EU_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      EXPECTED_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
      EXPECTED_DB_NAME: prochelia-preview-db
      EXPECTED_DB_ID: 6adb95e5-e542-4bec-9008-fbea01042305
      R2_BUCKET: prochelia-preview-backups-eu
      R2_ENDPOINT: https://f2a79e9fa41566a8ec80fb24c02c60eb.eu.r2.cloudflarestorage.com
    steps:
      - name: Enforce reviewed branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/prelaunch/full-d1-migration-integration" || {
            echo "::error::Restricted to the preview integration branch"; exit 1;
          }

      - name: Checkout exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate secrets and exact preview D1 target
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BACKUP_ENCRYPTION_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!name:-}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("wrangler.jsonc").read_text())
          assert c["name"] == "prochelia-api-preview"
          db=next(x for x in c["d1_databases"] if x["binding"]=="DB")
          assert db["database_name"]=="prochelia-preview-db"
          assert db["database_id"]=="6adb95e5-e542-4bec-9008-fbea01042305"
          assert len(c["d1_databases"])==1
          print("Preview Worker/D1 target pinned.")
          PY

      - name: Install Node.js and AWS CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare account identity
        shell: bash
        run: |
          set -euo pipefail
          identity="$(npx --yes wrangler@4 whoami 2>&1)"
          printf '%s\n' "$identity"
          printf '%s' "$identity" | grep -Fq "$EXPECTED_ACCOUNT_ID"

      - name: Export preview D1 (read-only backup operation)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/prochelia-r2"
          npx --yes wrangler@4 d1 export "$EXPECTED_DB_NAME" --remote --config wrangler.jsonc --skip-confirmation --output="$RUNNER_TEMP/prochelia-r2/preview.sql"
          test -s "$RUNNER_TEMP/prochelia-r2/preview.sql"

      - name: Encrypt export and generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/prochelia-r2/preview.sql.gpg" "$RUNNER_TEMP/prochelia-r2/preview.sql"
          test -s "$RUNNER_TEMP/prochelia-r2/preview.sql.gpg"
          sha256sum "$RUNNER_TEMP/prochelia-r2/preview.sql.gpg" > "$RUNNER_TEMP/prochelia-r2/preview.sql.gpg.sha256"
          rm -f "$RUNNER_TEMP/prochelia-r2/preview.sql"

      - name: Configure AWS CLI for Cloudflare R2 EU endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          aws --version

      - name: Upload encrypted backup to private R2 EU bucket
        shell: bash
        run: |
          set -euo pipefail
          key="preview/d1/${GITHUB_RUN_ID}/preview.sql.gpg"
          aws s3 cp "$RUNNER_TEMP/prochelia-r2/preview.sql.gpg" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          aws s3 cp "$RUNNER_TEMP/prochelia-r2/preview.sql.gpg.sha256" "s3://$R2_BUCKET/$key.sha256" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors

      - name: Download backup from R2 and verify hash
        shell: bash
        run: |
          set -euo pipefail
          key="preview/d1/${GITHUB_RUN_ID}/preview.sql.gpg"
          aws s3 cp "s3://$R2_BUCKET/$key" "$RUNNER_TEMP/prochelia-r2/roundtrip.sql.gpg" --endpoint-url "$R2_ENDPOINT" --region auto --only-show-errors
          sha256sum "$RUNNER_TEMP/prochelia-r2/roundtrip.sql.gpg" | cut -d ' ' -f 1 > "$RUNNER_TEMP/prochelia-r2/roundtrip.sha256"
          expected="$(cut -d ' ' -f 1 "$RUNNER_TEMP/prochelia-r2/preview.sql.gpg.sha256")"
          actual="$(cat "$RUNNER_TEMP/prochelia-r2/roundtrip.sha256")"
          test "$expected" = "$actual" || { echo "::error::R2 download hash mismatch"; exit 1; }

      - name: Verify decrypted backup checksum
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt "$RUNNER_TEMP/prochelia-r2/roundtrip.sql.gpg" > "$RUNNER_TEMP/prochelia-r2/roundtrip.sql"
          test -s "$RUNNER_TEMP/prochelia-r2/roundtrip.sql"
          sha256sum "$RUNNER_TEMP/prochelia-r2/roundtrip.sql" > "$RUNNER_TEMP/prochelia-r2/decrypted.sha256"
          rm -f "$RUNNER_TEMP/prochelia-r2/roundtrip.sql"

      - name: Upload sanitized evidence (no keys or SQL)
        uses: actions/upload-artifact@v4
        with:
          name: prochelia-r2-eu-backup-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/prochelia-r2/*.sha256
          if-no-files-found: error
          retention-days: 7
