name: Market localization Preview Worker tests

on:
  pull_request:
    paths:
      - "src/market-readiness.js"
      - "src/market-localization-preview-worker.js"
      - "tests/market-localization-preview-worker.test.mjs"
      - "wrangler.market-localization-preview.toml"
      - ".github/workflows/market-localization-preview-worker-tests.yml"
  push:
    branches:
      - "feat-market-localization-preview-worker-20261126"
    paths:
      - "src/market-readiness.js"
      - "src/market-localization-preview-worker.js"
      - "tests/market-localization-preview-worker.test.mjs"
      - "wrangler.market-localization-preview.toml"
      - ".github/workflows/market-localization-preview-worker-tests.yml"

permissions:
  contents: read

jobs:
  market-preview-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --experimental-default-type=module --test tests/market-localization-preview-worker.test.mjs
      - run: npx --yes wrangler@4.135.0 deploy --dry-run --config wrangler.market-localization-preview.toml
      - name: Smoke test isolated Cloudflare Preview
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const base = "https://prochelia-market-localization-preview-2026-11-26.rzem92.workers.dev";
          const get = async path => fetch(base + path, { headers: { accept: "application/json" } });
          const marketsResponse = await get("/api/platform/markets");
          assert.equal(marketsResponse.status, 200);
          assert.equal(marketsResponse.headers.get("cache-control"), "no-store");
          assert.equal(marketsResponse.headers.get("access-control-allow-origin"), "*");
          const markets = await marketsResponse.json();
          assert.equal(markets.markets.length, 14);
          assert.equal(markets.launchEnabled, false);
          assert.ok(markets.markets.every(m => m.readiness === "NOT_ASSESSED" && m.launchEnabled === false));
          const france = await get("/api/platform/markets?country=fr");
          assert.equal(france.status, 200);
          assert.deepEqual((await france.json()).markets.map(m => m.code), ["FR"]);
          const algeria = await get("/api/platform/markets/DZ/localization");
          assert.equal(algeria.status, 200);
          const dz = (await algeria.json()).localization;
          assert.equal(dz.currency, "DZD");
          assert.equal(dz.preferredLocale, "ar-DZ");
          assert.equal(dz.timeZone.default, null);
          assert.equal(dz.taxConfiguration.status, "NOT_CONFIGURED");
          assert.equal(dz.launchEnabled, false);
          const unknown = await get("/api/platform/markets/ZZ/localization");
          assert.equal(unknown.status, 404);
          const options = await fetch(base + "/api/platform/markets", { method: "OPTIONS" });
          assert.equal(options.status, 204);
          assert.equal(options.headers.get("access-control-allow-origin"), "*");
          const mutation = await fetch(base + "/api/platform/markets", { method: "POST" });
          assert.equal(mutation.status, 405);
          assert.equal(mutation.headers.get("allow"), "GET");
          const missing = await get("/api/not-market");
          assert.equal(missing.status, 404);
          console.log("Preview HTTP smoke PASS: markets, FR filter, DZ localization, unknown routes, GET-only");
          NODE
