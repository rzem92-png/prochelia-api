name: "PROCHÉLIA API — contrôle syntaxique sans déploiement"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/validate-api-no-deploy.yml"
  push:
    branches: ["audit/d1-integrity-compare-v1"]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/validate-api-no-deploy.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier la syntaxe des modules Worker
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/v7-routes.js
          node --check src/v7.js
      - name: Confirmer le contrôle sans déploiement
        run: |
          echo "Contrôle syntaxique uniquement."
          echo "Aucun accès Cloudflare, aucune requête D1, aucune migration, aucun déploiement."

      - name: Vérifier la disponibilité publique de l'API (GET uniquement)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "https://prochelia-api.rzem92.workers.dev/api/health" \
            -o "$RUNNER_TEMP/prochelia-health.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/prochelia-health.json', 'utf8'));
          if (health.ok !== true) throw new Error('L’API publique ne confirme pas ok=true.');
          console.log(JSON.stringify({ok:health.ok,service:health.service ?? null,version:health.version ?? null}));
          NODE
