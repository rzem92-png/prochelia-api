name: "PROCHÉLIA API — contrôle syntaxique sans déploiement"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/validate-api-no-deploy.yml"
  push:
    branches: ["audit/d1-integrity-compare-v1"]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/validate-api-no-deploy.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier la syntaxe des modules Worker
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/v7-routes.js
          node --check src/v7.js
      - name: Confirmer le contrôle sans déploiement
        run: |
          echo "Contrôle syntaxique uniquement."
          echo "Aucun accès Cloudflare, aucune requête D1, aucune migration, aucun déploiement."
