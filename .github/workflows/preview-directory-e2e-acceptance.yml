name: PROCHÉLIA — Preview directory API end-to-end acceptance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_PREVIEW_DIRECTORY_E2E to seed synthetic Preview data and test the live Pages-to-Worker path"
        required: true
        type: string
      pages_branch:
        description: "Expected frontend Preview branch for the Pages-to-Worker E2E path"
        required: false
        default: "fix/frontend-cookie-session-auth-2026-11-17"
        type: string
      pages_commit_sha:
        description: "Exact 40-character frontend commit SHA; must match the latest successful Pages Preview deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prochelia-preview-directory-e2e
  cancel-in-progress: false

jobs:
  preview-directory-e2e:
    if: >-
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/fix/preview-e2e-dynamic-pages-pin-2026-11-17' ||
        github.ref == 'refs/heads/fix/preview-critical-tenant-guards-2026-11-18'
      ) &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'RUN_PREVIEW_DIRECTORY_E2E'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
      PREVIEW_DB_NAME: prochelia-preview-eu-2026-11-17
      PREVIEW_DB_ID: e3cf167c-37e1-4d72-9ac6-b3e27c14b97f
      API_EXPECTED_COMMIT: ${{ github.sha }}
      PAGES_PREVIEW_BRANCH: ${{ inputs.pages_branch || 'fix/frontend-cookie-session-auth-2026-11-17' }}
      PAGES_EXPECTED_COMMIT: ${{ inputs.pages_commit_sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate E2E workflow and synthetic fixture contract
        run: node --experimental-default-type=module --test tests/preview-e2e-workflow.test.mjs

      - name: Verify Preview D1 and resolve the latest successful Pages Preview deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Cloudflare API token is missing."; exit 1; }
          token="${CLOUDFLARE_API_TOKEN#Bearer }"
          token="$(printf '%s' "$token" | tr -d '\r\n')"
          [[ "$PREVIEW_DB_ID" == "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f" ]]
          [[ "$PREVIEW_DB_ID" != "04f52830-ef5a-4f17-a640-42bbc2381bba" ]]
          [[ "$PAGES_PREVIEW_BRANCH" != "main" ]]
          [[ "$PAGES_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::pages_commit_sha is required and must be an exact 40-character lowercase Git SHA."
            exit 1
          }
          if [[ -n "$PAGES_EXPECTED_COMMIT" && ! "$PAGES_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pages_commit_sha must be an exact 40-character lowercase Git SHA."
            exit 1
          fi
          cf_request() {
            local label="$1" url="$2" output="$3" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              -H "Authorization: Bearer $token" "$url")"
            if [[ "$status" != "200" ]] || ! jq -e '.success == true' "$output" >/dev/null; then
              echo "::error::$label failed (HTTP $status). Cloudflare response:"
              jq -c '{success, errors: [.errors[]? | {code, message}], messages: [.messages[]? | {code, message}]}' "$output" 2>/dev/null || echo "No JSON diagnostic body returned."
              return 1
            fi
            echo "PASS: $label (HTTP $status)."
          }
          cf_request "Cloudflare token verification" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" "$RUNNER_TEMP/token.json"
          jq -e '.result.status == "active"' "$RUNNER_TEMP/token.json" >/dev/null || {
            echo "::error::Cloudflare token is not active."
            exit 1
          }
          cf_request "Preview D1 access" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PREVIEW_DB_ID" "$RUNNER_TEMP/preview-d1.json"
          jq -e --arg name "$PREVIEW_DB_NAME" --arg id "$PREVIEW_DB_ID" '.result.name == $name and .result.uuid == $id' "$RUNNER_TEMP/preview-d1.json" >/dev/null || {
            echo "::error::Preview D1 identity mismatch."
            jq -c '{result: {name: .result.name, uuid: .result.uuid}, errors}' "$RUNNER_TEMP/preview-d1.json"
            exit 1
          }
          cf_request "Pages project Preview/Production configuration" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/prochelia" "$RUNNER_TEMP/pages-project.json"
          jq -e --arg db "$PREVIEW_DB_ID" --arg worker "prochelia-api-preview" '
            .result.deployment_configs.preview.d1_databases.DB.id == $db and
            .result.deployment_configs.preview.services.PROCHELIA_API.service == $worker and
            (.result.deployment_configs.production.d1_databases.DB.id // "") != $db
          ' "$RUNNER_TEMP/pages-project.json" >/dev/null || {
            echo "::error::Pages project Preview binding is not isolated or does not match the expected D1/Worker."
            jq -c '{
              preview_d1: .result.deployment_configs.preview.d1_databases.DB.id,
              preview_service: .result.deployment_configs.preview.services.PROCHELIA_API.service,
              production_d1: (.result.deployment_configs.production.d1_databases.DB.id // null)
            }' "$RUNNER_TEMP/pages-project.json"
            exit 1
          }
          cf_request "Latest Pages Preview deployment listing" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/prochelia/deployments?env=preview&per_page=1&page=1" "$RUNNER_TEMP/pages-deployments.json"
          deployment_id="$(jq -r '.result[0].id // empty' "$RUNNER_TEMP/pages-deployments.json")"
          [[ -n "$deployment_id" ]] || { echo "::error::No Pages Preview deployment exists."; exit 1; }
          cf_request "Latest Pages Preview deployment details" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/prochelia/deployments/$deployment_id" "$RUNNER_TEMP/pages-preview.json"
          if ! jq -e --arg db "$PREVIEW_DB_ID" --arg worker "prochelia-api-preview" --arg branch "$PAGES_PREVIEW_BRANCH" --arg expected "$PAGES_EXPECTED_COMMIT" '
            .result.environment == "preview" and
            .result.is_skipped == false and
            .result.latest_stage.status == "success" and
            .result.uses_functions == true and
            .result.d1_databases.DB.id == $db and
            .result.services.PROCHELIA_API.service == $worker and
            .result.deployment_trigger.metadata.branch == $branch and
            (.result.deployment_trigger.metadata.commit_hash | type == "string" and test("^[0-9a-f]{40}$")) and
            .result.deployment_trigger.metadata.commit_hash == $expected
          ' "$RUNNER_TEMP/pages-preview.json" >/dev/null; then
            echo "::error::Latest Pages Preview deployment is stale, skipped, failed, misbound, or built from an unexpected branch/commit."
            jq -c '{
              observed: {
                id: .result.id,
                environment: .result.environment,
                is_skipped: .result.is_skipped,
                latest_stage: .result.latest_stage,
                uses_functions: .result.uses_functions,
                d1_database_id: .result.d1_databases.DB.id,
                worker_service: .result.services.PROCHELIA_API.service,
                branch: .result.deployment_trigger.metadata.branch,
                commit_hash: .result.deployment_trigger.metadata.commit_hash
              }
            }' "$RUNNER_TEMP/pages-preview.json"
            exit 1
          fi
          pages_url="$(jq -r '.result.url' "$RUNNER_TEMP/pages-preview.json")"
          pages_alias="$(jq -r '.result.aliases[]? | select(test("^https://[a-z0-9-]+\\.prochelia\\.pages\\.dev$"))' "$RUNNER_TEMP/pages-preview.json" | head -n 1)"
          pages_commit="$(jq -r '.result.deployment_trigger.metadata.commit_hash' "$RUNNER_TEMP/pages-preview.json")"
          [[ "$pages_url" =~ ^https://[a-z0-9-]+\.prochelia\.pages\.dev$ ]] || {
            echo "::error::Pages Preview URL is not a verified project deployment URL."
            exit 1
          }
          if [[ -n "$pages_alias" ]]; then
            [[ "$pages_alias" =~ ^https://[a-z0-9-]+\.prochelia\.pages\.dev$ ]] || { echo "::error::Pages Preview alias is not a verified project origin."; exit 1; }
          fi
          cf_request "Preview Worker settings" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/prochelia-api-preview/settings" "$RUNNER_TEMP/preview-worker-settings.json"
          cors_origin="$(jq -r '.result.bindings[] | select(.name == "CORS_ORIGIN" and .type == "plain_text") | .text' "$RUNNER_TEMP/preview-worker-settings.json")"
          [[ -n "$cors_origin" && "$cors_origin" != "null" ]] || {
            echo "::error::Preview Worker CORS_ORIGIN binding is missing."
            exit 1
          }
          IFS=',' read -r -a allowed_origins <<< "$cors_origin"
          expected_origins=("$pages_url")
          if [[ -n "$pages_alias" ]]; then
            expected_origins+=("$pages_alias")
          fi
          for expected_origin in "${expected_origins[@]}"; do
            allowed_origin_found=false
            for allowed_origin in "${allowed_origins[@]}"; do
              if [[ "$(printf '%s' "$allowed_origin" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')" == "$expected_origin" ]]; then
                allowed_origin_found=true
              fi
            done
            if [[ "$allowed_origin_found" != "true" ]]; then
              echo "::error::Preview Worker CORS_ORIGIN does not allow a current Pages Preview origin."
              echo "::error::Add this exact origin to the PREVIEW Worker only: $expected_origin"
              echo "::error::Do not change the Production Worker or remove the existing allowlist entries."
              exit 1
            fi
          done
          cat > "$RUNNER_TEMP/wrangler.preview.json" <<'JSON'
          {
            "name": "prochelia-preview-e2e",
            "compatibility_date": "2026-09-25",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "prochelia-preview-eu-2026-11-17",
              "database_id": "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f"
            }]
          }
          JSON
          printf 'CLOUDFLARE_API_TOKEN=%s\nPAGES_PREVIEW_URL=%s\nPAGES_PREVIEW_ALIAS=%s\nPAGES_DEPLOYMENT_ID=%s\nPAGES_COMMIT_SHA=%s\n' \
            "$token" "$pages_url" "$pages_alias" "$deployment_id" "$pages_commit" >> "$GITHUB_ENV"
          {
            echo "Verified Pages Preview: $pages_url"
            echo "Deployment: $deployment_id"
            echo "Frontend branch: $PAGES_PREVIEW_BRANCH"
            echo "Frontend commit: $pages_commit"
            [[ -z "$pages_alias" ]] || echo "Pages Preview branch alias: $pages_alias"
            echo "Preview D1, service binding, origin and alias match the isolated Preview environment."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Exact isolated Preview D1 and current Pages deployment verified."

      - name: Verify Pages-to-Worker health path
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = new URL('/api/health', process.env.PAGES_PREVIEW_URL);
          const response = await fetch(url, { headers: { accept: 'application/json' }, redirect: 'manual' });
          if (response.status !== 200) throw new Error(`Pages Preview /api/health expected HTTP 200, got ${response.status}`);
          const body = await response.json();
          if (body.ok !== true || body.database !== true || body.service !== 'PROCHÉLIA API') {
            throw new Error('Pages Preview health response did not confirm the Preview API and D1.');
          }
          if (body.deployment_commit !== process.env.API_EXPECTED_COMMIT) {
            throw new Error(`Preview Worker commit mismatch: expected ${process.env.API_EXPECTED_COMMIT}, received ${body.deployment_commit ?? 'missing'}.`);
          }
          console.log(`PASS: same-origin Pages-to-Worker health path; API commit ${body.deployment_commit}; Pages deployment ${process.env.PAGES_DEPLOYMENT_ID}; frontend commit ${process.env.PAGES_COMMIT_SHA}.`);
          NODE

      - name: Read current directory offsets without reading personal rows
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          payload='{"sql":"SELECT (SELECT COUNT(*) FROM clients) AS clients, (SELECT COUNT(*) FROM intervenants) AS intervenants"}'
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/preview-counts.json" --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "$payload" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PREVIEW_DB_ID/query")"
          [[ "$status" == "200" ]]
          jq -e '.success == true' "$RUNNER_TEMP/preview-counts.json" >/dev/null
          clients="$(jq -r '.result[0].results[0].clients' "$RUNNER_TEMP/preview-counts.json")"
          intervenants="$(jq -r '.result[0].results[0].intervenants' "$RUNNER_TEMP/preview-counts.json")"
          [[ "$clients" =~ ^[0-9]+$ && "$intervenants" =~ ^[0-9]+$ ]]
          printf 'E2E_CLIENT_OFFSET=%s\nE2E_INTERVENANT_OFFSET=%s\n' "$clients" "$intervenants" >> "$GITHUB_ENV"
          echo "Existing row counts captured; no personal row data read."

      - name: Generate synthetic test fixtures and guaranteed cleanup SQL
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { randomBytes, createHash } from 'node:crypto';
          import { appendFileSync, writeFileSync } from 'node:fs';
          const run = process.env.GITHUB_RUN_ID;
          const prefix = `e2e-${run}-`;
          const managerToken = randomBytes(32).toString('base64url');
          const clientToken = randomBytes(32).toString('base64url');
          const hash = value => createHash('sha256').update(value).digest('base64url');
          const q = value => "'" + String(value).replaceAll("'", "''") + "'";
          const managerId = prefix + 'manager';
          const clientUsers = Array.from({length:101},(_,i)=>({
            id: prefix + 'client-user-' + String(i).padStart(3,'0'),
            email: `e2e+${run}-client-${i}@example.test`,
            first: 'Synthetic' + String(i).padStart(3,'0'),
            last: '\u{10FFFF}E2E' + run
          }));
          const providerId = prefix + 'provider-user';
          const users = [
            [managerId,'gerante',`e2e+${run}-manager@example.test`,'E2E','Manager'],
            ...clientUsers.map(u=>[u.id,'client',u.email,u.first,u.last]),
            [providerId,'intervenant',`e2e+${run}-provider@example.test`,'E2EProvider','\u{10FFFF}E2E'+run]
          ];
          // The production users schema requires password_hash even for synthetic E2E accounts.
          // Use an unguessable, non-login-capable fixture value; the E2E authenticates via
          // independently generated session tokens and SHA-256 token hashes.
          const userValues = users.map(u=>'('+[...u.map(q),q('active'),q(hash(randomBytes(48).toString('base64url')))].join(',')+')').join(',\n');
          const clientValues = clientUsers.map((u,i)=>'('+[
            q(prefix+'client-'+String(i).padStart(3,'0')),q(u.id),
            q('Synthetic address '+i),q('E2E Test City'),q('00000'),q('Synthetic test fixture'),q('9999-12-31 23:59:59'),q('9999-12-31 23:59:59')
          ].join(',')+')').join(',\n');
          const sessionValues = [
            [prefix+'manager-session',managerId,hash(managerToken)],
            [prefix+'client-session',clientUsers[0].id,hash(clientToken)]
          ].map(x=>'('+[...x.map(q),"datetime('now','+2 hours')"].join(',')+')').join(',\n');
          const seed = [
            'INSERT INTO users (id,role,email,first_name,last_name,status,password_hash) VALUES',
            userValues + ';',
            'INSERT INTO clients (id,user_id,address,city,postal_code,notes,created_at,updated_at) VALUES',
            clientValues + ';',
            'INSERT INTO intervenants (id,user_id,professional_status,description,service_area,hourly_rate,validation_status,created_at,updated_at) VALUES',
            '('+[q(prefix+'intervenant'),q(providerId),q('independent'),q('Synthetic E2E provider'),q('E2E Test City'),'20',q('approved'),q('9999-12-31 23:59:59'),q('9999-12-31 23:59:59')].join(',')+');',
            'INSERT INTO sessions (id,user_id,token_hash,expires_at) VALUES',
            sessionValues + ';'
          ].join('\n');
          const cleanup = [
            `DELETE FROM sessions WHERE id LIKE ${q(prefix+'%')};`,
            `DELETE FROM clients WHERE id LIKE ${q(prefix+'%')};`,
            `DELETE FROM intervenants WHERE id LIKE ${q(prefix+'%')};`,
            `DELETE FROM users WHERE id LIKE ${q(prefix+'%')};`
          ].join('\n');
          const seedPath = process.env.RUNNER_TEMP + '/preview-e2e-seed.sql';
          const cleanupPath = process.env.RUNNER_TEMP + '/preview-e2e-cleanup.sql';
          writeFileSync(seedPath,seed,{mode:0o600});
          writeFileSync(cleanupPath,cleanup,{mode:0o600});
          appendFileSync(process.env.GITHUB_ENV,
            `E2E_MANAGER_TOKEN=${managerToken}\nE2E_CLIENT_TOKEN=${clientToken}\nE2E_PREFIX=${prefix}\n`);
          console.log('::add-mask::' + managerToken);
          console.log('::add-mask::' + clientToken);
          console.log('Synthetic fixture SQL and cleanup SQL prepared; no credentials or personal data printed.');
          NODE

      - name: Seed only the isolated Preview D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_DB_ID" == "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f" ]]
          [[ "$PREVIEW_DB_ID" != "04f52830-ef5a-4f17-a640-42bbc2381bba" ]]
          npx --yes wrangler@4 d1 execute "$PREVIEW_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.preview.json" --file="$RUNNER_TEMP/preview-e2e-seed.sql" --yes
          echo "Synthetic fixtures inserted into Preview D1 only."

      - name: Exercise Pages Preview proxy authentication, role checks and pagination
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.PAGES_PREVIEW_URL;
          const prefix = process.env.E2E_PREFIX;
          const manager = process.env.E2E_MANAGER_TOKEN;
          const client = process.env.E2E_CLIENT_TOKEN;
          const clientOffset = Number(process.env.E2E_CLIENT_OFFSET);
          const providerOffset = Number(process.env.E2E_INTERVENANT_OFFSET);
          async function request(path, token) {
            const headers = { accept: 'application/json', origin: base };
            if (token) headers.cookie = 'prochelia_session=' + token;
            return fetch(base + path, { headers, redirect: 'manual' });
          }
          async function expectStatus(path, token, expected) {
            const response = await request(path, token);
            if (response.status !== expected) throw new Error(`${path}: expected HTTP ${expected}, got ${response.status}`);
            return response;
          }
          const originProbe = await fetch(base + '/api/missions/validate', {
            method: 'POST',
            headers: { accept: 'application/json', 'content-type': 'application/json', origin: base },
            body: '{}',
            redirect: 'manual'
          });
          const originProbeBody = await originProbe.json();
          if (originProbe.status !== 403 || originProbeBody.error !== 'AUTHENTICATED_VALIDATION_REQUIRED') {
            throw new Error('Pages Preview origin was not accepted by the Preview Worker, or the safe closed mission-validation guard changed');
          }
          const rejectedOriginProbe = await fetch(base + '/api/missions/validate', {
            method: 'POST',
            headers: { accept: 'application/json', 'content-type': 'application/json', origin: 'https://untrusted.example' },
            body: '{}',
            redirect: 'manual'
          });
          const rejectedOriginBody = await rejectedOriginProbe.json();
          if (rejectedOriginProbe.status !== 403 || rejectedOriginBody.error !== 'ORIGIN_NOT_ALLOWED') {
            throw new Error('Preview Worker did not reject an untrusted browser origin before mission validation');
          }
          await expectStatus('/api/clients', null, 401);
          await expectStatus('/api/intervenants', null, 401);
          await expectStatus('/api/clients', client, 403);
          await expectStatus('/api/intervenants', client, 403);
          await expectStatus('/api/clients?offset=not-a-number', manager, 400);
          const first = await expectStatus('/api/clients?offset=' + clientOffset, manager, 200);
          const firstBody = await first.json();
          if (!Array.isArray(firstBody.items) || firstBody.items.length !== 100 || firstBody.has_more !== true || firstBody.next_offset !== clientOffset + 100) {
            throw new Error('Client directory first-page pagination contract mismatch');
          }
          if (!firstBody.items.every(row => row.id.startsWith(prefix + 'client-'))) {
            throw new Error('Client directory page contains an unexpected row or sort offset');
          }
          const second = await expectStatus('/api/clients?offset=' + (clientOffset + 100), manager, 200);
          const secondBody = await second.json();
          if (secondBody.items.length !== 1 || secondBody.has_more !== false || secondBody.next_offset !== null || !secondBody.items[0].id.startsWith(prefix + 'client-')) {
            throw new Error('Client directory final-page contract mismatch');
          }
          const providers = await expectStatus('/api/intervenants?offset=' + providerOffset, manager, 200);
          const providerBody = await providers.json();
          if (!providerBody.items.some(row => row.id === prefix + 'intervenant')) {
            throw new Error('Intervenant directory did not return the synthetic Preview fixture');
          }
          if (providerBody.has_more !== false || providerBody.next_offset !== null) {
            throw new Error('Intervenant directory pagination end marker mismatch');
          }
          console.log('PASS: Pages Preview origin accepted by the Worker; unauthenticated 401; client role 403; invalid offset 400; manager directory pagination and provider listing verified.');
          NODE

      - name: Always remove synthetic Preview fixtures and verify cleanup
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/preview-e2e-cleanup.sql" || ! -f "$RUNNER_TEMP/wrangler.preview.json" ]]; then
            echo "No synthetic Preview fixtures were created; cleanup not required."
            exit 0
          fi
          [[ "$PREVIEW_DB_ID" == "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f" ]]
          npx --yes wrangler@4 d1 execute "$PREVIEW_DB_NAME" --remote --config "$RUNNER_TEMP/wrangler.preview.json" --file="$RUNNER_TEMP/preview-e2e-cleanup.sql" --yes
          payload="{\"sql\":\"SELECT (SELECT COUNT(*) FROM users WHERE id LIKE 'e2e-$GITHUB_RUN_ID-%') AS users, (SELECT COUNT(*) FROM sessions WHERE id LIKE 'e2e-$GITHUB_RUN_ID-%') AS sessions, (SELECT COUNT(*) FROM clients WHERE id LIKE 'e2e-$GITHUB_RUN_ID-%') AS clients, (SELECT COUNT(*) FROM intervenants WHERE id LIKE 'e2e-$GITHUB_RUN_ID-%') AS intervenants\"}"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/cleanup-check.json" --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "$payload" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PREVIEW_DB_ID/query")"
          [[ "$status" == "200" ]]
          jq -e '.success == true and .result[0].results[0].users == 0 and .result[0].results[0].sessions == 0 and .result[0].results[0].clients == 0 and .result[0].results[0].intervenants == 0' "$RUNNER_TEMP/cleanup-check.json" >/dev/null
          echo "PASS: all synthetic Preview test rows and sessions removed."
