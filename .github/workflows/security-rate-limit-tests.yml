name: PROCHÉLIA security limiter unit tests

on:
  push:
    branches:
      - preprod/security-rate-limit-atomic-v1
  pull_request:
    branches:
      - preprod/security-rate-limit-atomic-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rate-limit-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run focused unit tests
        run: node --test tests/security-rate-limit-atomic-v1.test.js
