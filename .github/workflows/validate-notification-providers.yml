name: "PROCHÉLIA API — notification providers and security tests"

on:
  pull_request:
    branches: ["main", "integration/auth-cors-profile-routes-v1"]
    paths:
      - "src/notifications/**"
      - "src/index.js"
      - "src/security/**"
      - "tests/notification-providers.test.mjs"
      - "tests/webhook-hmac.test.mjs"
      - "tests/mission-code.test.mjs"
      - "tests/payment-idempotency.test.mjs"
      - ".github/workflows/validate-notification-providers.yml"
  push:
    branches: ["feature/multichannel-notifications-v1"]
    paths:
      - "src/index.js"
      - "src/notifications/**"
      - "src/security/**"
      - "tests/notification-providers.test.mjs"
      - "tests/webhook-hmac.test.mjs"
      - "tests/mission-code.test.mjs"
      - ".github/workflows/validate-notification-providers.yml"

permissions:
  contents: read

jobs:
  notification-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check modules
        run: |
          node --check src/index.js
          node --check src/notifications/providers.js
          node --check src/security/webhook-hmac.js
          node --check src/security/mission-code.js
      - name: Run mocked provider tests
        run: node --test tests/notification-providers.test.mjs
      - name: Run webhook HMAC tests
        run: node --test tests/webhook-hmac.test.mjs
      - name: Run mission code tests
        run: node --test tests/mission-code.test.mjs
      - name: Run payment idempotency tests
        run: node --test tests/payment-idempotency.test.mjs
      - name: Confirm no live provider sends
        run: echo "Tests use local crypto and mocked fetch only."
