name: PROCHÉLIA Worker build validation

on:
  pull_request:
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-preview-worker-manual.yml"
      - ".github/workflows/restore-preview-d1-from-r2-isolated.yml"
      - ".github/workflows/worker-build-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/worker-build-validation.yml"

permissions:
  contents: read

jobs:
  worker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax check Worker ES modules
        run: |
          node --experimental-default-type=module --check src/index.js
          node --experimental-default-type=module --check src/v7.js
          node --experimental-default-type=module --check src/v7-routes.js
      - name: Lint guarded Preview deployment workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint" .github/workflows/deploy-preview-worker-manual.yml .github/workflows/restore-preview-d1-from-r2-isolated.yml
      - name: Wrangler bundle validation only (no deploy)
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/prochelia-worker-dry-run"
