name: PROCHÉLIA Worker build validation

on:
  pull_request:
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-preview-worker-manual.yml"
      - "scripts/generate-preview-wrangler-config.mjs"
      - ".github/workflows/worker-build-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "scripts/generate-preview-wrangler-config.mjs"
      - ".github/workflows/worker-build-validation.yml"

permissions:
  contents: read

jobs:
  worker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax check Worker ES modules
        run: |
          node --experimental-default-type=module --check src/index.js
          node --experimental-default-type=module --check src/v7.js
          node --experimental-default-type=module --check src/v7-routes.js
          node --experimental-default-type=module --check src/nexus-governance.js
          node --experimental-default-type=module --check src/nexus-task-lifecycle.js
          node --experimental-default-type=module --check src/nexus-audit-ledger.js
          node --experimental-default-type=module --check src/nexus-task-audit-bridge.js
          node --experimental-default-type=module --check src/nexus-task-audit-commit.js
          node --experimental-default-type=module --check src/nexus-d1-task-audit-store.js
          node --experimental-default-type=module --check src/nexus-d1-task-audit-alerts.js
          node --experimental-default-type=module --check src/nexus-alert-cooldown.js
          node --experimental-default-type=module --check src/nexus-incident-lifecycle.js
          node --experimental-default-type=module --check src/nexus-incident-correlation.js
          node --experimental-default-type=module --check src/nexus-root-cause.js
          node --experimental-default-type=module --check src/nexus-improvement-triage.js
          node --experimental-default-type=module --check src/nexus-cross-functional-impact.js
          node --experimental-default-type=module --check src/nexus-incident-case-linkage.js
      - name: Lint guarded Preview deployment workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint" .github/workflows/deploy-preview-worker-manual.yml
      - name: Generate isolated Preview deployment config
        run: node scripts/generate-preview-wrangler-config.mjs
      - name: Validate canonical Preview migrations and Nexus D1 invariants (SQLite local only)
        run: |
          python tests/test_preview_canonical_migrations.py
          python tests/test_nexus_task_audit_store_schema.py
      - name: Wrangler bundle validation only (no deploy)
        run: |
          # Preview-only bundle validation: avoid loading/logging production bindings in CI.
          npx --yes wrangler@4 deploy --dry-run --config wrangler.preview.generated.json --outdir "$RUNNER_TEMP/prochelia-preview-worker-dry-run"
