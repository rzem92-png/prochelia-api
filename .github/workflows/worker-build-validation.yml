name: PROCHÉLIA Worker build validation

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/stripe-connect-preprod.test.mjs"
      - "tests/production-release-gate.test.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/worker-build-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/stripe-connect-preprod.test.mjs"
      - "tests/production-release-gate.test.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/worker-build-validation.yml"

permissions:
  contents: read

jobs:
  worker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax check Worker ES modules
        run: |
          node --experimental-default-type=module --check src/index.js
          node --experimental-default-type=module --check src/stripe.js
          node --experimental-default-type=module --check src/v7.js
          node --experimental-default-type=module --check src/v7-routes.js
      - name: Stripe Connect preproduction regression tests
        run: node --experimental-default-type=module --test tests/stripe-connect-preprod.test.mjs
      - name: Production release gate security regressions
        run: node --experimental-default-type=module --test tests/production-release-gate.test.mjs
      - name: Wrangler bundle validation only (no deploy)
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/prochelia-worker-dry-run"
