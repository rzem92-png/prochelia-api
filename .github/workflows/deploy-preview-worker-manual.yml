name: Deploy PROCHÉLIA API preview only (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PREVIEW_ONLY to deploy the isolated Preview Worker"
        required: true
        type: string
      pages_branch:
        description: "Exact frontend Pages Preview branch; must match the latest successful deployment"
        required: true
        type: string
      pages_commit_sha:
        description: "Exact 40-character frontend Pages Preview commit SHA; must match the latest deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prochelia-api-preview-deploy
  cancel-in-progress: false

jobs:
  preview-only:
    if: >-
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/fix/preview-workflow-alignment-active-2026-11-19' ||
        github.ref == 'refs/heads/fix/preview-e2e-dynamic-pages-pin-2026-11-17' ||
        github.ref == 'refs/heads/feat/supra-core-active-preview-2026-11-20'
      ) &&
      inputs.confirmation == 'DEPLOY_PREVIEW_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGES_EXPECTED_BRANCH: ${{ inputs.pages_branch || '' }}
      PAGES_EXPECTED_COMMIT: ${{ inputs.pages_commit_sha || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Resolve and verify latest Pages Preview origin before generating Worker config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" == "f2a79e9fa41566a8ec80fb24c02c60eb" ]] || {
            echo "::error::Unexpected Cloudflare account; refusing Preview configuration."
            exit 1
          }
          [[ "$PAGES_EXPECTED_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ && "$PAGES_EXPECTED_BRANCH" != *".."* ]] || {
            echo "::error::pages_branch is required and must be a valid branch name."
            exit 1
          }
          [[ "$PAGES_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::pages_commit_sha is required and must be an exact 40-character lowercase Git SHA."
            exit 1
          }
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          [[ -n "$token" ]] || { echo "::error::Cloudflare API token is missing."; exit 1; }
          cf_get() {
            local label="$1" url="$2" output="$3" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              -H "Authorization: Bearer $token" "$url")"
            if [[ "$status" != "200" ]] || ! jq -e '.success == true' "$output" >/dev/null; then
              echo "::error::$label failed (HTTP $status)."
              jq -c '{errors, messages}' "$output" 2>/dev/null || true
              return 1
            fi
          }
          cf_get "Pages project Preview configuration" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/prochelia" "$RUNNER_TEMP/pages-project.json"
          jq -e '
            .result.deployment_configs.preview.d1_databases.DB.id == "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f" and
            .result.deployment_configs.preview.services.PROCHELIA_API.service == "prochelia-api-preview"
          ' "$RUNNER_TEMP/pages-project.json" >/dev/null || {
            echo "::error::Pages Preview project is not bound to the isolated Preview D1 and Worker."
            exit 1
          }
          cf_get "Latest Pages Preview deployment list" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/prochelia/deployments?env=preview&per_page=1&page=1" "$RUNNER_TEMP/pages-deployments.json"
          deployment_id="$(jq -r '.result[0].id // empty' "$RUNNER_TEMP/pages-deployments.json")"
          [[ -n "$deployment_id" ]] || { echo "::error::No Pages Preview deployment exists."; exit 1; }
          cf_get "Latest Pages Preview deployment details" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/prochelia/deployments/$deployment_id" "$RUNNER_TEMP/pages-preview.json"
          jq -e --arg expected_branch "$PAGES_EXPECTED_BRANCH" --arg expected "$PAGES_EXPECTED_COMMIT" '
            .result.environment == "preview" and
            .result.is_skipped == false and
            .result.latest_stage.status == "success" and
            .result.uses_functions == true and
            .result.d1_databases.DB.id == "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f" and
            .result.services.PROCHELIA_API.service == "prochelia-api-preview" and
            .result.deployment_trigger.metadata.branch == $expected_branch and
            (.result.deployment_trigger.metadata.commit_hash | type == "string" and test("^[0-9a-f]{40}$")) and
            .result.deployment_trigger.metadata.commit_hash == $expected
          ' "$RUNNER_TEMP/pages-preview.json" >/dev/null || {
            echo "::error::Latest Pages Preview deployment is failed, skipped, misbound or from an unexpected branch."
            jq -c '{id: .result.id, stage: .result.latest_stage, branch: .result.deployment_trigger.metadata.branch, commit: .result.deployment_trigger.metadata.commit_hash, d1: .result.d1_databases.DB.id, service: .result.services.PROCHELIA_API.service, uses_functions: .result.uses_functions}' "$RUNNER_TEMP/pages-preview.json"
            exit 1
          }
          pages_origin="$(jq -r '.result.url' "$RUNNER_TEMP/pages-preview.json")"
          pages_commit="$(jq -r '.result.deployment_trigger.metadata.commit_hash' "$RUNNER_TEMP/pages-preview.json")"
          pages_alias="$(jq -r '.result.aliases[]? | select(test("^https://[a-z0-9-]+\\.prochelia\\.pages\\.dev$"))' "$RUNNER_TEMP/pages-preview.json" | head -n 1)"
          cf_get "Preview Worker settings for existing CORS allowlist" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/prochelia-api-preview/settings" "$RUNNER_TEMP/preview-worker-settings-before.json"
          # Prevent a manual Preview deployment from rolling back fixes already active on the Worker.
          active_worker_commit="$(jq -r '.result.bindings[] | select(.name == "PROCHELIA_COMMIT_SHA" and .type == "plain_text") | .text' "$RUNNER_TEMP/preview-worker-settings-before.json")"
          [[ "$active_worker_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Active Preview Worker commit binding is missing or invalid; refusing deployment."
            exit 1
          }
          if ! git cat-file -e "${active_worker_commit}^{commit}" 2>/dev/null; then
            echo "::error::Active Preview Worker commit is not available in the checked-out Git history; refusing deployment."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$active_worker_commit" "$GITHUB_SHA"; then
            echo "::error::Refusing Preview deployment: candidate commit is not a descendant of the active Preview Worker commit (rollback protection)."
            printf 'Active Worker commit: %s\nCandidate commit: %s\n' "$active_worker_commit" "$GITHUB_SHA"
            exit 1
          fi
          printf 'PREVIEW_ACTIVE_WORKER_COMMIT=%s\n' "$active_worker_commit" >> "$GITHUB_ENV"
          cors_origin="$(jq -r '.result.bindings[] | select(.name == "CORS_ORIGIN" and .type == "plain_text") | .text' "$RUNNER_TEMP/preview-worker-settings-before.json")"
          [[ -n "$cors_origin" && "$cors_origin" != "null" ]] || {
            echo "::error::Preview Worker CORS_ORIGIN is missing; refusing to replace an unknown allowlist."
            exit 1
          }
          IFS=',' read -r -a existing_origins <<< "$cors_origin"
          for allowed_origin in "${existing_origins[@]}"; do
            allowed_origin="$(printf '%s' "$allowed_origin" | sed -E 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ "$allowed_origin" =~ ^https://[a-z0-9-]+\.prochelia\.pages\.dev$ ]] || {
              echo "::error::Existing Preview CORS allowlist contains an origin outside the verified Pages project namespace."
              exit 1
            }
          done
          [[ "$pages_origin" =~ ^https://[a-z0-9-]+\.prochelia\.pages\.dev$ ]] || {
            echo "::error::Cloudflare returned an unexpected Pages Preview origin."
            exit 1
          }
          printf 'PAGES_PREVIEW_ORIGIN=%s\nPAGES_PREVIEW_ALIAS=%s\nPAGES_PREVIEW_DEPLOYMENT_ID=%s\nPAGES_PREVIEW_COMMIT=%s\nPAGES_EXISTING_CORS_ORIGINS=%s\n' \
            "$pages_origin" "$pages_alias" "$deployment_id" "$pages_commit" "$cors_origin" >> "$GITHUB_ENV"
          {
            echo "Verified Pages Preview origin: $pages_origin"
            echo "Pages Preview deployment: $deployment_id"
            echo "Pages Preview commit: $pages_commit"
            [[ -z "$pages_alias" ]] || echo "Pages Preview branch alias: $pages_alias"
            echo "The verified origin and branch alias (when present) will be added to the Preview Worker CORS allowlist."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate isolated Preview deployment config
        run: node scripts/generate-preview-wrangler-config.mjs
      - name: Check Worker source syntax
        run: |
          node --experimental-default-type=module --check src/index.js
          node --experimental-default-type=module --check src/v7.js
          node --experimental-default-type=module --check src/v7-routes.js
      - name: Run backend contract and complete security regression suite
        run: |
          node --test tests/auth-handler-wiring.test.js tests/directory-api.test.js
          node --experimental-default-type=module --test \
            tests/v7-security.test.js \
            tests/deploy-preview-workflow.test.mjs \
            tests/payment-webhook-security.test.js \
            tests/mission-security-atomic.test.js \
            tests/payout-atomicity.test.js \
            tests/payment-settlement-guard.test.js \
            tests/payment-webhook-settlement-gate.test.js \
            tests/bootstrap-atomic.test.js \
            tests/preview-e2e-workflow.test.mjs
      - name: Test D1 backup restore preparation logic
        run: python3 -m unittest tests/test_prepare_d1_restore.py
      - name: Validate Wrangler bundle without deployment
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.preview.generated.json --outdir "$RUNNER_TEMP/prochelia-preview-dry-run"
      - name: Verify Cloudflare token and Preview Worker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "f2a79e9fa41566a8ec80fb24c02c60eb" || { echo "::error::CLOUDFLARE_ACCOUNT_ID does not match the verified Cloudflare account"; exit 1; }

          # Accept either the raw API token or a pasted "Bearer <token>" value.
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          test -n "$token" || { echo "::error::Cloudflare API token is empty after normalization"; exit 1; }

          verify_http="$(curl --silent --show-error --output "$RUNNER_TEMP/cloudflare-token-verify.json" --write-out '%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $token")"
          VERIFY_HTTP="$verify_http" VERIFY_FILE="$RUNNER_TEMP/cloudflare-token-verify.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const http = Number(process.env.VERIFY_HTTP);
          const body = JSON.parse(fs.readFileSync(process.env.VERIFY_FILE, 'utf8'));
          if (http !== 200 || !body.success || body.result?.status !== 'active') {
            console.error(`Cloudflare token verification failed (HTTP ${http}).`);
            for (const e of [...(body.errors || []), ...(body.messages || [])]) {
              console.error(`Cloudflare ${e.code ?? 'message'}: ${e.message ?? 'unspecified error'}`);
            }
            process.exit(1);
          }
          console.log('Cloudflare API token is active.');
          NODE

          scripts_http="$(curl --silent --show-error --output "$RUNNER_TEMP/cloudflare-workers-scripts.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -H "Authorization: Bearer $token")"
          SCRIPTS_HTTP="$scripts_http" SCRIPTS_FILE="$RUNNER_TEMP/cloudflare-workers-scripts.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const http = Number(process.env.SCRIPTS_HTTP);
          const body = JSON.parse(fs.readFileSync(process.env.SCRIPTS_FILE, 'utf8'));
          if (http !== 200 || !body.success) {
            console.error(`Cloudflare Workers access check failed (HTTP ${http}).`);
            for (const e of [...(body.errors || []), ...(body.messages || [])]) {
              console.error(`Cloudflare ${e.code ?? 'message'}: ${e.message ?? 'unspecified error'}`);
            }
            process.exit(1);
          }
          const names = (body.result || []).map(x => x.id);
          if (!names.includes('prochelia-api-preview')) {
            console.error('Preview Worker is not visible to this token/account.');
            process.exit(1);
          }
          console.log('Correct account confirmed; Preview Worker is visible.');
          NODE
      - name: Verify dedicated Preview R2 bucket has EU jurisdiction
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          test -n "$token"
          test "$CLOUDFLARE_ACCOUNT_ID" = "f2a79e9fa41566a8ec80fb24c02c60eb"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/preview-r2-eu.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/prochelia-preview-backups-eu-v2" -H "Authorization: Bearer $token" -H "cf-r2-jurisdiction: eu")"
          test "$status" = "200" || { echo "::error::Dedicated Preview R2 bucket lookup failed (HTTP $status)."; exit 1; }
          jq -e '.success == true and .result.name == "prochelia-preview-backups-eu-v2" and .result.jurisdiction == "eu"' "$RUNNER_TEMP/preview-r2-eu.json" >/dev/null || {
            echo "::error::Preview R2 bucket is not verified in EU jurisdiction; refusing deployment."
            exit 1
          }
          echo "PASS: dedicated Preview R2 bucket jurisdiction is eu."
      - name: Capture current active Preview Worker version before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" == "f2a79e9fa41566a8ec80fb24c02c60eb" ]]
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          [[ -n "$token" ]]
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/preview-worker-before.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/prochelia-api-preview/deployments?per_page=1&page=1")"
          [[ "$status" == "200" ]]
          jq -e '.success == true and (.result.deployments[0].versions | length == 1) and .result.deployments[0].versions[0].percentage == 100' "$RUNNER_TEMP/preview-worker-before.json" >/dev/null || {
            echo "::error::Could not identify one fully active Preview Worker version before deployment."
            exit 1
          }
          previous_version="$(jq -r '.result.deployments[0].versions[0].version_id' "$RUNNER_TEMP/preview-worker-before.json")"
          [[ "$previous_version" =~ ^[0-9a-f-]{36}$ ]]
          printf 'PREVIEW_PREVIOUS_VERSION_ID=%s\n' "$previous_version" >> "$GITHUB_ENV"
          echo "Captured current Preview Worker version for post-deployment comparison."
      - name: Deploy ONLY the isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.preview.generated.json
      - name: Verify deployed Preview Worker version, bindings and commit read-back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" == "f2a79e9fa41566a8ec80fb24c02c60eb" ]]
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          [[ -n "$token" ]]
          cf_get() {
            local label="$1" url="$2" output="$3" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              -H "Authorization: Bearer $token" "$url")"
            if [[ "$status" != "200" ]] || ! jq -e '.success == true' "$output" >/dev/null; then
              echo "::error::$label failed (HTTP $status)."
              jq -c '{errors, messages}' "$output" 2>/dev/null || true
              return 1
            fi
          }
          cf_get "Preview Worker settings read-back" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/prochelia-api-preview/settings" \
            "$RUNNER_TEMP/preview-worker-settings-after.json"
          cf_get "Preview Worker active deployment read-back" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/prochelia-api-preview/deployments?per_page=1&page=1" \
            "$RUNNER_TEMP/preview-worker-deployments-after.json"
          jq -e '.result.deployments[0].versions | length == 1 and .[0].percentage == 100' \
            "$RUNNER_TEMP/preview-worker-deployments-after.json" >/dev/null || {
              echo "::error::The latest Preview Worker deployment is not a single 100% active version."
              exit 1
            }
          active_version="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "$RUNNER_TEMP/preview-worker-deployments-after.json")"
          [[ "$active_version" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$active_version" != "$PREVIEW_PREVIOUS_VERSION_ID" ]] || {
            echo "::error::Preview Worker deployment did not advance to a new version."
            exit 1
          }
          cf_get "Active Preview Worker version resource read-back" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/prochelia-api-preview/versions/$active_version" \
            "$RUNNER_TEMP/preview-worker-version-after.json"
          PREVIEW_SETTINGS_FILE="$RUNNER_TEMP/preview-worker-settings-after.json" \
          PREVIEW_DEPLOYMENTS_FILE="$RUNNER_TEMP/preview-worker-deployments-after.json" \
          PREVIEW_VERSION_FILE="$RUNNER_TEMP/preview-worker-version-after.json" \
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const read = name => JSON.parse(fs.readFileSync(process.env[name], "utf8"));
          const settings = read("PREVIEW_SETTINGS_FILE");
          const deployments = read("PREVIEW_DEPLOYMENTS_FILE");
          const version = read("PREVIEW_VERSION_FILE");
          const fail = message => { console.error(message); process.exit(1); };
          const dbId = "e3cf167c-37e1-4d72-9ac6-b3e27c14b97f";
          const bucketName = "prochelia-preview-backups-eu-v2";
          const sha = process.env.GITHUB_SHA;
          const origin = process.env.PAGES_PREVIEW_ORIGIN;
          const alias = process.env.PAGES_PREVIEW_ALIAS || "";
          const previousOrigins = String(process.env.PAGES_EXISTING_CORS_ORIGINS || "").split(",").map(value => value.trim()).filter(Boolean);
          const active = deployments.result?.deployments?.[0];
          const activeVersionId = active?.versions?.[0]?.version_id;
          if (!active || active.versions?.length !== 1 || active.versions[0].percentage !== 100) fail("Expected one active Preview Worker version at 100%.");
          if (version.result?.id !== activeVersionId) fail("Version details do not match the active Preview Worker deployment.");
          const settingsBindings = settings.result?.bindings || [];
          const versionBindings = version.result?.resources?.bindings || [];
          const find = (items, name, type) => items.find(binding => binding.name === name && binding.type === type);
          const assertBindings = (items, label) => {
            const db = find(items, "DB", "d1");
            const r2 = find(items, "BACKUP_BUCKET", "r2_bucket");
            const appEnv = find(items, "APP_ENV", "plain_text");
            const commit = find(items, "PROCHELIA_COMMIT_SHA", "plain_text");
            const cors = find(items, "CORS_ORIGIN", "plain_text");
            if (!(db?.id === dbId || db?.database_id === dbId)) fail(label + ": D1 Preview binding mismatch.");
            if (r2?.bucket_name !== bucketName || r2?.jurisdiction !== "eu") fail(label + ": R2 EU binding mismatch.");
            if (appEnv?.text !== "preview") fail(label + ": APP_ENV is not preview.");
            if (commit?.text !== sha) fail(label + ": PROCHELIA_COMMIT_SHA does not match this workflow commit.");
            const origins = String(cors?.text || "").split(",").map(value => value.trim());
            if (!origin || !origins.includes(origin)) fail(label + ": exact Pages Preview origin is absent from CORS.");
            if (alias && !origins.includes(alias)) fail(label + ": exact Pages Preview alias is absent from CORS.");
            for (const previousOrigin of previousOrigins) {
              if (!origins.includes(previousOrigin)) fail(label + ": previously authorized CORS origin was dropped: " + previousOrigin);
            }
          };
          assertBindings(settingsBindings, "Worker settings");
          assertBindings(versionBindings, "Active Worker version");
          console.log("PASS: a new Preview Worker version is active at 100%; its exact version bindings confirm Preview D1, EU R2, APP_ENV, API commit SHA and current Pages CORS origins.");
          NODE
      - name: Record deployment guardrails
        run: |
          {
            echo 'Preview Worker only: prochelia-api-preview.'
            echo 'D1 binding is pinned to Preview DB e3cf167c-37e1-4d72-9ac6-b3e27c14b97f.'
            echo "Preview CORS allowlist includes the exact Pages Preview origin and validated branch alias when present."
            echo "Preview API commit deployed: ${GITHUB_SHA} (also exposed by the Preview health probe)."
            echo 'Preview APP_ENV and explicit CORS configuration are applied; no dashboard variables are implicitly preserved. No migrations, no production Worker, and no production D1 changes.'
          } >> "$GITHUB_STEP_SUMMARY"
