name: Deploy PROCHÉLIA API preview only (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PREVIEW_ONLY to deploy the isolated Preview Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prochelia-api-preview-deploy
  cancel-in-progress: false

jobs:
  preview-only:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_PREVIEW_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify isolated Preview target and generate deployment config
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const production = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const expectedPreviewId = '6adb95e5-e542-4bec-9008-fbea01042305';
          const expectedProductionId = '04f52830-ef5a-4f17-a640-42bbc2381bba';
          if (production.name !== 'prochelia-api') throw new Error('Unexpected production Worker config');
          if (!production.d1_databases?.some(db => db.binding === 'DB' && db.database_id === expectedProductionId)) {
            throw new Error('Production D1 identity mismatch; refusing Preview deployment');
          }
          const preview = {
            name: 'prochelia-api-preview',
            main: 'src/index.js',
            compatibility_date: '2026-09-25',
            workers_dev: true,
            keep_vars: true,
            vars: {
              CORS_ORIGIN: [
                'https://c3ceec86.prochelia.pages.dev',
                'https://staging-prochelia-v14-restor.prochelia.pages.dev',
                'https://feat-supra-control-center-v1.prochelia.pages.dev',
                'https://db884f74.prochelia.pages.dev',
                'https://repair-prochelia-frontend-xs.prochelia.pages.dev'
              ].join(',')
            },
            d1_databases: [{
              binding: 'DB',
              database_name: 'prochelia-preview-db',
              database_id: expectedPreviewId
            }],
            observability: { logs: { enabled: true, invocation_logs: true } }
          };
          if (preview.name === production.name || preview.d1_databases.some(db => db.database_id === expectedProductionId)) {
            throw new Error('Preview target is not isolated');
          }
          fs.writeFileSync('wrangler.preview.generated.json', JSON.stringify(preview, null, 2));
          console.log('Preview Worker and Preview D1 identifiers verified; dashboard variables will be preserved.');
          NODE
      - name: Check Worker source syntax
        run: |
          node --experimental-default-type=module --check src/index.js
          node --experimental-default-type=module --check src/v7.js
          node --experimental-default-type=module --check src/v7-routes.js
      - name: Run backend contract and complete security regression suite
        run: |
          node --test tests/auth-handler-wiring.test.js tests/directory-api.test.js
          node --experimental-default-type=module --test \
            tests/v7-security.test.js \
            tests/deploy-preview-workflow.test.mjs \
            tests/payment-webhook-security.test.js \
            tests/mission-security-atomic.test.js \
            tests/payout-atomicity.test.js \
            tests/payment-settlement-guard.test.js \
            tests/payment-webhook-settlement-gate.test.js \
            tests/bootstrap-atomic.test.js \
            tests/preview-e2e-workflow.test.mjs \
            tests/rate-limit-atomicity.test.mjs \
            tests/quality-event-authorization.test.mjs \
            tests/operational-case-human-approval.test.mjs \
            tests/complaint-object-authorization.test.mjs
      - name: Test D1 backup restore preparation logic
        run: python3 -m unittest tests/test_prepare_d1_restore.py
      - name: Validate Wrangler bundle without deployment
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.preview.generated.json --outdir "$RUNNER_TEMP/prochelia-preview-dry-run"
      - name: Verify Cloudflare token and Preview Worker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "f2a79e9fa41566a8ec80fb24c02c60eb" || { echo "::error::CLOUDFLARE_ACCOUNT_ID does not match the verified Cloudflare account"; exit 1; }

          # Accept either the raw API token or a pasted "Bearer <token>" value.
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//' | tr -d '\r\n')"
          test -n "$token" || { echo "::error::Cloudflare API token is empty after normalization"; exit 1; }

          verify_http="$(curl --silent --show-error --output "$RUNNER_TEMP/cloudflare-token-verify.json" --write-out '%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $token")"
          VERIFY_HTTP="$verify_http" VERIFY_FILE="$RUNNER_TEMP/cloudflare-token-verify.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const http = Number(process.env.VERIFY_HTTP);
          const body = JSON.parse(fs.readFileSync(process.env.VERIFY_FILE, 'utf8'));
          if (http !== 200 || !body.success || body.result?.status !== 'active') {
            console.error(`Cloudflare token verification failed (HTTP ${http}).`);
            for (const e of [...(body.errors || []), ...(body.messages || [])]) {
              console.error(`Cloudflare ${e.code ?? 'message'}: ${e.message ?? 'unspecified error'}`);
            }
            process.exit(1);
          }
          console.log('Cloudflare API token is active.');
          NODE

          scripts_http="$(curl --silent --show-error --output "$RUNNER_TEMP/cloudflare-workers-scripts.json" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -H "Authorization: Bearer $token")"
          SCRIPTS_HTTP="$scripts_http" SCRIPTS_FILE="$RUNNER_TEMP/cloudflare-workers-scripts.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const http = Number(process.env.SCRIPTS_HTTP);
          const body = JSON.parse(fs.readFileSync(process.env.SCRIPTS_FILE, 'utf8'));
          if (http !== 200 || !body.success) {
            console.error(`Cloudflare Workers access check failed (HTTP ${http}).`);
            for (const e of [...(body.errors || []), ...(body.messages || [])]) {
              console.error(`Cloudflare ${e.code ?? 'message'}: ${e.message ?? 'unspecified error'}`);
            }
            process.exit(1);
          }
          const names = (body.result || []).map(x => x.id);
          if (!names.includes('prochelia-api-preview')) {
            console.error('Preview Worker is not visible to this token/account.');
            process.exit(1);
          }
          console.log('Correct account confirmed; Preview Worker is visible.');
          NODE
      - name: Deploy ONLY the isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.preview.generated.json --keep-vars
      - name: Record deployment guardrails
        run: |
          {
            echo 'Preview Worker only: prochelia-api-preview.'
            echo 'D1 binding is pinned to Preview DB 6adb95e5-e542-4bec-9008-fbea01042305.'
            echo "Backend source deployed from commit ${GITHUB_SHA}. Preview CORS allowlist includes the exact Pages Preview origin."
            echo 'Dashboard vars and existing secrets are preserved. No migrations, no production Worker, and no production D1 changes.'
          } >> "$GITHUB_STEP_SUMMARY"
