name: PROCHÉLIA — comparer les volumes D1 sans modification

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirmer que les deux bases seront interrogées en lecture seule"
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: prochelia-d1-readonly-compare
  cancel-in-progress: false

jobs:
  compare:
    name: Comparer préproduction et restauration v2
    if: ${{ inputs.confirm_read_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: f2a79e9fa41566a8ec80fb24c02c60eb
      PREVIEW_DB_NAME: prochelia-preview-db
      PREVIEW_DB_ID: 6adb95e5-e542-4bec-9008-fbea01042305
      TEST_DB_NAME: prochelia-restore-test-v2
      TEST_DB_ID: a3526c2a-39cb-49ab-97c4-979138145f33
    steps:
      - name: Vérifier le jeton et les deux cibles exactes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Secret Cloudflare manquant."; exit 1; }
          token="$CLOUDFLARE_API_TOKEN"
          token="${token#Bearer }"
          token="${token#bearer }"
          token="$(printf '%s' "$token" | tr -d '\r\n')"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/token.json" --write-out '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          [[ "$status" == "200" ]] && [[ "$(jq -r '.success // false' "$RUNNER_TEMP/token.json")" == "true" ]] && [[ "$(jq -r '.result.status // ""' "$RUNNER_TEMP/token.json")" == "active" ]] || { echo "::error::Jeton Cloudflare invalide ou inactif."; exit 1; }
          for target in preview test; do
            if [[ "$target" == "preview" ]]; then name="$PREVIEW_DB_NAME"; id="$PREVIEW_DB_ID"; else name="$TEST_DB_NAME"; id="$TEST_DB_ID"; fi
            http="$(curl --silent --show-error --output "$RUNNER_TEMP/d1-$target.json" --write-out '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$name")"
            [[ "$http" == "200" ]] || { echo "::error::Impossible de vérifier la base $target (HTTP $http)."; exit 1; }
            matches="$(jq --arg n "$name" --arg id "$id" '[.result[]? | select(.name == $n and .uuid == $id)] | length' "$RUNNER_TEMP/d1-$target.json")"
            [[ "$matches" == "1" ]] || { echo "::error::Nom/UUID inattendu pour $target ; arrêt."; exit 1; }
          done
          [[ "$PREVIEW_DB_ID" != "$TEST_DB_ID" ]] || { echo "::error::Les deux UUID doivent être distincts."; exit 1; }
          echo "Les deux bases sont identifiées exactement. Aucune écriture ne sera effectuée."

      - name: Installer Wrangler une seule fois
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Préparer l'outil D1
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund wrangler@4
          ./node_modules/.bin/wrangler --version

      - name: Comparer les tables et les nombres de lignes en lecture seule
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN
          out="$RUNNER_TEMP/d1-compare"
          mkdir -p "$out"

          for target in preview test; do
            if [[ "$target" == "preview" ]]; then db="$PREVIEW_DB_NAME"; id="$PREVIEW_DB_ID"; else db="$TEST_DB_NAME"; id="$TEST_DB_ID"; fi
            config="$out/$target-wrangler.json"
            cat > "$config" <<EOF
          {
            "name": "prochelia-readonly-$target",
            "compatibility_date": "2026-09-25",
            "d1_databases": [
              { "binding": "DB", "database_name": "$db", "database_id": "$id" }
            ]
          }
          EOF

            echo "::group::Lecture des tables — $target ($db)"
            raw="$out/$target-tables.json"
            if ! timeout 60s ./node_modules/.bin/wrangler d1 execute "$db" --remote --config "$config" --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT GLOB '_cf_*' ORDER BY name;" --json > "$raw"; then
              echo "::error::Échec de lecture de la liste des tables pour $target."
              exit 1
            fi
            jq -e . "$raw" >/dev/null
            jq -r '[.. | objects | select(has("results")) | .results[]? | .name? // empty] | map(select(type == "string")) | unique | .[]' "$raw" > "$out/$target-tables.txt"
            [[ -s "$out/$target-tables.txt" ]] || { echo "::error::Aucune table détectée pour $target ; arrêt par sécurité."; exit 1; }

            sql=""
            while IFS= read -r table; do
              [[ "$table" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::Nom de table inattendu ; arrêt."; exit 1; }
              statement="SELECT '$table' AS table_name, COUNT(*) AS row_count FROM \"$table\""
              if [[ -n "$sql" ]]; then sql="$sql UNION ALL $statement"; else sql="$statement"; fi
            done < "$out/$target-tables.txt"
            sql="$sql ORDER BY table_name"

            echo "Tables détectées : $(wc -l < "$out/$target-tables.txt" | tr -d ' ')"
            echo "::endgroup::"
            echo "::group::Comptage groupé — $target ($db)"
            counts="$out/$target-counts.json"
            if ! timeout 90s ./node_modules/.bin/wrangler d1 execute "$db" --remote --config "$config" --command="$sql" --json > "$counts"; then
              echo "::error::Échec du comptage groupé pour $target."
              exit 1
            fi
            jq -e . "$counts" >/dev/null
            jq -r '[.. | objects | select(has("results")) | .results[]? | select(.table_name != null and .row_count != null) | [.table_name, (.row_count|tostring)] | @csv] | .[]' "$counts" > "$out/$target-row-counts.csv"
            [[ -s "$out/$target-row-counts.csv" ]] || { echo "::error::Le résultat de comptage est vide pour $target."; exit 1; }
            printf 'table,row_count\n' | cat - "$out/$target-row-counts.csv" > "$out/$target-row-counts.tmp"
            mv "$out/$target-row-counts.tmp" "$out/$target-row-counts.csv"
            echo "Comptage terminé pour $target."
            echo "::endgroup::"
          done

          {
            echo "## Comparaison D1 en lecture seule"
            echo ""
            echo "Aucune instruction d'écriture n'a été exécutée."
            echo ""
            echo "### Préproduction"
            cat "$out/preview-row-counts.csv"
            echo ""
            echo "### Restauration v2"
            cat "$out/test-row-counts.csv"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les rapports CSV sans données personnelles
        uses: actions/upload-artifact@v6
        with:
          name: prochelia-d1-readonly-comparison-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/d1-compare/preview-row-counts.csv
            ${{ runner.temp }}/d1-compare/test-row-counts.csv
          if-no-files-found: error
          retention-days: 30
