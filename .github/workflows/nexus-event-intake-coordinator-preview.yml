name: Nexus Event Intake Coordinator Preview Tests

on:
  pull_request:
    paths:
      - "src/nexus-event-intake-coordinator.js"
      - "src/nexus-event-contract.js"
      - "src/nexus-event-routing-policy.js"
      - "src/nexus-event-idempotency.js"
      - "src/nexus-event-retry-quarantine.js"
      - "tests/nexus-event-intake-coordinator.test.mjs"
      - ".github/workflows/nexus-event-intake-coordinator-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake-coordinator-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check composed policies
        run: |
          node --experimental-default-type=module --check src/nexus-event-contract.js
          node --experimental-default-type=module --check src/nexus-event-routing-policy.js
          node --experimental-default-type=module --check src/nexus-event-idempotency.js
          node --experimental-default-type=module --check src/nexus-event-retry-quarantine.js
          node --experimental-default-type=module --check src/nexus-event-intake-coordinator.js
      - name: Run intake composition tests
        run: node --experimental-default-type=module --test tests/nexus-event-intake-coordinator.test.mjs
