name: PROCHÉLIA prelaunch audit checks
on:
  push:
    branches:
      - prelaunch/v14.5.7-consolidation-audit
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prochelia-prelaunch-audit
  cancel-in-progress: false
jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Syntax check
        run: |
          node --input-type=module --check < src/index.js
          node --input-type=module --check < src/v7.js
          node --input-type=module --check < src/v7-routes.js
          node --input-type=module --check < src/stripe-adapter.js
          node --input-type=module --check < src/trust-passport.js
          node --check security/clamav-gateway/server.mjs
      - name: Critical regression tests
        run: node --test tests/v14-5-6-critical-fixes.test.mjs tests/stripe-adapter.behavior.test.mjs tests/trust-passport.test.mjs tests/trust-passport-runtime.test.mjs tests/backup-retention-policy.test.mjs
